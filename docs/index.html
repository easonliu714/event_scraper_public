<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>台灣活動情報雷達 📡</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1a1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <style>
        :root { --bg: #121212; --card: #1e1e1e; --text: #e0e0e0; --accent: #3b82f6; --chip-bg: #2a2a2a; }
        body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); padding-bottom: 60px; overscroll-behavior-y: contain; }
        
        #pull-to-refresh {
            position: fixed; top: -50px; left: 0; width: 100%; height: 50px;
            display: flex; justify-content: center; align-items: center;
            color: var(--accent); font-size: 1.2rem; transition: top 0.2s; z-index: 200;
        }
        #pull-to-refresh.visible { top: 60px; }
        .spinner { animation: spin 1s linear infinite; display: none; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        header { position: sticky; top: 0; z-index: 100; background: rgba(18,18,18,0.95); backdrop-filter: blur(10px); padding: 12px 16px; border-bottom: 1px solid #333; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        h1 { margin: 0; font-size: 1.2rem; }
        .header-actions { display: flex; gap: 12px; }
        .action-btn { background: none; border: none; font-size: 1.2rem; cursor: pointer; color: #aaa; transition: 0.2s; }
        .action-btn:hover { color: #fff; }

        .search-box { width: 100%; padding: 12px; border-radius: 12px; background: #2a2a2a; border: 1px solid #333; color: #fff; font-size: 1rem; }
        
        .filter-section { padding: 16px; background: #181818; border-bottom: 1px solid #333; }
        .filter-block { margin-bottom: 16px; }
        .block-title { font-size: 0.85rem; color: #888; margin-bottom: 8px; }
        .chips { display: flex; flex-wrap: wrap; gap: 8px; }
        .chip { padding: 6px 12px; background: var(--chip-bg); border-radius: 8px; font-size: 0.9rem; cursor: pointer; border: 1px solid #333; transition: 0.2s; display: flex; gap: 6px; }
        .chip span { opacity: 0.6; font-size: 0.8em; }
        .chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
        .chip.active span { opacity: 1; color: #fff; }
        
        .list-header { padding: 12px 16px; font-size: 0.9rem; color: #aaa; background: #121212; border-bottom: 1px solid #222; }
        .list-info-row { display: flex; justify-content: space-between; align-items: center; }
        .disclaimer { font-size: 0.75rem; color: #666; margin-top: 6px; padding-top: 6px; border-top: 1px solid #333; text-align: right; }
        
        #event-list { max-width: 800px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-height: 300px; }
        .card { background: var(--card); border-radius: 12px; padding: 12px; display: flex; gap: 12px; border: 1px solid #333; }
        .card.read { opacity: 0.6; }
        .card-img { width: 90px; height: 90px; border-radius: 8px; background: #333; object-fit: cover; }
        .card-info { flex: 1; display: flex; flex-direction: column; gap: 4px; }
        .badges { display: flex; flex-wrap: wrap; gap: 4px; font-size: 0.75rem; }
        .badge { padding: 2px 6px; border-radius: 4px; background: #333; color: #ccc; }
        .badge.new { background: #ef4444; color: #fff; }
        .badge.fav { background: #f59e0b; color: #fff; }
        
        .pagination { display: flex; justify-content: center; align-items: center; gap: 16px; margin: 20px 0; }
        .page-btn { padding: 8px 16px; background: #333; border: none; color: #fff; border-radius: 8px; cursor: pointer; }
        .page-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 200; display: none; justify-content: center; align-items: end; }
        .modal-overlay.open { display: flex; }
        .modal { background: #222; width: 100%; max-width: 600px; padding: 24px; border-radius: 20px 20px 0 0; max-height: 90vh; overflow-y: auto; }
        
        .settings-panel { padding: 16px; background: #2a2a2a; border-radius: 12px; margin-bottom: 16px; }
        .keyword-input { width: 100%; padding: 10px; border-radius: 8px; background: #121212; border: 1px solid #444; color: #fff; margin-bottom: 8px; }
        .tags-container { display: flex; flex-wrap: wrap; gap: 8px; }
        .tag { background: #444; padding: 4px 10px; border-radius: 16px; font-size: 0.85rem; display: flex; gap: 6px; }
        /* Make the native hidden attribute win over layout display rules. */
        [hidden] { display:none !important; }
    </style>
</head>
<body>

<div id="pull-to-refresh">
    <span id="ptr-icon">⬇️ 下拉更新</span>
    <span id="ptr-spinner" class="spinner">🔄</span>
</div>

<header>
    <div class="top-bar">
        <h1>📡 活動雷達</h1>
        <a href="platform-status.html" style="color:#93c5fd;font-size:0.82rem;border:1px solid #496179;border-radius:8px;padding:5px 9px;text-decoration:none;white-space:nowrap;" aria-label="查看19平台抓取、解析及實機驗證狀態">平台進度／19站</a>
        <div class="header-actions">
            <button class="action-btn" onclick="markAllRead()" title="全部設為已讀">✅</button>
            <button class="action-btn" onclick="openSettings()" title="設定">⚙️</button>
        </div>
    </div>
    <input type="text" id="search" class="search-box" placeholder="搜尋關鍵字..." oninput="resetPageAndRender()">
    <!-- Isolated review: local file picker only; no candidate data is shipped as the formal event feed. -->
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:7px 4px">
      <button id="candidate-pick" type="button" onclick="document.getElementById('candidate-file-input').click()" style="background:#1e3a5f;color:#e5f1ff;border:1px solid #60a5fa;border-radius:8px;padding:8px 12px;cursor:pointer">匯入候選 JSON（本機預覽）</button>
      <input id="candidate-file-input" type="file" accept=".json,application/json" onchange="loadCandidateReview(event)" hidden>
      <span id="candidate-review-msg" role="status" style="font-size:0.78rem;color:#fbbf24"></span>
    </div>
</header>

<div class="filter-section">
    <div class="filter-block">
        <div class="block-title">🏛️ 平台篩選</div>
        <div id="platform-chips" class="chips"></div>
    </div>
    
    <div class="filter-block">
        <div class="block-title">📍 地區篩選 (含聯集，未定區域自動保留)</div>
        <div id="region-chips" class="chips"></div>
    </div>

    <div class="filter-block">
        <div class="block-title">✨ 狀態篩選</div>
        <div class="chips" id="status-chips"></div>
    </div>
    <div class="filter-block">
        <div class="block-title">🏷️ 類別篩選</div>
        <div id="type-chips" class="chips"></div>
    </div>
</div>

<div class="list-header">
    <div class="list-info-row">
        <span id="result-count">顯示 0 筆活動</span>
        <span id="update-time" style="font-size:0.8em">更新於: ...</span>
    </div>
    <div class="disclaimer">⚠️ 活動列表僅供參考，活動內容以各平台資訊為準。</div>
</div>

<div id="event-list"></div>
<section id="candidate-review-list" aria-label="候選活動檢視（不發布）" hidden style="max-width:800px;margin:auto;padding:16px">
  <div style="border:1px solid #f59e0b;border-radius:10px;padding:12px;margin-bottom:14px;color:#fde68a;background:#302819">
    <strong>候選活動 REVIEW／非正式發布</strong>
    <p style="font-size:0.85rem;color:#fef3c7;margin:6px 0">只讀取這次由您手動選取的本機 JSON。未取得 Golden／正式發布許可，不代表活動可售或即時有票。</p>
    <button type="button" onclick="closeCandidateReview()" style="padding:8px 12px;border-radius:7px;background:#334155;color:white;border:0">返回正式活動清單</button>
  </div>
  <p id="candidate-review-count" style="color:#fcd34d"></p>
  <div id="candidate-review-cards" aria-live="polite"></div>
</section>

<div class="pagination">
    <button class="page-btn" onclick="changePage(-1)" id="prev-btn">◀ 上一頁</button>
    <span id="page-info">第 1 / 1 頁</span>
    <button class="page-btn" onclick="changePage(1)" id="next-btn">下一頁 ▶</button>
</div>

<div class="modal-overlay" id="detail-modal" onclick="closeModal()">
    <div class="modal" onclick="event.stopPropagation()">
        <img id="m-img" style="width:100%; max-height:250px; object-fit:cover; border-radius:12px; margin-bottom:16px; display:none;">
        
        <div style="margin-bottom:8px;">
            <span id="m-platform" class="badge" style="background:#333; color:#60a5fa; padding:4px 8px; border-radius:4px; font-size:0.8rem;"></span>
            <span id="m-type" class="badge" style="background:#333; color:#ccc; padding:4px 8px; border-radius:4px; font-size:0.8rem;"></span>
        </div>

        <h2 id="m-title" style="margin-bottom:15px; line-height: 1.4;"></h2>
        
        <div style="background: #2a2a2a; padding: 12px; border-radius: 8px; margin-bottom: 16px; font-size: 0.95rem;">
            <div style="margin-bottom: 6px;">📅 <b>日期：</b><span id="m-date" style="color:#ddd"></span></div>
            <div style="margin-bottom: 6px;">📍 <b>地點：</b><span id="m-location" style="color:#ddd"></span></div>
            <div>💰 <b>票價：</b><span id="m-price" style="color:#ddd"></span></div>
        </div>

        <div style="margin-bottom: 20px;">
            <h4 style="margin: 0 0 8px 0; color: #888; font-size: 0.9rem;">📝 活動簡介</h4>
            <p id="m-desc" style="color: #ccc; font-size: 0.95rem; line-height: 1.6; white-space: pre-line; max-height: 300px; overflow-y: auto;"></p>
        </div>

        <a id="m-link" href="#" target="_blank" style="display:block; padding:12px; background:#3b82f6; color:#fff; text-align:center; border-radius:8px; text-decoration:none; font-weight:bold;">前往官網查看詳情</a>
    </div>
</div>

<div class="modal-overlay" id="settings-modal" onclick="closeModal()">
    <div class="modal" onclick="event.stopPropagation()">
        <h2>⚙️ 設定</h2>
        
        <div class="settings-panel">
            <div class="block-title">🔔 通知設定</div>
            <button onclick="requestNotifyPermission()" style="width:100%; padding:10px; background:#333; color:#fff; border:none; border-radius:8px; margin-top:8px;">
                檢查通知權限
            </button>
            <p id="notify-status" style="font-size:0.8rem; color:#888; margin-top:8px; text-align:center;">
                狀態: 未知
            </p>
            <p style="font-size:0.75rem; color:#666; margin-top:4px; line-height:1.4;">
                ⚠️ PWA 限制：網頁必須在開啟狀態下(或下拉刷新時)才能觸發通知。
            </p>
        </div>

        <div class="settings-panel">
            <label>⭐ 關注關鍵字 (按 Enter 新增)</label>
            <input type="text" id="keyword-input" class="keyword-input">
            <div id="keywords-tags" class="tags-container"></div>
        </div>
    </div>
</div>

<script>
    // Stage B: candidate file is never added to allEvents, localStorage, notification or docs/data.json.
    let candidateReviewActive = false;
    let candidateReviewRows = [];
    let allEvents = [];
    let filteredEvents = [];
    let currentPage = 1;
    const PAGE_SIZE = 50;
    
    // [修改] 增加 regions 篩選器
    const filters = { platforms: new Set(), status: new Set(), types: new Set(), regions: new Set() };
    let myKeywords = JSON.parse(localStorage.getItem('myKeywords') || '[]');
    let readEvents = JSON.parse(localStorage.getItem('readEvents') || '[]');

    // 下拉更新邏輯 (保持不變)
    let touchStartY = 0;
    const ptrEl = document.getElementById('pull-to-refresh');
    const ptrIcon = document.getElementById('ptr-icon');
    const ptrSpinner = document.getElementById('ptr-spinner');

    window.addEventListener('touchstart', e => { if (window.scrollY === 0) touchStartY = e.touches[0].clientY; });
    window.addEventListener('touchmove', e => {
        if (window.scrollY === 0 && e.touches[0].clientY > touchStartY) {
            if (e.touches[0].clientY - touchStartY > 60) {
                ptrEl.style.top = '60px'; ptrIcon.style.display = 'block'; ptrSpinner.style.display = 'none';
            }
        }
    });
    window.addEventListener('touchend', async e => {
        if (ptrEl.style.top === '60px') {
            ptrIcon.style.display = 'none'; ptrSpinner.style.display = 'block';
            await init();
            setTimeout(() => { ptrEl.style.top = '-50px'; }, 500);
        }
    });

    // L8 REVIEW display boundary: row-level HTTPS and REVIEW flags do not prove
    // an optional field. Only an exact source-bound REVIEW receipt may be shown.
    // Missing/mismatched provenance stays 未確認, never a guessed event fact.
    function candidateReviewField(row, meta, key, allowedRoles) {
        const value = row[key];
        if (typeof value !== 'string' || !value.trim()
            || value.trim() === '未確認' || value.trim() === '詳內文')
            return { value: '未確認', hold: null };
        const receipt = meta.field_evidence && meta.field_evidence[key];
        const sources = Array.isArray(meta.sources) ? meta.sources : [];
        const timestamp = receipt && receipt.observed_at;
        const validTime = typeof timestamp === 'string'
            && /(Z|[+-]\d{2}:\d{2})$/i.test(timestamp)
            && !Number.isNaN(Date.parse(timestamp));
        const proven = receipt && typeof receipt === 'object'
            && validTime && receipt.value === value
            && typeof receipt.source === 'string'
            && sources.includes(row.url) && sources.includes(receipt.source)
            // No cross-event receipt may prove a local REVIEW field without
            // a separately verified same-event identity edge in this schema.
            && receipt.source === row.url
            && isCandidateOfficialUrl(receipt.source)
            && typeof receipt.role === 'string'
            && allowedRoles.includes(receipt.role)
            && receipt.decision === 'REVIEW';
        return proven
            ? { value, hold: null }
            : { value: '未確認', hold: 'FIELD_' + key.toUpperCase() + '_PROVENANCE_HOLD' };
    }

    // Review-only: an explicit local-file gesture, strict provenance and fail-closed checks.
    // The candidate dataset stays in memory and cannot trigger official activity notifications.
    async function loadCandidateReview(event) {
        const input = event.target;
        const file = input.files && input.files[0];
        input.value = '';
        if (!file) return;
        const msg = document.getElementById('candidate-review-msg');
        try {
            if (file.size > 2 * 1024 * 1024) throw new Error('候選檔案超過 2 MB');
            const parsed = JSON.parse(await file.text());
            if (!Array.isArray(parsed) || parsed.length < 1 || parsed.length > 500)
                throw new Error('必須是 1～500 筆活動的 JSON 陣列');
            const items = parsed.map((row, i) => {
                const meta = row && row._candidate;
                if (!row || typeof row !== 'object' || !meta || meta.scope !== 'CANDIDATE_PREVIEW_ONLY'
                    || !['REVIEW', 'REVIEW_WITH_HOLD'].includes(meta.decision)
                    || meta.published !== false || meta.formal_field_pass !== false
                    || meta.golden_accepted !== false || !Array.isArray(meta.hold_reasons)
                    || !meta.hold_reasons.length
                    || typeof row.title !== 'string' || row.title.length > 180 || !row.title.trim()
                    || typeof row.platform !== 'string' || !row.platform
                    || typeof row.url !== 'string' || !isCandidateOfficialUrl(row.url)) {
                    throw new Error('第 ' + (i + 1) + ' 筆缺乏安全的 REVIEW 身分／官方 URL／未發布標記');
                }
                // Optional field values must have the same exact provenance
                // contract as the isolated Python L7 review builder.
                const fieldRoles = {
                    date: ['EVENT_DATE', 'VENUE_EVENT_DATE'],
                    location: ['EVENT_VENUE'],
                    price: ['EVENT_ADMISSION_PRICE'],
                    description: ['EVENT_DESCRIPTION']
                };
                const fields = Object.fromEntries(Object.entries(fieldRoles)
                    .map(([key, roles]) => [key, candidateReviewField(row, meta, key, roles)]));
                const holds = Object.values(fields).map(x => x.hold).filter(Boolean);
                return {
                    title: row.title, url: row.url, platform: row.platform,
                    type: typeof row.type === 'string' ? row.type : '其他',
                    date: fields.date.value,
                    location: fields.location.value,
                    price: fields.price.value,
                    description: fields.description.value === '未確認' ? '' : fields.description.value,
                    reasons: [...meta.hold_reasons.map(x => String(x)), ...holds],
                    decision: meta.decision
                };
            });
            candidateReviewRows = items;
            candidateReviewActive = true;
            for (const sel of ['#event-list', '.pagination', '.filter-section', '.list-header', '#search'])
                document.querySelector(sel).hidden = true;
            document.getElementById('candidate-review-list').hidden = false;
            document.getElementById('candidate-review-msg').textContent = '候選預覽已載入 ' + items.length + ' 筆（未發布）';
            renderCandidateReview();
        } catch (e) {
            msg.textContent = '匯入拒絕：' + String(e.message || e);
            // A rejected file does not modify existing formal records or active review state.
        }
    }

    function isCandidateOfficialUrl(raw) {
        try {
            const u = new URL(raw);
            return u.protocol === 'https:' && u.hostname && !u.username && !u.password;
        } catch (_) { return false; }
    }

    function renderCandidateReview() {
        const root = document.getElementById('candidate-review-cards');
        root.replaceChildren();
        document.getElementById('candidate-review-count').textContent =
            '顯示 ' + candidateReviewRows.length + ' 筆候選（全部 REVIEW／不表示可售）';
        candidateReviewRows.forEach((eventItem, i) => {
            const card = document.createElement('button');
            card.type = 'button';
            card.className = 'card';
            card.style.cssText = 'width:100%;text-align:left;color:#e5e7eb;cursor:pointer;margin-bottom:12px';
            const body = document.createElement('div');
            body.className = 'card-info';
            for (const [value, css] of [
                [eventItem.platform + '｜' + eventItem.decision, 'color:#fbbf24;font-size:0.8rem'],
                [eventItem.title, 'font-weight:600;font-size:1.05rem'],
                [eventItem.date + '｜' + eventItem.location, 'font-size:0.82rem;color:#a8b8c8']
            ]) {
                const el = document.createElement('div');
                el.style.cssText = css;
                el.textContent = value;
                body.append(el);
            }
            card.append(body);
            card.addEventListener('click', () => openCandidateDetail(i));
            root.append(card);
        });
    }

    function openCandidateDetail(i) {
        if (!candidateReviewActive || !Number.isInteger(i)) return;
        const e = candidateReviewRows[i];
        if (!e) return;
        // No readEvents/localStorage/notification changes. Only safe text nodes and HTTPS link.
        document.getElementById('m-title').textContent = e.title;
        document.getElementById('m-platform').textContent = e.platform + '｜REVIEW';
        document.getElementById('m-type').textContent = e.type;
        document.getElementById('m-date').textContent = e.date;
        document.getElementById('m-location').textContent = e.location;
        document.getElementById('m-price').textContent = e.price;
        document.getElementById('m-desc').textContent =
            (e.description || '官方摘要尚未確認') + '\n\n待驗：' + e.reasons.join('；');
        const link = document.getElementById('m-link');
        link.href = e.url; link.rel = 'noopener noreferrer';
        const img = document.getElementById('m-img');
        img.removeAttribute('src'); img.style.display = 'none';
        document.getElementById('detail-modal').classList.add('open');
    }

    function closeCandidateReview() {
        closeModal();
        candidateReviewActive = false;
        candidateReviewRows = [];
        for (const sel of ['#event-list', '.pagination', '.filter-section', '.list-header', '#search'])
            document.querySelector(sel).hidden = false;
        document.getElementById('candidate-review-list').hidden = true;
        document.getElementById('candidate-review-msg').textContent = '';
        renderList(); renderPagination();
    }

    async function init() {
        checkNotifyStatus();
        
        // 重試機制 (解決 CDN 延遲)
        const maxRetries = 3;
        let attempt = 0;
        let success = false;

        while (attempt < maxRetries && !success) {
            try {
                const timestamp = Date.now();
                const res = await fetch(`data.json?t=${timestamp}`, {
                    cache: 'no-store',
                    headers: {
                        'Cache-Control': 'no-cache, no-store, must-revalidate',
                        'Pragma': 'no-cache',
                        'Expires': '0'
                    }
                });

                if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
                
                allEvents = await res.json();
                allEvents.sort((a,b) => new Date(b.scraped_at) - new Date(a.scraped_at));
                
                const latestTime = allEvents[0]?.scraped_at;
                const lastKnownTime = localStorage.getItem('lastDataTime');
                if (latestTime && latestTime !== lastKnownTime) {
                    localStorage.setItem('lastDataTime', latestTime);
                    checkAndNotifyNewFavs();
                }

                document.getElementById('update-time').textContent = `更新於: ${new Date(allEvents[0]?.scraped_at).toLocaleString()}`;
                
                document.getElementById('event-list').innerHTML = ''; 
                renderChips();
                applyFilters();
                success = true;

            } catch(e) {
                console.error(`Attempt ${attempt + 1} failed:`, e);
                attempt++;
                if (attempt < maxRetries) {
                    await new Promise(r => setTimeout(r, 1000));
                } else {
                    document.getElementById('event-list').innerHTML = `
                        <div style="text-align:center; padding:40px; color:#ff6b6b;">
                            <div style="font-size:3rem; margin-bottom:10px;">📡</div>
                            <div>連線不穩或資料更新中</div>
                            <div style="font-size:0.8rem; opacity:0.7; margin-top:5px;">請嘗試下拉頁面重新整理</div>
                        </div>`;
                }
            }
        }
    }

    function checkAndNotifyNewFavs() {
        if (Notification.permission !== "granted") return;
        const newFavs = allEvents.filter(e => !readEvents.includes(e.url) && checkIsFav(e.title));
        if (newFavs.length > 0) {
            new Notification("📡 活動雷達：發現關注活動！", {
                body: `發現 ${newFavs.length} 筆新的關注活動，點擊查看！`,
                icon: 'icons/icon-192.png',
                tag: 'fav-event-alert'
            });
        }
    }

    function markAllRead() {
        if (candidateReviewActive) return; // do not change stored formal read flags from review mode
        if(!confirm("確定要將所有活動設為已讀嗎？")) return;
        const currentUrls = allEvents.map(e => e.url);
        const uniqueReads = new Set([...readEvents, ...currentUrls]);
        readEvents = Array.from(uniqueReads);
        localStorage.setItem('readEvents', JSON.stringify(readEvents));
        updateStatusCounts();
        renderList();
    }

    function checkIsFav(title) {
        if (!title) return false;
        const t = title.toLowerCase();
        return myKeywords.some(k => t.includes(k.toLowerCase()));
    }

    function renderChips() {
        // 1. 平台篩選 (Platforms)
        const pStats = {}; 
        allEvents.forEach(e => pStats[e.platform] = (pStats[e.platform]||0)+1);
        document.getElementById('platform-chips').innerHTML = Object.entries(pStats)
            .sort((a,b) => b[1]-a[1])
            .map(([k,v]) => {
                // 增加 isActive 判斷，確保下拉更新後選取狀態不會消失
                const isActive = filters.platforms.has(k) ? 'active' : '';
                return `<div class="chip ${isActive}" onclick="toggleFilter('platforms', '${k}', this)">${k} <span>${v}</span></div>`;
            }).join('');

        // 2. 地區篩選 (Regions) - [新增] 動態生成邏輯
        const regionMap = [
            { key: 'north', label: '北區' },
            { key: 'central', label: '中區' },
            { key: 'south', label: '南區' },
            { key: 'east', label: '東區' },
            { key: 'islands', label: '離島' }
        ];
        
        // 計算各地區數量
        const rStats = { 'north': 0, 'central': 0, 'south': 0, 'east': 0, 'islands': 0 };
        allEvents.forEach(e => {
            if (e.region) {
                const r = e.region.toLowerCase();
                if (rStats.hasOwnProperty(r)) rStats[r]++;
            }
        });

        // 生成 HTML
        document.getElementById('region-chips').innerHTML = regionMap.map(item => {
            const count = rStats[item.key] || 0;
            const isActive = filters.regions.has(item.key) ? 'active' : '';
            return `<div class="chip ${isActive}" onclick="toggleFilter('regions', '${item.key}', this)">${item.label} <span>${count}</span></div>`;
        }).join('');

        // 3. 類別篩選 (Types)
        const tStats = {}; 
        allEvents.forEach(e => tStats[e.type] = (tStats[e.type]||0)+1);
        document.getElementById('type-chips').innerHTML = Object.entries(tStats)
            .sort((a,b) => b[1]-a[1])
            .map(([k,v]) => {
                const isActive = filters.types.has(k) ? 'active' : '';
                return `<div class="chip ${isActive}" onclick="toggleFilter('types', '${k}', this)">${k} <span>${v}</span></div>`;
            }).join('');

        updateStatusCounts();
    }
    
    function updateStatusCounts() {
        const newCount = allEvents.filter(e => !readEvents.includes(e.url)).length;
        const favCount = allEvents.filter(e => checkIsFav(e.title)).length;
        
        const isNewActive = filters.status.has('isNew') ? 'active' : '';
        const isFavActive = filters.status.has('isFav') ? 'active' : '';
        document.getElementById('status-chips').innerHTML = `
            <div class="chip ${isNewActive}" onclick="toggleFilter('status', 'isNew', this)">🆕 新進活動 <span>${newCount}</span></div>
            <div class="chip ${isFavActive}" onclick="toggleFilter('status', 'isFav', this)">⭐ 關注關鍵字 <span>${favCount}</span></div>
        `;
    }

    function toggleFilter(category, value, el) {
        el.classList.toggle('active');
        if (filters[category].has(value)) filters[category].delete(value);
        else filters[category].add(value);
        resetPageAndRender();
    }

    function resetPageAndRender() { currentPage = 1; applyFilters(); }
    
    function applyFilters() {
        const query = document.getElementById('search').value.toLowerCase();
        
        // 1. 先進行篩選 (Filter)
        // 使用 let 宣告 tempEvents 以便後續排序
        let tempEvents = allEvents.filter(e => {
            const isFav = checkIsFav(e.title);
            const isNew = !readEvents.includes(e.url);
            
            // 關鍵字搜尋
            if (query && !e.title.toLowerCase().includes(query)) return false;
            
            // 平台篩選
            if (filters.platforms.size > 0 && !filters.platforms.has(e.platform)) return false;
            
            // 類別篩選
            if (filters.types.size > 0 && !filters.types.has(e.type)) return false;
            
            // 狀態篩選
            if (filters.status.has('isNew') && !isNew) return false;
            if (filters.status.has('isFav') && !isFav) return false;

            // 地區篩選邏輯
            if (filters.regions.size > 0) {
                const rawRegion = e.region || 'unknown'; 
                const region = rawRegion.toLowerCase(); 
                const knownRegions = ['north', 'central', 'south', 'east', 'islands'];

                // 邏輯：
                // 若是已知區域 (如 North)，必須在用戶勾選的名單內才顯示
                // 若是 Unknown，則暫時保留 (不 return false)
                if (knownRegions.includes(region)) {
                    if (!filters.regions.has(region)) return false;
                }
            }

            return true;
        });

        // 2. 進行排序 (Sort) - [新增]
        // 排序優先級：符合篩選地區 > 關注中 > 新活動 > 原始順序
        tempEvents.sort((a, b) => {
            // (A) 地區優先排序
            // 當有篩選地區時，將「明確符合該地區」的活動排在前面，「Unknown」排在後面
            if (filters.regions.size > 0) {
                const regionA = (a.region || 'unknown').toLowerCase();
                const regionB = (b.region || 'unknown').toLowerCase();
                
                const aIsSelected = filters.regions.has(regionA);
                const bIsSelected = filters.regions.has(regionB);
                
                // 若 A 是選中地區，B 不是 (例如 B 是 Unknown)，則 A 排前 (-1)
                if (aIsSelected && !bIsSelected) return -1;
                // 若 A 不是 (Unknown)，B 是選中地區，則 B 排前 (1)
                if (!aIsSelected && bIsSelected) return 1;
            }

            // (B) 關注優先 (Favorite)
            const aFav = checkIsFav(a.title);
            const bFav = checkIsFav(b.title);
            if (aFav !== bFav) return bFav - aFav; // true(1) - false(0) = 1 (大的在前? 不，sort logic: b-a means descending) 
            // 修正：Boolean 相減 true=1, false=0。 b(1)-a(0)=1 -> b 在前。 b(0)-a(1)=-1 -> a 在前。正確。

            // (C) 新活動優先 (New)
            const aNew = !readEvents.includes(a.url);
            const bNew = !readEvents.includes(b.url);
            if (aNew !== bNew) return bNew - aNew;

            return 0; // 保持原始順序
        });
        
        // 3. 更新全域變數並渲染
        filteredEvents = tempEvents;
        
        document.getElementById('result-count').textContent = `顯示 ${filteredEvents.length} 筆活動 (共 ${allEvents.length} 筆)`;
        renderList();
        renderPagination();
    }

    function renderList() {
        const start = (currentPage - 1) * PAGE_SIZE;
        const pageData = filteredEvents.slice(start, start + PAGE_SIZE);
        const list = document.getElementById('event-list');
        
        if(pageData.length === 0) { 
            list.innerHTML = '<div style="text-align:center; padding:40px; color:#666;">沒有符合條件的活動 🐢</div>'; 
            return; 
        }

        // [新增] 地區代碼轉中文名稱的對照表
        const regionLabelMap = {
            'North': '北區', 
            'Central': '中區', 
            'South': '南區', 
            'East': '東區', 
            'Islands': '離島'
            // Unknown 會回傳 undefined，下方邏輯會自動處理為不顯示
        };

        list.innerHTML = pageData.map(e => {
            const isFav = checkIsFav(e.title);
            const isNew = !readEvents.includes(e.url);
            
            // [新增] 取得該活動的地區中文標籤 (若無 region 或 region 為 Unknown，則為空字串)
            const regionLabel = regionLabelMap[e.region] || '';

            return `<div class="card ${!isNew ? 'read' : ''}" onclick="openDetail('${e.url}')">
                    ${e.img_url ? `<img src="${e.img_url}" class="card-img" loading="lazy">` : ''}
                    <div class="card-info">
                        <div class="badges">
                            <span class="badge" style="color:#60a5fa">${e.platform}</span>
                            
                            ${regionLabel ? `<span class="badge" style="background:#4b5563; color:#fff">${regionLabel}</span>` : ''}
                            
                            ${isNew ? '<span class="badge new">NEW</span>' : ''}
                            ${isFav ? '<span class="badge fav">⭐ 關注</span>' : ''}
                            <span class="badge">${e.type}</span>
                        </div>
                        <div style="font-weight:500; font-size:1rem;">${e.title}</div>
                        <div style="font-size:0.8rem; color:#888;">${e.date || '詳內文'} ${e.location ? `| ${e.location}` : ''}</div>
                    </div></div>`;
        }).join('');
    }

    function renderPagination() {
        const totalPages = Math.ceil(filteredEvents.length / PAGE_SIZE) || 1;
        document.getElementById('page-info').textContent = `第 ${currentPage} / ${totalPages} 頁`;
        document.getElementById('prev-btn').disabled = currentPage === 1;
        document.getElementById('next-btn').disabled = currentPage === totalPages;
    }

    function changePage(delta) { currentPage += delta; renderList(); renderPagination(); window.scrollTo(0, 0); }

    function openDetail(url) {
        if (candidateReviewActive) return; // review records use a separate read-only detail handler

        const ev = allEvents.find(e => e.url === url);
        if(!ev) return;
        
        if(!readEvents.includes(url)) { 
            readEvents.push(url); 
            localStorage.setItem('readEvents', JSON.stringify(readEvents)); 
            updateStatusCounts(); 
        }

        document.getElementById('m-title').textContent = ev.title;
        document.getElementById('m-platform').textContent = ev.platform;
        document.getElementById('m-type').textContent = ev.type;
        document.getElementById('m-link').href = ev.url;
        
        document.getElementById('m-date').textContent = ev.date || '詳內文';
        document.getElementById('m-location').textContent = ev.location || '詳內文';
        document.getElementById('m-price').textContent = ev.price || '詳內文';
        
        const desc = ev.description ? ev.description : '暫無詳細簡介，請點擊下方按鈕前往官網查看。';
        document.getElementById('m-desc').textContent = desc;

        const img = document.getElementById('m-img');
        if(ev.img_url) { 
            img.src = ev.img_url; 
            img.style.display = 'block'; 
        } else { 
            img.style.display = 'none'; 
        }

        document.getElementById('detail-modal').classList.add('open');
        renderList();
    }

    function closeModal() { document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('open')); }
    function openSettings() { renderKeywords(); checkNotifyStatus(); document.getElementById('settings-modal').classList.add('open'); }
    function renderKeywords() { document.getElementById('keywords-tags').innerHTML = myKeywords.map((k, i) => `<div class="tag">${k} <span onclick="removeKeyword(${i})" style="cursor:pointer; color:#f87171">×</span></div>`).join(''); }
    function removeKeyword(i) { myKeywords.splice(i, 1); renderKeywords(); localStorage.setItem('myKeywords', JSON.stringify(myKeywords)); applyFilters(); updateStatusCounts(); }
    document.getElementById('keyword-input').onkeypress = (e) => { if(e.key === 'Enter') { const val = e.target.value.trim(); if(val && !myKeywords.includes(val)) { myKeywords.push(val); e.target.value = ''; renderKeywords(); localStorage.setItem('myKeywords', JSON.stringify(myKeywords)); applyFilters(); updateStatusCounts(); } } };
    
    function requestNotifyPermission() { 
        Notification.requestPermission().then(p => {
            alert(p === "granted" ? "✅ 通知已開啟" : "🚫 通知被拒絕");
            checkNotifyStatus();
        }); 
    }
    
    function checkNotifyStatus() {
        const p = Notification.permission;
        const statusMap = { 'default': '未詢問', 'granted': '✅ 已開啟', 'denied': '🚫 已封鎖' };
        document.getElementById('notify-status').textContent = `狀態: ${statusMap[p] || p}`;
    }

    init();
</script>
</body>
