name: EventRadar P30 L4-D3 FamiTicket public browser detail identity
on:
  push:
    branches: [feat/eventradar-p30-l4d3-fami-public-browser]
permissions:
  contents: read
concurrency:
  group: eventradar-p30-l4d3-fami
  cancel-in-progress: false
jobs:
  fami-browser-detail:
    if: github.repository == 'easonliu714/event_scraper_public' && github.ref == 'refs/heads/feat/eventradar-p30-l4d3-fami-public-browser'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Frozen P30-L4D2 baseline and production docs exact blobs
        run: |
          set -euo pipefail
          base=ca9ab41c930296c4c9c74a329454466f55a6e611
          git merge-base --is-ancestor "$base" HEAD
          test "$(git rev-parse HEAD:docs/data.json)" = 7fc4fe32567a57fd504483eeb9a8b9e10b568ea4
          test "$(git rev-parse HEAD:docs/index.html)" = 8167aa329f6958a076736166bcaf321da1c8e4ee
          test "$(git rev-parse HEAD:scraper.py)" = 98eddeafb497718c51aa81c6a150e9a5e1e687a8
          expected="$(printf 'A\t%s\n' '.github/workflows/eventradar_p30_l4d3_fami_browser.yml' 'scripts/p30_l4d3_famiticket_browser.mjs' 'tests/p30/test_l4d3_famiticket_browser.mjs'|LC_ALL=C sort)"
          actual="$(git diff --name-status "$base" HEAD|LC_ALL=C sort)"
          test "$expected" = "$actual" || { echo HOLD_CHANGED_SCOPE; exit 1; }
          echo PASS P30_L4D3_SOURCE_SCOPE_FROZEN
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stock Chromium without stealth, credentials or captcha bypass
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install chromium
      - name: Offline source-bound unique ID and semantic HOLD tests
        run: |
          node --check scripts/p30_l4d3_famiticket_browser.mjs
          node --test tests/p30/test_l4d3_famiticket_browser.mjs
          echo PASS P30_L4D3_FAMI_BROWSER_OFFLINE_MATRIX
      - name: Public homepage and one matched detail GET via standard Chromium
        run: |
          node scripts/p30_l4d3_famiticket_browser.mjs --out-dir p30-l4d3-out
      - name: Evidence assertions, no false activity date or ticket status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("p30-l4d3-out/diagnostics.json").read_text())
          x=d['detail']
          assert d['kind']=="EVENTRADAR_P30_L4D3_FAMITICKET_PUBLIC_BROWSER_DETAIL_NOT_GOLDEN"
          assert d['net']['homeHttp']==200 and d['net']['detailHttp']==200
          assert d['maxNavigation']==2 and d['maxNetworkRequests']==100
          assert d['targetTitle']=="2026 ITF 台灣國際旅展"
          assert d['acceptedEventDates']==0 and d['goldenAccepted'] is False
          assert d['published'] is False and d['writerExecuted'] is False
          assert d['notifierExecuted'] is False and d['autoHidden']==0
          assert d['sourceRuntime']=='DORMANT'
          assert d['noLogin'] and d['noStealth'] and d['noCaptchaBypass']
          assert d['noCheckout'] and d['noRetries']
          assert x['eventDateStart'] is None and x['eventDateEnd'] is None
          assert x['ticketStatus']=='UNKNOWN' and x['price'] is None
          assert x['goldenVerified'] is False
          print('PASS P30_L4D3_PUBLIC_BROWSER_FAMI_LIST_DETAIL_HTTP')
          if x['state']=='PUBLIC_BROWSER_EXACT_HEADING_PASS':
              print('PASS P30_L4D3_FAMI_BROWSER_DETAIL_EXACT_TITLE')
          else:
              print('HOLD P30_L4D3_FAMI_BROWSER_DETAIL_TITLE_NOT_VERIFIED',x['state'])
          PY
      - name: SHA seal diagnostic result, including HOLD
        if: always()
        run: |
          mkdir -p p30-l4d3-out
          cat > p30-l4d3-out/README.txt <<'EOF'
          P30-L4-D3 FamiTicket publicly accessible browser detail diagnostic.
          Homepage /Home plus one uniquely title-bound activity page.
          Stock Chromium, no login, stealth, captcha bypass, API guessing,
          checkout, ticket status assumptions, official writer or notifications.
          Distinguish transport HTTP200, rendered title identity and actual
          accepted dates. Only last two are evidence; dates never promoted here.
          EOF
          if [[ -f p30-l4d3-out/diagnostics.json ]]; then
            (cd p30-l4d3-out && sha256sum diagnostics.json README.txt > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
            echo PASS P30_L4D3_ARTIFACT_SHA
          else
            echo HOLD P30_L4D3_NO_DIAGNOSTIC
          fi
      - name: Upload isolated source audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eventradar-p30-l4d3-fami-browser-evidence
          path: p30-l4d3-out/
          retention-days: 14
          if-no-files-found: warn
