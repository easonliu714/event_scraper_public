name: EventRadar P30-L9-CN exact-head NO PUBLISH
on:
  pull_request:
    branches: [feat/eventradar-p30-l9cm-kktix-three-registration-edges]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  exact-head:
    if: github.repository == 'easonliu714/event_scraper_public' && github.head_ref == 'feat/eventradar-p30-l9cn-kham-product-date-price-roles'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact-head ADD-only and frozen formal data
        shell: bash
        run: |
          set -euo pipefail
          base=fd201f22ca8c46e4f2969aa9bf8e3fc641800e08
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git merge-base "$base" HEAD)" = "$base"
          expected="$(printf 'A\t%s\n' 'scripts/p30_l9cn_kham_product_roles.py' 'tests/p30/test_l9cn_kham_product_roles.py' '.github/workflows/eventradar_p30_l9cn.yml' | LC_ALL=C sort)"
          test "$expected" = "$(git diff --name-status "$base" HEAD | LC_ALL=C sort)"
          test "$(git rev-parse origin/main:docs/data.json)" = 7fc4fe32567a57fd504483eeb9a8b9e10b568ea4
          test "$(git rev-parse origin/main:docs/platform_status.json)" = e19ca37c4c80c10b7278d0813b8ff1047535d124
      - name: Predecessor and new regression
        run: |
          python -m py_compile scripts/p30_l9cn_kham_product_roles.py tests/p30/test_l9cn_kham_product_roles.py
          python -m unittest discover -s tests/p30 -p 'test_l9cm_kktix_three_edges.py' -v
          python -m unittest discover -s tests/p30 -p 'test_l9cn_kham_product_roles.py' -v
      - name: SHA256 manifest exact HEAD
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python - <<'PY'
          import hashlib,json,pathlib,subprocess
          p=pathlib.Path("evidence")
          a={"gate":"P30-L9-CN","headSHA":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),"officialGETinCI":0,"sourceObservationDate":"2026-11-01","sourceEvidence":"KHAM #04 public same PRODUCT_ID P1FRRCZ9 description and order pages; 2026-11-14 18:00 show at TICC, four product-row price tiers, 2026-09-23 12:00 sale start. Direct button href and ticket Session ID unverified; no purchase.","acceptedFields":0,"ticketSessionIdsVerified":0,"goldenAccepted":0,"published":False,"releaseState":"HARD_HOLD_NO_PUBLICATION"}
          (p/"audit.json").write_text(json.dumps(a,sort_keys=True)+"\n")
          (p/"manifest.json").write_text(json.dumps({"filesSHA256":{"audit.json":hashlib.sha256((p/"audit.json").read_bytes()).hexdigest()}},sort_keys=True)+"\n")
          PY
          (cd evidence && sha256sum *.json > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eventradar-p30-l9-cn-source-evidence
          path: evidence/
          if-no-files-found: error
