name: EventRadar P30 L9-R ibon title hydration vs candidate nonmatch (READ ONLY)
on:
  push:
    branches:
      - feat/eventradar-p30-l9r-ibon-title-state
permissions:
  contents: read
  actions: read
concurrency:
  group: eventradar-p30-l9r-ibon-title-state
  cancel-in-progress: true
jobs:
  title-state-diagnostics:
    if: github.repository == 'easonliu714/event_scraper_public'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Frozen exact L9-Q parent and only three new paths
        run: |
          set -euo pipefail
          base=59152fb83cb396924a6935f36681fac7fb0079f9
          git merge-base --is-ancestor "$base" HEAD
          test "$(git rev-parse HEAD:docs/data.json)" = 7fc4fe32567a57fd504483eeb9a8b9e10b568ea4
          test "$(git rev-parse HEAD:scraper.py)" = 98eddeafb497718c51aa81c6a150e9a5e1e687a8
          test "$(git rev-parse HEAD:docs/manifest.json)" = 6fca76fd65958c6ab2381bf949e061aa7f8fb551
          expected="$(printf 'A\t%s\n' '.github/workflows/eventradar_p30_l9r_ibon_title_state.yml' 'scripts/p30_l9r_ibon_title_state.mjs' 'tests/p30/test_l9r_ibon_title_state.mjs' | LC_ALL=C sort)"
          actual="$(git diff --name-status "$base" HEAD | LC_ALL=C sort)"
          test "$expected" = "$actual" || { echo HOLD_L9R_UNEXPECTED_DIFF; exit 1; }
          echo PASS_L9R_EXACT_THREE_PATHS_FROZEN_PRODUCTION
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install standard Chromium without stealth
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.55.0
          ./node_modules/.bin/playwright install chromium
      - name: Syntax and 36 deterministic fail-closed contracts
        run: |
          set -euo pipefail
          node --check scripts/p30_l9r_ibon_title_state.mjs
          node --test tests/p30/test_l9r_ibon_title_state.mjs | tee /tmp/l9r-tests.log
          grep -Eq '^# tests 36$' /tmp/l9r-tests.log
          echo PASS_L9R_36_OFFLINE_GUARDS
      - uses: actions/download-artifact@v4
        with:
          name: eventradar-p30-l9q-ibon-39878-hydration-readonly
          run-id: 40721117824
          repository: easonliu714/event_scraper_public
          github-token: ${{ github.token }}
          path: pinned-l9q
      - uses: actions/download-artifact@v4
        with:
          name: eventradar-p30-l9f-ibon-detail-roles-review-only
          run-id: 40494326021
          repository: easonliu714/event_scraper_public
          github-token: ${{ github.token }}
          path: pinned-l9f
      - name: Verify pinned Q exact-head ZIP and source report lineage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/easonliu714/event_scraper_public/actions/artifacts/12829898767" \
            | python -c 'import json,sys; a=json.load(sys.stdin); assert a["id"]==12829898767; assert a["workflow_run"]["head_sha"]=="59152fb83cb396924a6935f36681fac7fb0079f9"; assert a["digest"]=="sha256:0e07aec0a6c8a0524457c58e782906d799e3a7f773d084e876bcf1aaddd3ab48"; assert not a["expired"]; print("PASS_L9R_Q_EXACT_HEAD_ZIP_PIN")'
          (cd pinned-l9q && sha256sum -c SHA256SUMS.txt)
          (cd pinned-l9f && sha256sum -c SHA256SUMS.txt)
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import {parents} from './scripts/p30_l9r_ibon_title_state.mjs';
          const qb=readFileSync('pinned-l9q/ibon_39878_hydration.json');
          const fb=readFileSync('pinned-l9f/detail_role_review.json');
          const p=parents(JSON.parse(qb),qb,JSON.parse(fb),fb);
          console.log('PASS_L9R_PARENT_REPORT_SHA',p.qSha,p.fSha);
          JS
      - name: One official page and eight passive title state observations
        run: |
          set -euo pipefail
          node scripts/p30_l9r_ibon_title_state.mjs \
            --l9q pinned-l9q/ibon_39878_hydration.json \
            --l9f pinned-l9f/detail_role_review.json \
            --out p30-l9r-evidence
      - name: Independent source, SHA and no-publication readback
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          p=Path('p30-l9r-evidence')
          r=json.loads((p/'ibon_39878_title_state.json').read_text(encoding='utf-8'))
          m=json.loads((p/'manifest.json').read_text(encoding='utf-8'))
          assert r['kind']=='EVENTRADAR_P30_L9R_IBON_39878_TITLE_STATE_V1'
          assert r['sourceId']=='39878' and r['sourceUrl']=='https://ticket.ibon.com.tw/ActivityInfo/Details/39878'
          assert r['http']==200 and r['sampleCount']==8 and r['intervalMs']==650
          assert [x['index'] for x in r['timeline']]==list(range(8))
          assert r['parentL9QRun']==40721117824 and r['parentL9QArtifact']==12829898767
          assert r['parentL9QZipSHA256']=='0e07aec0a6c8a0524457c58e782906d799e3a7f773d084e876bcf1aaddd3ab48'
          assert r['parentL9FFileSHA256']=='81780c6cf5d7fa09239f9d90c5a889b53016c81693d47dc20e8f73a9dc77ffe4'
          assert r['analysis']['acceptedFields']==0 and r['analysis']['decision'].startswith('HOLD_')
          assert r['formalDate'] is None and r['formalPrice'] is None and r['ticketStatus']=='UNKNOWN'
          assert r['formalFieldPromotions']==r['goldenAccepted']==0
          assert r['published'] is False and r['releaseState']=='HARD_HOLD_NO_PUBLICATION'
          assert not any(r[k] for k in ('writerExecuted','schedulerExecuted','notifierExecuted','mergeExecuted','rawHtmlPersisted','sourceTextPersisted','linkUrlsPersisted','screenshotsPersisted','cookiesPersisted'))
          assert r['existingAndroid44Preserved'] and r['l8CoreAndroidPassPreserved']
          for x in r['timeline']:
            assert sorted(x)==sorted(('index','readyState','headingCount','titleCandidateCount','exactTitleMatch','candidateFingerprint','dateLabelCount','titleState'))
            assert not any(z in k.lower() for k in x for z in ('href','url','html','cookie','price','text','value'))
          assert hashlib.sha256((p/'ibon_39878_title_state.json').read_bytes()).hexdigest()==m['filesSHA256']['ibon_39878_title_state.json']
          print('L9R_QUALITY',json.dumps(r['analysis'],sort_keys=True))
          print('PASS_L9R_REPORT_MANIFEST_SHA_AND_SOURCE_BOUNDARY')
          print('HOLD_L9R_NO_TYPED_DATE_PRICE_GOLDEN_PUBLICATION')
          PY
      - name: Seal isolated evidence artifact
        if: always()
        run: |
          mkdir -p p30-l9r-evidence
          if test -f p30-l9r-evidence/manifest.json; then
            (cd p30-l9r-evidence && sha256sum ibon_39878_title_state.json manifest.json > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          else
            echo HOLD_L9R_REPORT_MISSING
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eventradar-p30-l9r-ibon-39878-title-state-readonly
          path: p30-l9r-evidence/
          retention-days: 14
          if-no-files-found: warn
