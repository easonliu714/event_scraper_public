name: EventRadar P30 L9-AO ACCUPASS bounded role ancestor (NO PUBLISH)
on:
  pull_request:
    branches: [feat/eventradar-p30-l9an-matched-heading-20261030-0100]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: eventradar-p30-l9ao-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  accupass-role-ancestor-review:
    if: github.repository == 'easonliu714/event_scraper_public' && github.head_ref == 'feat/eventradar-p30-l9ao-ancestor-role-20261030-0112'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact head, three ADD-only paths, frozen formal data
        shell: bash
        run: |
          set -euo pipefail
          base=23af881cbbc207e42522c460b1de0dae65a065ce
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git merge-base "$base" HEAD)" = "$base"
          expected="$(printf 'A\t%s\n' '.github/workflows/eventradar_p30_l9ao_role_ancestor.yml' 'scripts/p30_l9ao_accupass_role_ancestor.py' 'tests/p30/test_l9ao_accupass_role_ancestor.py' | LC_ALL=C sort)"
          actual="$(git diff --name-status "$base" HEAD | LC_ALL=C sort)"
          test "$expected" = "$actual"
          test "$(git rev-parse origin/main:docs/data.json)" = 7fc4fe32567a57fd504483eeb9a8b9e10b568ea4
          test "$(git rev-parse origin/main:docs/platform_status.json)" = e19ca37c4c80c10b7278d0813b8ff1047535d124
          git show origin/main:docs/platform_status.json > /tmp/l9ao-status.json
      - name: Normal public Chromium and bounded DOM dependencies
        run: |
          python -m pip install --disable-pip-version-check 'beautifulsoup4==4.14.2' 'playwright==1.55.0'
          python -m playwright install chromium
      - name: Frozen tests and ancestor conflict negatives
        run: |
          python -m py_compile scripts/p30_l9ao_accupass_role_ancestor.py tests/p30/test_l9ao_accupass_role_ancestor.py
          python -m unittest discover -s tests/p30 -p test_l9ak_accupass_heading_near.py -v
          python -m unittest discover -s tests/p30 -p test_l9am_accupass_live_heading.py -v
          python -m unittest discover -s tests/p30 -p test_l9an_accupass_matched_heading.py -v
          python -m unittest discover -s tests/p30 -p test_l9ao_accupass_role_ancestor.py -v
      - name: One public list and at most two same-path details
        run: |
          python scripts/p30_l9ao_accupass_role_ancestor.py --live --status /tmp/l9ao-status.json --out p30-l9ao-evidence
      - name: Verify SHA manifest and no publication
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('p30-l9ao-evidence')
          r=json.loads((p/'ancestor_role_review.json').read_text())
          m=json.loads((p/'manifest.json').read_text())
          assert hashlib.sha256((p/'ancestor_role_review.json').read_bytes()).hexdigest()==m['filesSHA256']['ancestor_role_review.json']
          assert r['releaseState']=='HARD_HOLD_NO_PUBLICATION'
          assert r['detailCount']<=2 and r['acceptedFields']==r['goldenAccepted']==0
          assert r['published'] is False
          assert not r['rawHtmlPersisted'] and not r['rawTitlesPersisted'] and not r['rawEventIdsPersisted']
          print('PASS_L9AO_SHA_NO_PUBLICATION')
          PY
          (cd p30-l9ao-evidence && sha256sum *.json > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eventradar-p30-l9ao-role-ancestor-review
          path: p30-l9ao-evidence/
          if-no-files-found: ignore
