name: EventRadar P30 l9ba exact-head source-quality (NO PUBLISH)
on:
  pull_request:
    branches: [feat/eventradar-p30-l9az-era-cell-ownership]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: eventradar-l9ba-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  source-quality:
    if: github.repository == 'easonliu714/event_scraper_public' && github.head_ref == 'feat/eventradar-p30-l9ba-era-row-anchor-evidence'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact head and immutable formal JSON guard
        shell: bash
        run: |
          set -euo pipefail
          base=d95788c3550c9ec80f64afceab89d74ec6bfff57
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git merge-base "$base" HEAD)" = "$base"
          expected="$(printf 'A\t%s\n' '.github/workflows/eventradar_p30_l9ba.yml' 'scripts/p30_l9ba_era_cell_ownership.py' 'tests/p30/test_l9ba_era_cell_ownership.py' | LC_ALL=C sort)"
          test "$expected" = "$(git diff --name-status "$base" HEAD | LC_ALL=C sort)"
          test "$(git rev-parse origin/main:docs/data.json)" = 7fc4fe32567a57fd504483eeb9a8b9e10b568ea4
          test "$(git rev-parse origin/main:docs/platform_status.json)" = e19ca37c4c80c10b7278d0813b8ff1047535d124
      - name: Frozen predecessors and fail-closed regression tests
        run: |
          python -m pip install --disable-pip-version-check 'requests==2.32.5' 'beautifulsoup4==4.14.2'
          python -m py_compile scripts/p30_l9ba_era_cell_ownership.py tests/p30/test_l9ba_era_cell_ownership.py
          python -m unittest discover -s tests/p30 -p test_l9ax_era_topology.py -v
          python -m unittest discover -s tests/p30 -p test_l9ay_era_row_role.py -v
          python -m unittest discover -s tests/p30 -p test_l9ba_era_cell_ownership.py -v
      - name: Bounded official source GET with sanitized SHA receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p p30-l9ba-evidence
          python scripts/p30_l9ba_era_cell_ownership.py --live-one --out p30-l9ba-evidence/audit.json
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('p30-l9ba-evidence')
          p=root/'audit.json'
          a=json.loads(p.read_text())
          assert a['requestCount']==a['requestBudget']==1
          assert a['acceptedFields']==a['goldenAccepted']==0 and a['published'] is False
          assert a['releaseState']=='HARD_HOLD_NO_PUBLICATION'
          assert 'rawHtml' not in a and 'cookies' not in a
          print('SOURCE_QUALITY_DECISION='+str(a.get('decision')))
          print('SOURCE_RECEIPT='+json.dumps(a.get('detailReceipt',a.get('submenuReceipt',{})),sort_keys=True))
          (root/'manifest.json').write_text(json.dumps({'filesSHA256':{'audit.json':hashlib.sha256(p.read_bytes()).hexdigest()}},sort_keys=True)+'\n')
          PY
          (cd p30-l9ba-evidence && sha256sum *.json > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p30-l9ba-evidence
          path: p30-l9ba-evidence/
          if-no-files-found: ignore
