name: EventRadar P30-L9BP one bounded Huashan live DOM (NO PUBLISH)
on:
  pull_request:
    branches: [feat/eventradar-p30-l9bo-huashan-distinct-edges]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: eventradar-l9bp-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  bounded-source-dom:
    if: github.repository == 'easonliu714/event_scraper_public' && github.head_ref == 'feat/eventradar-p30-l9bp-huashan-live-card-dom'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact-head and frozen production guard
        shell: bash
        run: |
          set -euo pipefail
          base=9c719011f09e4b48cec89f00ecca6864d0359740
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git merge-base "$base" HEAD)" = "$base"
          expected="$(printf 'A\t%s\n' 'scripts/p30_l9bp_huashan_live_card_probe.py' 'tests/p30/test_l9bp_huashan_live_card_probe.py' '.github/workflows/eventradar_p30_l9bp.yml' | LC_ALL=C sort)"
          test "$expected" = "$(git diff --name-status "$base" HEAD | LC_ALL=C sort)"
          test "$(git rev-parse origin/main:docs/data.json)" = 7fc4fe32567a57fd504483eeb9a8b9e10b568ea4
          test "$(git rev-parse origin/main:docs/platform_status.json)" = e19ca37c4c80c10b7278d0813b8ff1047535d124
      - name: Frozen predecessor and new offline regression
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'beautifulsoup4==4.14.2' 'requests==2.32.5'
          python -m py_compile scripts/p30_l9bp_huashan_live_card_probe.py tests/p30/test_l9bp_huashan_live_card_probe.py
          python -m unittest discover -s tests/p30 -p 'test_l9bo_huashan_distinct_edges.py' -v
          python -m unittest discover -s tests/p30 -p 'test_l9bp_huashan_live_card_probe.py' -v
      - name: ONE bounded first-party index GET, HOLD is not source PASS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p eventradar_l9bp-evidence
          python scripts/p30_l9bp_huashan_live_card_probe.py --live-one --out eventradar_l9bp-evidence/source_audit.json
      - name: SHA256 evidence manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib,subprocess
          p=pathlib.Path('eventradar_l9bp-evidence')
          d={'gate':'P30-L9-BP','mode':'OFFLINE_TEST_PLUS_ONE_BOUNDED_LIVE_GET',
             'acceptedFields':0,'goldenAccepted':0,'published':False,
             'releaseState':'HARD_HOLD_NO_PUBLICATION',
             'headSHA':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()}
          a=p/'audit.json';a.write_text(json.dumps(d,sort_keys=True)+'\n')
          (p/'manifest.json').write_text(json.dumps({'filesSHA256':{x.name:hashlib.sha256(x.read_bytes()).hexdigest() for x in p.glob('*.json') if x.name!='manifest.json'}},sort_keys=True)+'\n')
          PY
          (cd eventradar_l9bp-evidence && sha256sum *.json > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eventradar_l9bp-evidence
          path: eventradar_l9bp-evidence/
          if-no-files-found: ignore
