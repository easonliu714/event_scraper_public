name: EventRadar P30 L9-AF ACCUPASS query-key roles (NO PUBLISH)
on:
  push:
    branches: [feat/eventradar-p30-l9af-accupass-query-roles]
  pull_request:
    branches: [feat/eventradar-p30-l9ae-accupass-list-topology]
    paths:
      - .github/workflows/eventradar_p30_l9af_accupass_query_roles.yml
      - scripts/p30_l9af_accupass_query_roles.py
      - tests/p30/test_l9af_accupass_query_roles.py
permissions:
  contents: read
concurrency:
  group: eventradar-p30-l9af-accupass
  cancel-in-progress: false
jobs:
  accupass-query-roles:
    if: github.repository == 'easonliu714/event_scraper_public'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact parent and production SHA gate
        run: |
          set -euo pipefail
          base=36dce126cb0e17be3a2bbb4fe385d89ce9f4f338
          test "$(git rev-parse origin/main)" = fbf4ca02b91159f2423caf3d79fb0ca4bb747069
          test "$(git rev-parse HEAD:docs/data.json)" = 7fc4fe32567a57fd504483eeb9a8b9e10b568ea4
          test "$(git rev-parse origin/main:docs/platform_status.json)" = e19ca37c4c80c10b7278d0813b8ff1047535d124
          git merge-base --is-ancestor "$base" HEAD
          expected="$(printf 'A\t%s\n' '.github/workflows/eventradar_p30_l9af_accupass_query_roles.yml' 'scripts/p30_l9af_accupass_query_roles.py' 'tests/p30/test_l9af_accupass_query_roles.py' | LC_ALL=C sort)"
          actual="$(git diff --name-status "$base" HEAD | LC_ALL=C sort)"
          test "$actual" = "$expected" || { echo HOLD_L9AF_SCOPE; exit 1; }
          git show origin/main:docs/platform_status.json > /tmp/l9af-status.json
          echo PASS_L9AF_EXACT_SCOPE
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Chromium and parser
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'beautifulsoup4==4.14.2' 'playwright==1.55.0'
          python -m playwright install chromium
      - name: Fifty-two synthetic query and privacy tests
        run: |
          set -euo pipefail
          python -m py_compile scripts/p30_l9af_accupass_query_roles.py tests/p30/test_l9af_accupass_query_roles.py
          python -m unittest discover -s tests/p30 -p test_l9af_accupass_query_roles.py -v 2>&1 | tee /tmp/l9af-tests.log
          grep -q 'Ran 52 tests' /tmp/l9af-tests.log
          grep -q '^OK$' /tmp/l9af-tests.log
      - name: One normal public search and four passive snapshots
        run: |
          set -euo pipefail
          python scripts/p30_l9af_accupass_query_roles.py --status /tmp/l9af-status.json --out p30-l9af-evidence --live
      - name: Independent privacy, SHA, and no-publication contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          root=Path("p30-l9af-evidence")
          raw=(root/"accupass_query_roles.json").read_bytes()
          report=json.loads(raw)
          manifest=json.loads((root/"manifest.json").read_bytes())
          assert report["kind"]=="EVENTRADAR_P30_L9AF_ACCUPASS_QUERY_ROLES_V1"
          assert report["parentHead"]=="36dce126cb0e17be3a2bbb4fe385d89ce9f4f338"
          assert report["navigationCount"]==1
          assert len(report["domObservations"])<=4
          assert report["releaseState"]=="HARD_HOLD_NO_PUBLICATION"
          assert report["formalVerifiedEventIdentity"]==report["acceptedFields"]==report["goldenAccepted"]==0
          for key in ("published","productionModified","writerExecuted","schedulerExecuted","notifierExecuted","mergeExecuted","detailNavigated","rawHtmlPersisted","rawUrlsPersisted","rawTitlesPersisted","rawEventIdsPersisted","queryValuesPersisted","unknownQueryNamesPersisted","cookiesPersisted","screenshotsPersisted"):
              assert report[key] is False,key
          assert b"https://" not in raw and b"<html" not in raw.lower()
          assert manifest["filesSHA256"]["accupass_query_roles.json"]==hashlib.sha256(raw).hexdigest()
          assert manifest["releaseState"]=="HARD_HOLD_NO_PUBLICATION" and manifest["published"] is False
          print("PASS_L9AF_PRIVACY_SHA_HOLD",report["decision"])
          PY
      - name: Seal SHA256SUMS
        if: always()
        run: |
          mkdir -p p30-l9af-evidence
          if test -f p30-l9af-evidence/manifest.json; then
            (cd p30-l9af-evidence && sha256sum accupass_query_roles.json manifest.json > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          else
            echo HOLD_L9AF_REPORT_MISSING
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eventradar-p30-l9af-accupass-query-roles
          path: p30-l9af-evidence/
          retention-days: 14
          if-no-files-found: warn
