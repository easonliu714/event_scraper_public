name: EventRadar TPAC first-source multi-event REVIEW refresh exact-head (NO PUBLISH)
on:
  pull_request:
    paths:
      - scripts/p30_tpac_multi_event_refresh.py
      - scripts/p30_tpac_catalog_topology.py
      - scripts/p30_tpac_event_catalog_once.py
      - scripts/p30_tpac_event_detail_review.py
      - tests/p30/test_p30_tpac_event_detail_review.py
      - tests/p30/test_p30_tpac_event_catalog_once.py
      - tests/p30/test_p30_tpac_catalog_topology.py
      - tests/p30/test_p30_tpac_multi_event_refresh.py
      - .github/workflows/eventradar_tpac_multi_event_refresh.yml
permissions:
  contents: read
  actions: read
jobs:
  multi-id-review-refresh:
    if: github.repository == 'easonliu714/event_scraper_public' && github.head_ref == 'feat/p30-tpac-multi-event-refresh-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exact PR HEAD and immutable released data / Golden / Publisher controls
        env:
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_SHA"
          base=5c744607ab4d9d1c1493377018c282982acac227
          git merge-base --is-ancestor "$base" HEAD
          test "$(git rev-parse HEAD:docs/data.json)" = 342eb7c101115b05dbc6ff90de7bd97d5bd63d59
          test "$(git rev-parse HEAD:docs/platform_status.json)" = 720cac528faacc9560a5ab41ce725bf8cc183166
          test "$(git rev-parse HEAD:docs/index.html)" = 18c14a92288f7bc2aa1ed8bc57b62107957b851d
          test "$(git rev-parse HEAD:scraper.py)" = 98eddeafb497718c51aa81c6a150e9a5e1e687a8
          actual="$(git diff --name-only "$base" HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' 'scripts/p30_tpac_multi_event_refresh.py' 'scripts/p30_tpac_catalog_topology.py' 'scripts/p30_tpac_event_catalog_once.py' 'scripts/p30_tpac_event_detail_review.py' 'tests/p30/test_p30_tpac_multi_event_refresh.py' 'tests/p30/test_p30_tpac_event_detail_review.py' 'tests/p30/test_p30_tpac_event_catalog_once.py' 'tests/p30/test_p30_tpac_catalog_topology.py' '.github/workflows/eventradar_tpac_multi_event_refresh.yml' | LC_ALL=C sort)"
          test "$actual" = "$expected" || { echo HOLD_UNAUTHORIZED_FORMAL_SCOPE; exit 1; }
          echo PASS_EXACT_HEAD_TPAC_SINGLE_SOURCE_REVIEW_ONLY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline multi-event parsing, positive, negative, CAS and retention
        run: |
          set -euo pipefail
          python -m pip install 'beautifulsoup4==4.15.0'
          python -m unittest discover -s tests/p30 -p 'test_p30_tpac_multi_event_refresh.py' -v
          python -m unittest discover -s tests/p30 -p 'test_p30_tpac_catalog_topology.py' -v
          python -m unittest discover -s tests/p30 -p 'test_p30_tpac_event_catalog_once.py' -v
          python -m unittest discover -s tests/p30 -p 'test_p30_tpac_event_detail_review.py' -v
          python -m py_compile scripts/p30_tpac_multi_event_refresh.py scripts/p30_tpac_catalog_topology.py scripts/p30_tpac_event_catalog_once.py scripts/p30_tpac_event_detail_review.py
          echo PASS_TPAC_MULTI_EVENT_PARSER_AND_LKG_FAIL_CLOSED_TESTS
      - name: TPAC /event first-party robots LIST and 2 distinct DETAIL bounded one-shot (NO PUBLISH)
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p evidence/native_event
          if [ "$RUN_ATTEMPT" != "1" ] || git log --format=%s HEAD^ | grep -F '[tpac-event-catalog-once]'; then
            echo 'TPAC_EVENT_SOURCE_PROBE_ALREADY_CONSUMED_OR_RERUN_HOLD'
            printf '{"kind":"TPAC_EVENT_ONESHOT_ALREADY_CONSUMED","decision":"HOLD_DO_NOT_REPEAT","published":0}\n' > evidence/native_event/tpac_event_catalog_receipt.json
          else
            python -m scripts.p30_tpac_event_catalog_once --output evidence/native_event
          fi
          echo 'NATIVE_DIAGNOSTIC_ONLY__DO_NOT_INTERPRET_WORKFLOW_SUCCESS_AS_SOURCE_FIELD_PASS'
      - name: Retrieve pinned earlier first-party /event LIST and two DETAIL bodies (NO REGET)
        uses: actions/download-artifact@v4
        with:
          name: eventradar-tpac-multi-event-review-lkg-readiness
          repository: easonliu714/event_scraper_public
          run-id: 42491637804
          github-token: ${{ github.token }}
          path: pinned-event
      - name: Independently replay first-party two activity types and conflicting periods
        run: |
          set -euo pipefail
          (cd pinned-event && sha256sum -c SHA256SUMS.txt)
          mkdir -p evidence
          python -m scripts.p30_tpac_event_detail_review --source-dir pinned-event/native_event --out evidence/tpac_event_two_real_role_review.json
          python - <<'PY'
          from pathlib import Path
          import json,hashlib
          p=Path('pinned-event/native_event')
          raw=json.loads((p/'tpac_event_catalog_receipt.json').read_text())
          rows=json.loads(Path('evidence/tpac_event_two_real_role_review.json').read_text())
          assert rows['kind']=='TPAC_EVENT_TWO_NATIVE_REPLAY_REVIEW_NOT_PUBLICATION'
          assert rows['historical_replay_only'] is True
          assert rows['source_list_count']==18 and rows['detail_count']==2
          assert rows['native_again']==0 and rows['published']==0
          assert set(rows['records'])=={'1301','2072'}
          exhibit=rows['records']['1301']
          tour=rows['records']['2072']
          assert exhibit['identity']=='tpac:event:1301'
          assert exhibit['verified_core_roles']['EXHIBITION_PERIOD']==['2025-07-24','2026-12-31']
          assert 'NEXT_EVENT_SHOW_START' not in exhibit['verified_core_roles']
          assert 'LIST_DETAIL_ACTIVITY_PERIOD_CONFLICT_HOLD' in exhibit['held_fields']
          assert tour['identity']=='tpac:event:2072'
          assert tour['verified_core_roles']['NEXT_EVENT_SHOW_START']=='2026-11-11T19:00:00+08:00'
          assert tour['verified_core_roles']['EXACT_EVENT_SHOW_COUNT']==3
          assert 'LIST_DETAIL_ACTIVITY_PERIOD_CONFLICT_HOLD' in tour['held_fields']
          for key in ('1301','2072'):
              assert rows['records'][key]['published'] is False
              assert rows['records'][key]['formal_field_pass'] is False
              assert rows['records'][key]['golden_accepted'] is False
              assert rows['records'][key]['detail_body_sha256']==raw['source_receipts'][key]['body_sha256']
              assert hashlib.sha256((p/('event_'+key+'_detail.html')).read_bytes()).hexdigest()==raw['source_receipts'][key]['body_sha256']
          print('PASS_ARCHIVED_OFFICIAL_EVENT_2_IDS_EXHIBITION_VS_TOUR_ROLES_PERIOD_CONFLICT_HOLD_NO_PUBLISH')
          PY
      - name: Produce two-ID isolated LKG fixture evidence, never native HTTP
        run: |
          set -euo pipefail
          mkdir -p evidence
          python - <<'PY'
          from pathlib import Path
          import json,subprocess,sys,tempfile
          sys.path.insert(0,'tests/p30')
          from test_p30_tpac_multi_event_refresh import inputs,empty_prior,NOW
          from scripts.p30_tpac_multi_event_refresh import refresh_plan,write_isolated_plan
          listing,receipt,details=inputs()
          plan=refresh_plan(listing,receipt,details,empty_prior(),NOW)
          assert plan['decision']=='REVIEW_SNAPSHOT_READY_NOT_FORMAL'
          assert plan['qualified']==2 and plan['source_cards']==2 and plan['added']==2
          assert plan['published']==0 and plan['source_coverage_complete']
          with tempfile.TemporaryDirectory() as d:
              persisted=write_isolated_plan(plan,d,expected_sha=None)
              assert persisted['rows']==2
              saved=json.loads((Path(d)/'_isolated_review'/'tpac'/'tpac_multi_event_lkg.json').read_text())
              assert all(r['published'] is False for r in saved['events'].values())
              report={'kind':'TPAC_MULTI_EVENT_OFFLINE_FIXTURE_DEMO_NOT_NATIVE',
                      'exact_head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
                      'synthetic_only':True, 'source_cards':2,'qualified':2,
                      'added':2,'published':0,'release_state':'HARD_HOLD_NO_PUBLICATION',
                      'snapshot_sha256':persisted['sha256'],
                      'candidate_keys':sorted(saved['events']), 'native_http_new':0,
                      'next_real_gate':'2 distinct independently evidenced TPAC native list/detail ID pairs'}
              Path('evidence/tpac_multi_event_offline_demo.json').write_text(
                  json.dumps(report,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          # /program and /event are different official LIST/DETAIL namespaces.
          from test_p30_tpac_catalog_topology import listing as catalog_listing, receipt as catalog_receipt
          from scripts.p30_tpac_catalog_topology import discover_catalog,safe_union
          p_raw=catalog_listing('program','1301','測試節目A')
          e_raw=catalog_listing('event','1301','測試活動B')
          programs=discover_catalog('program',p_raw,catalog_receipt('program',p_raw),NOW)
          events=discover_catalog('event',e_raw,catalog_receipt('event',e_raw),NOW)
          joined=safe_union(programs,events)
          assert sorted(joined)==['tpac:event:1301','tpac:program:1301']
          assert all(v['accepted_show_start'] is None for v in joined.values())
          Path('evidence/tpac_catalog_topology_fixture.json').write_text(
              json.dumps({'kind':'TPAC_DUAL_OFFICIAL_CATALOG_SCHEMATIC_NOT_NATIVE',
                         'source_uris':['https://tpac.org.taipei/program',
                                       'https://tpac.org.taipei/event'],
                         'synthetic_only':True,'distinct_identity_keys':sorted(joined),
                         'new_native_http':0,'formal_published':0,
                         'event_list_date_role':'ACTIVITY_LIST_PERIOD_NOT_SHOW_START',
                         'program_list_date_role':'PERFORMANCE_LIST_PERIOD_NOT_SHOW_START'},
                         ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          print('PASS_DUAL_CATALOG_NONMERGE_DATE_ROLES_FIXTURE_NOT_NATIVE')
          print('PASS_REUSABLE_2_ID_OFFLINE_REVIEW_NOT_NATIVE_OR_PUBLISHED')
          PY
      - name: SHA256 evidence and formal outputs remain untouched
        run: |
          set -euo pipefail
          (cd evidence && find . -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          git diff --exit-code -- docs/data.json docs/platform_status.json docs/index.html scraper.py
          echo PASS_ZERO_FORMAL_DATA_AND_AUTOMATIC_PUBLISHER_WRITES
      - uses: actions/upload-artifact@v4
        with:
          name: eventradar-tpac-multi-event-review-lkg-readiness
          path: evidence/
          if-no-files-found: error
          retention-days: 30
