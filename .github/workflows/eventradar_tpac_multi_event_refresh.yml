              return json.loads(subprocess.check_output(
                  cmd + ['--inventory-input', str(path)], text=True, timeout=30))
          first = replay(manifest)
          original_doc, initial_sha = load_detail_inventory(archive)
          assert first['counts']['source_cards'] == 38
          assert first['counts']['detail_available'] == 3
          assert len(original_doc['items']) == 38
          assert initial_sha == first['inventory']['sha256']
          lock = archive / '_isolated_review' / 'tpac' / '.inventory.lock'
          initial_inode = lock.stat().st_ino
          # Prove actual cross-process exclusion, not an in-process mock.
          child_code = (
              "import sys\nfrom pathlib import Path\n"
              "from scripts.p30_tpac_multi_event_refresh import _isolated_writer_lock\n"
              "with _isolated_writer_lock(Path(sys.argv[1]), 'HOLD'):\n"
              "    print('LOCKED', flush=True)\n    sys.stdin.read()\n"
          )
          child = subprocess.Popen(
              [sys.executable, '-u', '-c', child_code, str(lock)],
              stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
              text=True)
          try:
              ready, _, _ = select.select([child.stdout], [], [], 8)
              assert ready and child.stdout.readline().strip() == 'LOCKED', (
                  'HOLD_CHILD_LOCK_NOT_ACQUIRED')
              blocked = subprocess.run(cmd + ['--inventory-input', str(manifest)],
                                       capture_output=True, text=True, timeout=25)
              assert blocked.returncode != 0
              assert 'TPAC_INVENTORY_CONCURRENT_WRITER_HOLD' in blocked.stderr
              assert load_detail_inventory(archive)[1] == initial_sha
          finally:
              child.kill()
              child.communicate(timeout=10)
          assert lock.stat().st_ino == initial_inode
          # The same fixed Adapter CLI must replay after SIGKILL without
          # deleting or stealing the persistent lock inode.
          resumed = replay(manifest)
          assert resumed['inventory']['sha256'] == initial_sha
          assert lock.stat().st_ino == initial_inode
          partial = copy.deepcopy(original)
          del partial['catalogs']['event']['details']['1301']
          partial_path = root / 'partial_manifest.json'
          partial_path.write_text(json.dumps(partial, ensure_ascii=False),
                                  encoding='utf-8')
          # A real process exits between staging the new JSON and atomic
          # replacement. The last-known-good CAS must survive unchanged.
          crash_code = (
              "import os,sys\nfrom pathlib import Path\n"
              "import scripts.p30_tpac_multi_event_refresh as source\n"
              "prior=os.replace\n"
              "def crash(src,dst):\n"
              "    if Path(dst).name == 'tpac_detail_inventory.json':\n"
              "        os._exit(77)\n"
              "    return prior(src,dst)\n"
              "os.replace=crash\n"
              "source.archived_inventory_cli(sys.argv[1],sys.argv[2])\n"
          )
