name: EventRadar P30-VENUE-02R exact-head source-quality (NO PUBLISH)
on:
  pull_request:
    branches: [feat/eventradar-p30-venue02q-xinzhuang-redirect-class]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: eventradar-venue02r-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  source-quality:
    if: github.repository == 'easonliu714/event_scraper_public' && github.head_ref == 'feat/eventradar-p30-venue02r-shulin-discovery'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact-head and immutable production data guard
        shell: bash
        run: |
          set -euo pipefail
          base=60fb431f3d63646e717362722c23a45cf2cd5bf4
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git merge-base "$base" HEAD)" = "$base"
          expected="$(printf 'A\t%s\n' '.github/workflows/eventradar_p30_venue02r.yml' 'scripts/p30_venue02r_shulin_discovery.py' 'tests/p30/test_venue02r_shulin_discovery.py' | LC_ALL=C sort)"
          test "$expected" = "$(git diff --name-status "$base" HEAD | LC_ALL=C sort)"
          test "$(git rev-parse origin/main:docs/data.json)" = 7fc4fe32567a57fd504483eeb9a8b9e10b568ea4
          test "$(git rev-parse origin/main:docs/platform_status.json)" = e19ca37c4c80c10b7278d0813b8ff1047535d124
      - name: Frozen predecessor and new fail-closed regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'requests==2.32.5' 'beautifulsoup4==4.14.2'
          python -m py_compile scripts/p30_venue02r_shulin_discovery.py tests/p30/test_venue02r_shulin_discovery.py
          python -m unittest discover -s tests/p30 -p test_venue02q_xinzhuang_redirect.py -v
          python -m unittest discover -s tests/p30 -p test_venue02r_shulin_discovery.py -v
      - name: Bounded official source-quality read and immutable receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p p30-venue02r-evidence
          python scripts/p30_venue02r_shulin_discovery.py --live-one --out p30-venue02r-evidence/audit.json
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('p30-venue02r-evidence')
          p=root/'audit.json'; a=json.loads(p.read_text())
          assert a['requestCount']==a['requestBudget']==1
          assert a['acceptedFields']==a['goldenAccepted']==0 and a['published'] is False
          assert a['releaseState']=='HARD_HOLD_NO_PUBLICATION'
          assert 'rawHtml' not in a and 'cookies' not in a
          print('SOURCE_QUALITY_DECISION='+str(a.get('decision')))
          print('SOURCE_RECEIPTS='+json.dumps({k:v for k,v in a.items() if k.endswith('Receipt')},sort_keys=True))
          (root/'manifest.json').write_text(json.dumps({'filesSHA256':{'audit.json':hashlib.sha256(p.read_bytes()).hexdigest()}},sort_keys=True)+'\n')
          PY
          (cd p30-venue02r-evidence && sha256sum *.json > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p30-venue02r-evidence
          path: p30-venue02r-evidence/
          if-no-files-found: ignore
