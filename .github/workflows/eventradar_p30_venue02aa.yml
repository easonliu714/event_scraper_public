name: EventRadar P30-VENUE02AA exact-head offline root-cause (NO PUBLISH)
on:
  pull_request:
    branches: [feat/eventradar-p30-venue02z-ceramics-fields]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: eventradar-venue02aa-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  offline-root-cause:
    if: github.repository == 'easonliu714/event_scraper_public' && github.head_ref == 'feat/eventradar-p30-venue02aa-ceramics-leaf-role'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact-head and immutable production guard
        shell: bash
        run: |
          set -euo pipefail
          base=126d797bf999d640c8250be92c888c54b6ed6b1f
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git merge-base "$base" HEAD)" = "$base"
          expected="$(printf 'A\t%s\n' 'scripts/p30_venue02aa_ceramics_leaf_roles.py' 'tests/p30/test_venue02aa_ceramics_leaf_roles.py' '.github/workflows/eventradar_p30_venue02aa.yml' | LC_ALL=C sort)"
          test "$expected" = "$(git diff --name-status "$base" HEAD | LC_ALL=C sort)"
          test "$(git rev-parse origin/main:docs/data.json)" = 7fc4fe32567a57fd504483eeb9a8b9e10b568ea4
          test "$(git rev-parse origin/main:docs/platform_status.json)" = e19ca37c4c80c10b7278d0813b8ff1047535d124
      - name: Frozen predecessor and root-cause regressions (zero official GET)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'requests==2.32.5' 'beautifulsoup4==4.14.2'
          python -m py_compile 'scripts/p30_venue02aa_ceramics_leaf_roles.py' 'tests/p30/test_venue02aa_ceramics_leaf_roles.py'
          python -m unittest discover -s tests/p30 -p 'test_venue02z_ceramics_fields.py' -v
          python -m unittest discover -s tests/p30 -p 'test_venue02aa_ceramics_leaf_roles.py' -v
      - name: Offline evidence and immutable manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p eventradar_venue02aa-evidence
          python - <<'PY'
          import hashlib,json,pathlib,subprocess
          root=pathlib.Path('eventradar_venue02aa-evidence')
          audit={'gate':'P30-VENUE02AA','mode':'OFFLINE_ROOT_CAUSE_ONLY',
                 'sourceQualityNewFromCI':False,'officialGET':0,'acceptedFields':0,
                 'goldenAccepted':0,'published':False,
                 'releaseState':'HARD_HOLD_NO_PUBLICATION',
                 'headSHA':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()}
          p=root/'audit.json';p.write_text(json.dumps(audit,sort_keys=True)+'\n')
          (root/'manifest.json').write_text(json.dumps({'filesSHA256':{'audit.json':hashlib.sha256(p.read_bytes()).hexdigest()}},sort_keys=True)+'\n')
          PY
          (cd eventradar_venue02aa-evidence && sha256sum *.json > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eventradar_venue02aa-evidence
          path: eventradar_venue02aa-evidence/
          if-no-files-found: ignore
