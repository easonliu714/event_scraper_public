name: EventRadar P30 L9-AQ FamiTicket iframe refusal (NO PUBLISH)
on:
  pull_request:
    branches: [feat/eventradar-p30-l9ap-list-error-class-20261030-0155]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: eventradar-p30-l9aq-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  famiticket-iframe-refusal:
    if: github.repository == 'easonliu714/event_scraper_public' && github.head_ref == 'feat/eventradar-p30-l9aq-famiticket-iframe-20261030-0255'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact HEAD and three add-only paths and frozen formal data
        shell: bash
        run: |
          set -euo pipefail
          base=4a888374a24e5515e6c1c98e33b0428b112d4fec
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git merge-base "$base" HEAD)" = "$base"
          expected="$(printf 'A\t%s\n' '.github/workflows/eventradar_p30_l9aq_famiticket_iframe.yml' 'scripts/p30_l9aq_famiticket_iframe_boundary.py' 'tests/p30/test_l9aq_famiticket_iframe_boundary.py' | LC_ALL=C sort)"
          test "$expected" = "$(git diff --name-status "$base" HEAD | LC_ALL=C sort)"
          test "$(git rev-parse origin/main:docs/data.json)" = 7fc4fe32567a57fd504483eeb9a8b9e10b568ea4
          test "$(git rev-parse origin/main:docs/platform_status.json)" = e19ca37c4c80c10b7278d0813b8ff1047535d124
      - name: Frozen FamiTicket and new iframe refusal offline tests
        run: |
          python -m pip install --disable-pip-version-check 'requests==2.32.5' 'beautifulsoup4==4.14.2'
          python -m py_compile scripts/p30_l9aq_famiticket_iframe_boundary.py tests/p30/test_l9aq_famiticket_iframe_boundary.py
          python -m unittest discover -s tests/p30 -p test_l3b_a_famiticket.py -v
          python -m unittest discover -s tests/p30 -p test_l9aq_famiticket_iframe_boundary.py -v
      - name: Explicit offline-only evidence with SHA manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p p30-l9aq-evidence
          python - <<'PY'
          import hashlib,json,pathlib
          d=pathlib.Path('p30-l9aq-evidence')
          r=dict(kind='EVENTRADAR_P30_L9AQ_FAMITICKET_IFRAME_REFUSAL_V1',
                 sourceQualityThisCI='UNVERIFIED_NO_LIVE_GET',
                 evidenceOrigin='OFFLINE_TESTS_ONLY',
                 acceptedFields=0,goldenAccepted=0,published=False,
                 iframeFollowed=False,releaseState='HARD_HOLD_NO_PUBLICATION')
          raw=(json.dumps(r,sort_keys=True,indent=2)+'\n').encode()
          (d/'audit.json').write_bytes(raw)
          (d/'manifest.json').write_text(json.dumps({'filesSHA256':{'audit.json':hashlib.sha256(raw).hexdigest()}},sort_keys=True)+'\n')
          assert r['acceptedFields']==r['goldenAccepted']==0 and not r['published']
          PY
          (cd p30-l9aq-evidence && sha256sum *.json > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eventradar-p30-l9aq-iframe-refusal
          path: p30-l9aq-evidence/
          if-no-files-found: ignore
