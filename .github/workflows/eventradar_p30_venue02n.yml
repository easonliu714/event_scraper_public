name: EventRadar P30 venue02n exact-head source-quality (NO PUBLISH)
on:
  pull_request:
    branches: [feat/eventradar-p30-venue02m-xinzhuang-discovery]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: eventradar-venue02n-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  source-quality:
    if: github.repository == 'easonliu714/event_scraper_public' && github.head_ref == 'feat/eventradar-p30-venue02n-xinzhuang-link-role'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact head and immutable formal JSON guard
        shell: bash
        run: |
          set -euo pipefail
          base=c65efb5f6b977e9ae24ae0572a1f316b73824fe7
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git merge-base "$base" HEAD)" = "$base"
          expected="$(printf 'A\t%s\n' '.github/workflows/eventradar_p30_venue02n.yml' 'scripts/p30_venue02n_xinzhuang_link_role.py' 'tests/p30/test_venue02n_xinzhuang_link_role.py' | LC_ALL=C sort)"
          test "$expected" = "$(git diff --name-status "$base" HEAD | LC_ALL=C sort)"
          test "$(git rev-parse origin/main:docs/data.json)" = 7fc4fe32567a57fd504483eeb9a8b9e10b568ea4
          test "$(git rev-parse origin/main:docs/platform_status.json)" = e19ca37c4c80c10b7278d0813b8ff1047535d124
      - name: Frozen predecessors and fail-closed regression tests
        run: |
          python -m pip install --disable-pip-version-check 'requests==2.32.5' 'beautifulsoup4==4.14.2'
          python -m py_compile scripts/p30_venue02n_xinzhuang_link_role.py tests/p30/test_venue02n_xinzhuang_link_role.py
          python -m unittest discover -s tests/p30 -p test_venue02l_ntpc_artcenter.py -v
          python -m unittest discover -s tests/p30 -p test_venue02m_xinzhuang_discovery.py -v
          python -m unittest discover -s tests/p30 -p test_venue02n_xinzhuang_link_role.py -v
      - name: Bounded official source GET with sanitized SHA receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p p30-venue02n-evidence
          python scripts/p30_venue02n_xinzhuang_link_role.py --live-one --out p30-venue02n-evidence/audit.json
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('p30-venue02n-evidence')
          p=root/'audit.json'
          a=json.loads(p.read_text())
          assert a['requestCount']==a['requestBudget']==1
          assert a['acceptedFields']==a['goldenAccepted']==0 and a['published'] is False
          assert a['releaseState']=='HARD_HOLD_NO_PUBLICATION'
          assert 'rawHtml' not in a and 'cookies' not in a
          (root/'manifest.json').write_text(json.dumps({'filesSHA256':{'audit.json':hashlib.sha256(p.read_bytes()).hexdigest()}},sort_keys=True)+'\n')
          PY
          (cd p30-venue02n-evidence && sha256sum *.json > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p30-venue02n-evidence
          path: p30-venue02n-evidence/
          if-no-files-found: ignore
