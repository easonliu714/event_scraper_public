name: EventRadar P30-VENUE02AF Ceramics adjacency offline (NO PUBLISH)
on:
  pull_request:
    branches: [feat/eventradar-p30-venue02ae-ceramics-role-node-cause]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  adjacency:
    if: github.repository == 'easonliu714/event_scraper_public' && github.head_ref == 'feat/eventradar-p30-venue02af-ceramics-adjacency-20261031-0650'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact head and frozen production
        shell: bash
        run: |
          set -euo pipefail
          base=2584b1c13c9343be6d636331935ad347dbe359a4
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git merge-base "$base" HEAD)" = "$base"
          expected="$(printf 'A\t%s\n' 'scripts/p30_venue02af_ceramics_adjacency.py' 'tests/p30/test_venue02af_ceramics_adjacency.py' '.github/workflows/eventradar_p30_venue02af.yml' | LC_ALL=C sort)"
          test "$expected" = "$(git diff --name-status "$base" HEAD | LC_ALL=C sort)"
          test "$(git rev-parse origin/main:docs/data.json)" = 7fc4fe32567a57fd504483eeb9a8b9e10b568ea4
          test "$(git rev-parse origin/main:docs/platform_status.json)" = e19ca37c4c80c10b7278d0813b8ff1047535d124
      - name: AE predecessor and AF adjacency tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'beautifulsoup4==4.14.2' 'requests==2.32.5'
          python -m py_compile scripts/p30_venue02af_ceramics_adjacency.py tests/p30/test_venue02af_ceramics_adjacency.py
          python -m unittest discover -s tests/p30 -p 'test_venue02ae_ceramics_role_node_cause.py' -v
          python -m unittest discover -s tests/p30 -p 'test_venue02af_ceramics_adjacency.py' -v
      - name: Sanitized offline evidence and SHA manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p eventradar_venue02af-evidence
          python - <<'PY'
          import hashlib,json,pathlib,subprocess
          p=pathlib.Path('eventradar_venue02af-evidence')
          a={'gate':'P30-VENUE-02AF','headSHA':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'officialGET':0,'sourceQualityNew':False,'acceptedFields':0,'goldenAccepted':0,'published':False,'releaseState':'HARD_HOLD_NO_PUBLICATION'}
          (p/'audit.json').write_text(json.dumps(a,sort_keys=True)+'\n')
          (p/'manifest.json').write_text(json.dumps({'filesSHA256':{'audit.json':hashlib.sha256((p/'audit.json').read_bytes()).hexdigest()}},sort_keys=True)+'\n')
          PY
          (cd eventradar_venue02af-evidence && sha256sum *.json > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eventradar_venue02af-evidence
          path: eventradar_venue02af-evidence/
          if-no-files-found: ignore
