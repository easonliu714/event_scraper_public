name: EventRadar P30 L9-O ibon label-selector parity (READ ONLY)
on:
  push:
    branches:
      - feat/eventradar-p30-l9o-ibon-label-topology
permissions:
  contents: read
  actions: read
concurrency:
  group: eventradar-p30-l9o-label-topology
  cancel-in-progress: true
jobs:
  four-source-selector-parity:
    if: github.repository == 'easonliu714/event_scraper_public'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Source pin and exact three-path read-only delta
        run: |
          set -euo pipefail
          base=768e2ee1d6982b3e690c48d98d0be0f4e16a6944
          git merge-base --is-ancestor "$base" HEAD
          test "$(git rev-parse HEAD:docs/data.json)" = 7fc4fe32567a57fd504483eeb9a8b9e10b568ea4
          test "$(git rev-parse HEAD:scraper.py)" = 98eddeafb497718c51aa81c6a150e9a5e1e687a8
          expected="$(printf 'A\t%s\n' '.github/workflows/eventradar_p30_l9o_ibon_label_topology.yml' 'scripts/p30_l9o_ibon_label_topology.mjs' 'tests/p30/test_l9o_ibon_label_topology.mjs' | LC_ALL=C sort)"
          actual="$(git diff --name-status "$base" HEAD | LC_ALL=C sort)"
          test "$expected" = "$actual" || { echo HOLD_L9O_UNEXPECTED_SOURCE_DIFF; exit 1; }
          echo PASS_L9O_FROZEN_PRODUCTION_EXACT_THREE_PATHS
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Normal Chromium only
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.55.0
          ./node_modules/.bin/playwright install chromium
      - name: Syntax and deterministic 29 negative contracts
        run: |
          set -euo pipefail
          node --check scripts/p30_l9o_ibon_label_topology.mjs
          node --test tests/p30/test_l9o_ibon_label_topology.mjs
          echo PASS_L9O_29_OFFLINE_CONTRACTS
      - uses: actions/download-artifact@v4
        with:
          name: eventradar-p30-l9n-ibon-root-causes-readonly
          run-id: 40686039228
          repository: easonliu714/event_scraper_public
          github-token: ${{ github.token }}
          path: pinned-l9n
      - uses: actions/download-artifact@v4
        with:
          name: eventradar-p30-l9f-ibon-detail-roles-review-only
          run-id: 40494326021
          repository: easonliu714/event_scraper_public
          github-token: ${{ github.token }}
          path: pinned-l9f
      - name: Verify immutable source artifact ZIP metadata and file SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/easonliu714/event_scraper_public/actions/artifacts/12814702732" \
            | python -c 'import json,sys; d=json.load(sys.stdin); assert d["id"]==12814702732; assert d["workflow_run"]["head_sha"]=="768e2ee1d6982b3e690c48d98d0be0f4e16a6944"; assert d["digest"]=="sha256:a049545092f6a508791f3a12b5c05395de7b4eb975efbb3d9b8813319ec1a5c9"; assert not d["expired"]; print("PASS_L9O_L9N_ARTIFACT_ZIP_PIN")'
          (cd pinned-l9n && sha256sum -c SHA256SUMS.txt)
          (cd pinned-l9f && sha256sum -c SHA256SUMS.txt)
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import {parents} from './scripts/p30_l9o_ibon_label_topology.mjs';
          const n=readFileSync('pinned-l9n/ibon_local_root_cause.json');
          const f=readFileSync('pinned-l9f/detail_role_review.json');
          const p=parents(JSON.parse(n),n,JSON.parse(f),f);
          if(p.sources.length!==4)throw Error('HOLD_L9O_FOUR_SOURCE_ID');
          console.log('PASS_L9O_L9N_AND_L9F_SHA_PINNED',p.nsha,p.fsha);
          JS
      - name: Four bounded official rendered pages, label-selector parity
        run: |
          set -euo pipefail
          node scripts/p30_l9o_ibon_label_topology.mjs \
            --l9n pinned-l9n/ibon_local_root_cause.json \
            --l9f pinned-l9f/detail_role_review.json \
            --out p30-l9o-evidence
      - name: Source-specific report and publication safety independent readback
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          d=Path('p30-l9o-evidence')
          r=json.loads((d/'ibon_label_topology.json').read_text())
          m=json.loads((d/'manifest.json').read_text())
          assert r['kind']=='EVENTRADAR_P30_L9O_IBON_LABEL_SELECTOR_PARITY_V1'
          assert r['sampleCount']==len(r['rows'])==4
          assert [x['id'] for x in r['rows']]==['39575','39878','39907','39978']
          assert r['parentL9NRun']==40686039228 and r['parentL9NArtifact']==12814702732
          assert r['parentL9NZipSHA256']=='a049545092f6a508791f3a12b5c05395de7b4eb975efbb3d9b8813319ec1a5c9'
          assert r['currentExactHeadingCount']<=4
          assert r['l9mScopeLabelCount']>=r['l9nH3LabelCount']>=0
          assert r['localReviewOnlyCount']<=r['l9mScopeLabelCount']
          assert r['formalFieldPromotions']==r['goldenAccepted']==0
          assert r['published'] is False and r['releaseState']=='HARD_HOLD_NO_PUBLICATION'
          assert not any(r[k] for k in ('writerExecuted','schedulerExecuted','notifierExecuted','mergeExecuted','rawHtmlPersisted','cookiesPersisted','screenshotsPersisted'))
          assert r['existingAndroid44Preserved'] and r['l8CoreAndroidPassPreserved']
          for x in r['rows']:
            assert x['url']=='https://ticket.ibon.com.tw/ActivityInfo/Details/'+x['id']
            assert x['formalDate'] is None and x['formalPrice'] is None and x['ticketStatus']=='UNKNOWN'
            assert x['formalFieldPromotions']==0
            assert x['l9mSelectorLabelCount']==len(x['observations'])<=12
            if not x['title']['headingExact']:assert x['localReviewOnlyCount']==0
            assert all(z['fieldPromoted'] is False for z in x['observations'])
            print('L9O_DETAIL',x['id'],x['http'],x['title']['kind'],x['l9mSelectorLabelCount'],x['strictH3LabelCount'],x['labelTagCounts'])
          assert hashlib.sha256((d/'ibon_label_topology.json').read_bytes()).hexdigest()==m['filesSHA256']['ibon_label_topology.json']
          print('PASS_L9O_FOUR_DETAIL_SELECTOR_PARITY_REPORT_SHA')
          print('QUALITY_L9O_MULTI_TAG_LABELS',r['l9mScopeLabelCount'])
          print('QUALITY_L9O_H3_ONLY_LABELS',r['l9nH3LabelCount'])
          print('HOLD_L9O_NO_FORMAL_EVENT_FIELDS_NO_GOLDEN_NO_PUBLICATION')
          PY
      - name: Seal isolated audit artifact
        if: always()
        run: |
          mkdir -p p30-l9o-evidence
          if test -f p30-l9o-evidence/manifest.json; then
            (cd p30-l9o-evidence && sha256sum ibon_label_topology.json manifest.json > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          else
            echo HOLD_L9O_NO_REPORT
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eventradar-p30-l9o-ibon-label-topology-readonly
          path: p30-l9o-evidence/
          retention-days: 14
          if-no-files-found: warn
