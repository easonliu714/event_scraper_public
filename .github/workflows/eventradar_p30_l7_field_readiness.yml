                  'formal_accepted':False,
                  'golden_prerequisites':['independent artifact/readback','source freshness and conflict review',
                      'field-specific Owner release authority']})
          report={'kind':'P30_L7_NATIVE_SAME_SESSION_FIELD_MATRIX_V1',
