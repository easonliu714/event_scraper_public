          python - <<'PY'
          import datetime, hashlib, json, re, socket, ssl, urllib.error, urllib.parse, urllib.request
          from html.parser import HTMLParser
          from pathlib import Path

          # Exactly three official HTTPS public GETs; same process/run, one per URL.
          # No cookies, redirects, retries, login, ticket backend or raw HTML persistence.
          A = 'https://www.tmc.taipei/tw/blog/show/2026SungNien-Yu'
          TICKET = 'https://kham.com.tw/application/UTK02/UTK0201_.aspx?PRODUCT_ID=P1DF32E2'
          BL = 'https://twtc.com.tw/exhibition?p=home'
          BD = 'https://twtc.com.tw/exhibition_more.aspx?id=29418&p=home'
          TITLE = '2026年電器空調影音大展'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl): return None
          class PublicDOM(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.texts=[]; self.links=[]; self.rows=[]; self.row=None; self.anchor=None
              def handle_starttag(self, tag, attrs):
                  attrs=dict(attrs)
                  if tag=='tr': self.row={'text':[],'links':[]}
                  if tag=='a': self.anchor={'href':attrs.get('href',''),'text':[]}
              def handle_data(self, data):
                  self.texts.append(data)
                  if self.row is not None: self.row['text'].append(data)
                  if self.anchor is not None: self.anchor['text'].append(data)
              def handle_endtag(self, tag):
                  if tag=='a' and self.anchor is not None:
                      a={'href':self.anchor['href'],'text':' '.join(' '.join(self.anchor['text']).split())}
                      self.links.append(a)
                      if self.row is not None: self.row['links'].append(a)
                      self.anchor=None
                  if tag=='tr' and self.row is not None:
                      self.rows.append({'text':' '.join(' '.join(self.row['text']).split()),'links':self.row['links']})
                      self.row=None
          def native(url):
              r={'url':url,'observed_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
                 'http_status':None,'sha256':None,'bytes':0,'decision':'SOURCE_FRESHNESS_HOLD'}
              try:
                  req=urllib.request.Request(url,method='GET',headers={
                      'User-Agent':'EventRadarSourceAudit/1.0 (public read-only)',
