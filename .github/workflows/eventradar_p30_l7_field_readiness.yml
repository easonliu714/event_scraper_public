          print('NATIVE_SAME_SESSION_MATRIX',json.dumps({
              'http200':report['native_http_200'],'review':report['acceptability_review'],
              'hold':report['hold'],'same_id':same_row,'formal':0,'golden':0,'published':0}),flush=True)
