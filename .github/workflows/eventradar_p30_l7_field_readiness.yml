          import datetime, hashlib, json, re, urllib.request
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urljoin
          TPAC = 'https://tpac.org.taipei/program/2088'
          TICKET = 'https://www.opentix.life/event/2072516129034670080'
          TITLE = 'C MUSICAL 音樂劇《小王子》'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          class Scoped(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.depth = 0
                  self.h1 = []
                  self.links = []
                  self.text = []
                  self.capture = None
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == 'h1':
                      self.depth += 1
                      self.capture = []
                  if tag == 'a':
                      self.links.append(attrs.get('href', ''))
              def handle_data(self, value):
                  if self.capture is not None:
                      self.capture.append(value)
                  if len(self.text) < 30000:
                      self.text.append(value)
              def handle_endtag(self, tag):
                  if tag == 'h1' and self.capture is not None:
                      self.h1.append(' '.join(''.join(self.capture).split()))
                      self.capture = None
          report = {
              'kind': 'P30_L7_A_TPAC_TO_OPENTIX_DIRECT_EDGE_NATIVE_ONCE_V1',
              'hypothesis': 'Official TPAC program/2088 direct ticket anchor points to exact OPENTIX event ID and both source-local titles/venue agree',
