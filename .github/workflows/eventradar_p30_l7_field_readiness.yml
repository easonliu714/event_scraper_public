                      and any(k.lower()=='id' and v=='29418' for k,v in q)
                      and all(k.lower() in ('id','p') for k,v in q)
                      and all(v=='home' for k,v in q if k.lower()=='p'))
              except (ValueError,TypeError): return False
          assert valid_b('/exhibition_more.aspx?id=29418&p=home')
          for bad in ('/exhibition_more.aspx?id=29419&p=home',
                      '/exhibition_more.aspx?id=29418&id=29419',
                      'https://other.example/exhibition_more.aspx?id=29418',
                      '/exhibition_more.aspx?id=29418&ticket=123'):
              assert not valid_b(bad)
          records={}; dom={}
          for role,url in [('A_TMC_DETAIL',A),('B_TWTC_LIST',BL),('B_TWTC_DETAIL',BD)]:
              records[role],dom[role]=native(url)
          a=dom['A_TMC_DETAIL']; bl=dom['B_TWTC_LIST']; bd=dom['B_TWTC_DETAIL']
          a_text=' '.join(' '.join(a.texts).split()) if a else ''
          b_text=' '.join(' '.join(bd.texts).split()) if bd else ''
          same_row=bool(bl and any(TITLE in row['text'] and
              sum(valid_b(x['href']) for x in row['links'])==1 for row in bl.rows))
          a_anchor=bool(a and any(urllib.parse.urljoin(A,x['href'])==TICKET
              and '購票' in x['text'] for x in a.links))
          checks=[
              ('A','direct_ticket_product','LOCAL_PURCHASE_ANCHOR_NOT_SESSION',A,a_anchor),
              ('A','venue_showtime','VENUE_SHOW_NOT_SALE',A,bool(re.search(r'2026[./]11[./]07\s*19:30',a_text))),
              ('A','venue_hall','VENUE_HALL',A,bool(re.search(r'活動地點\s*臺北流行音樂中心\s*表演廳',a_text))),
              ('B','list_detail_identity','SAME_ROW_SAME_ID',BL,same_row),
