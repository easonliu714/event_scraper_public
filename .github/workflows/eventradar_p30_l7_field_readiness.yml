              'first_failure': 'SOURCE_NOT_ATTEMPTED',
              'no_raw_html_saved': True, 'ticket_session_id': None,
              'formal_accepted_fields': 0, 'golden_accepted_events': 0,
              'published_events': 0, 'release_state': 'HARD_HOLD_NO_PUBLICATION'}
          parsed = {}
          for url in (TPAC, TICKET):
              report['native_get_attempted'] += 1
              receipt = {'url': url, 'http_status': 0,
                         'observed_at_utc': datetime.datetime.now(
                             datetime.timezone.utc).isoformat()}
              try:
                  req = urllib.request.Request(url, method='GET', headers={
                      'User-Agent': 'EventRadarSourceAudit/1.0 (public read-only)',
                      'Accept': 'text/html', 'Accept-Encoding': 'identity'})
                  with urllib.request.build_opener(NoRedirect).open(req, timeout=8) as response:
                      receipt['http_status'] = response.status
                      final_url = response.geturl()
                      mime = response.headers.get_content_type()
                      charset = (response.headers.get_content_charset() or 'utf-8').lower()
                      raw = response.read(524289)
                  receipt['bytes_read_capped'] = len(raw)
                  receipt['content_type'] = mime
                  receipt['charset'] = charset
                  report['native_http200'] += int(receipt['http_status'] == 200)
                  if len(raw) > 524288:
                      # A bounded prefix hash is never a full source-body hash.
                      receipt['prefix_sha256'] = hashlib.sha256(raw).hexdigest()
                      receipt['body_truncated'] = True
                      raise ValueError('EXACT_URL_BODY_EXCEEDS_524288_HOLD')
                  receipt['body_sha256'] = hashlib.sha256(raw).hexdigest()
                  receipt['body_truncated'] = False
                  if (receipt['http_status'] != 200 or final_url != url or
                      mime != 'text/html' or charset != 'utf-8' or
                      not raw):
                      raise ValueError('EXACT_URL_HTTP_MIME_CHARSET_OR_EMPTY_BODY_HOLD')
                  receipt['transport'] = 'NATIVE_OFFICIAL_HTTP200_VALID_BOUNDED_BODY'
                  dom = Scoped()
                  dom.feed(raw.decode('utf-8', errors='strict'))
                  parsed[url] = dom
              except Exception as exc:
                  report['first_failure'] = (url + ':' + type(exc).__name__ +
                                             ':' + str(exc)[:100])
                  report['source_receipts'].append(receipt)
                  break
              report['source_receipts'].append(receipt)
          if len(parsed) == 2:
              venue, ticket = parsed[TPAC], parsed[TICKET]
              exact_link_count = sum(urljoin(TPAC, href) == TICKET for href in venue.links)
              title_ok = venue.h1.count(TITLE) == 1 and ticket.h1.count(TITLE) == 1
              venue_ok = '藍盒子' in ''.join(venue.text) and '藍盒子' in ''.join(ticket.text)
              report['identity_checks'] = {
                  'tpac_exact_ticket_href_count': exact_link_count,
                  'tpac_exact_h1_count': venue.h1.count(TITLE),
                  'opentix_exact_h1_count': ticket.h1.count(TITLE),
                  'venue_both_sources': venue_ok,
                  'age_min_tpac': '6+ INDEXED_REVIEW_NOT_NATIVE_ATTESTED',
                  'age_min_opentix': '7+ INDEXED_REVIEW_NOT_NATIVE_ATTESTED',
                  'age_conflict': 'HOLD_NEVER_AUTO_PROMOTE',
                  'multi_show_sessions': 'NOT_FLATTENED'}
              if exact_link_count == 1 and title_ok and venue_ok:
                  report['same_event_direct_edge_review'] = 1
                  report['decision'] = 'REVIEW_DIRECT_EVENT_EDGE_ONLY'
                  report['first_failure'] = 'INDEPENDENT_FORMAL_FIELD_AUTHORITY_AND_SESSIONS_HOLD'
              else:
                  report['first_failure'] = 'TPAC_OPENTIX_NATIVE_DOM_EDGE_TITLE_OR_VENUE_HOLD'
          assert report['formal_accepted_fields'] == report['golden_accepted_events'] == report['published_events'] == 0
          assert report['native_get_attempted'] <= 2
