name: EventRadar P30-L7 field Golden readiness exact-head NO PUBLISH
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  actions: read
jobs:
  source-field-readiness:
    if: github.repository == 'easonliu714/event_scraper_public' && github.head_ref == 'feat/eventradar-p30-l7-field-golden-readiness-contract'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact HEAD and immutable formal release guard
        shell: bash
        run: |
          set -euo pipefail
          base=d3b77cf97796ad5c7e8cf16fc847feeea2bc6dce
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git merge-base "$base" HEAD)" = "$base"
          expected="$(printf '%s\n' '.github/workflows/eventradar_p30_l7_field_readiness.yml' 'scripts/p30_l7_field_golden_readiness.py' 'scripts/p30_source_stream_gate.py' 'tests/p30/test_p30_l7_field_golden_readiness.py' 'tests/p30/test_p30_source_stream_gate.py' 'scripts/p30_accupass_native_gate.py' 'tests/p30/test_p30_accupass_native_gate.py' 'scripts/p30_ntpc_artcenter_source.py' 'tests/p30/test_p30_ntpc_artcenter_source.py' 'scripts/p30_dual_native_rotation.py' 'tests/p30/test_p30_dual_native_rotation.py' 'scripts/p30_cloudgate_native_gate.py' 'tests/p30/test_p30_cloudgate_native_gate.py' 'scripts/p30_ab_kktix_fuzhong_native.py' 'tests/p30/test_p30_ab_kktix_fuzhong_native.py' 'scripts/p30_tpac_event_source.py' 'scripts/p30_review_bridge.py' 'tests/p30/test_p30_review_bridge.py' 'tests/p30/fixtures/p30_l7_prince_field_readiness.json' | LC_ALL=C sort)"
          test "$expected" = "$(git diff --name-only "$base" HEAD | LC_ALL=C sort)"
          git diff --name-status "$base" HEAD | awk '$1!="A" {exit 1}'
          test "$(git rev-parse HEAD:docs/data.json)" = 7fc4fe32567a57fd504483eeb9a8b9e10b568ea4
          test "$(git rev-parse HEAD:docs/platform_status.json)" = 99cae0571e36e52dac360b6935c0c09f6f6bed3f
          test "$(git rev-parse HEAD:scraper.py)" = 98eddeafb497718c51aa81c6a150e9a5e1e687a8
          test "$(git rev-parse HEAD:docs/index.html)" = d284e3007d95016312385892eef4449b03946c9c
          python - <<'PY'
          import json,subprocess
          d=json.loads(subprocess.check_output(['git','show','HEAD:docs/platform_status.json']))
          assert len(d['platforms'])==19
          assert d['production']['eventFeedReleaseState']=='HARD_HOLD_NO_PUBLICATION'
          assert d['production']['goldenAccepted']==0
          PY
      - name: Source-bound acceptance contract and negative tests
        run: |
          python -m py_compile scripts/p30_l7_field_golden_readiness.py scripts/p30_source_stream_gate.py scripts/p30_accupass_native_gate.py tests/p30/test_p30_l7_field_golden_readiness.py tests/p30/test_p30_source_stream_gate.py tests/p30/test_p30_accupass_native_gate.py scripts/p30_ntpc_artcenter_source.py tests/p30/test_p30_ntpc_artcenter_source.py scripts/p30_dual_native_rotation.py tests/p30/test_p30_dual_native_rotation.py scripts/p30_cloudgate_native_gate.py tests/p30/test_p30_cloudgate_native_gate.py scripts/p30_ab_kktix_fuzhong_native.py tests/p30/test_p30_ab_kktix_fuzhong_native.py scripts/p30_tpac_event_source.py scripts/p30_review_bridge.py tests/p30/test_p30_review_bridge.py
          python -m unittest discover -s tests/p30 -p 'test_p30_l7_field_golden_readiness.py' -v
          python -m unittest discover -s tests/p30 -p 'test_p30_source_stream_gate.py' -v
          python -m unittest discover -s tests/p30 -p 'test_p30_accupass_native_gate.py' -v
          python -m unittest discover -s tests/p30 -p 'test_p30_ntpc_artcenter_source.py' -v
          python -m unittest discover -s tests/p30 -p 'test_p30_dual_native_rotation.py' -v
          python -m unittest discover -s tests/p30 -p 'test_p30_cloudgate_native_gate.py' -v
          python -m unittest discover -s tests/p30 -p 'test_p30_ab_kktix_fuzhong_native.py' -v
          python -m unittest discover -s tests/p30 -p 'test_p30_review_bridge.py' -v
          python scripts/p30_l7_field_golden_readiness.py
      - name: One-shot bounded official native GET acquisition diagnosis (not Golden)
        shell: bash
        run: |
          set -euo pipefail
          if ! git log -1 --format=%s | grep -Fq '[source-probe-once]'; then
            echo 'SOURCE_PROBE_SKIPPED_NO_ONE_SHOT_COMMIT_MARKER'
            exit 0
          fi
          mkdir -p evidence
          python - <<'PY'
          import datetime, hashlib, json, socket, ssl, urllib.error, urllib.request
          from pathlib import Path
          # Exactly five official public pages. One GET per URL, no retries, login, or redirects.
          targets = [
              ('A', 'TMC_LIST', 'https://www.tmc.taipei/tw/blog/show', '2026SungNien-Yu'),
              ('A', 'TMC_DETAIL', 'https://www.tmc.taipei/tw/blog/show/2026SungNien-Yu', '宋念宇'),
              ('A', 'KHAM_EVENT', 'https://kham.com.tw/application/UTK02/UTK0201_.aspx?PRODUCT_ID=P1DF32E2', 'P1DF32E2'),
              ('B', 'TWTC_LIST', 'https://twtc.com.tw/exhibition?p=home', '電器空調影音'),
              ('B', 'TWTC_DETAIL', 'https://twtc.com.tw/exhibition_more.aspx?id=29418&p=home', '電器空調影音'),
          ]
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect)
          results = []
          for line, role, url, marker in targets:
              record = {'line': line, 'role': role, 'url': url, 'http_status': None, 'bytes': 0, 'sha256': None, 'marker_present_in_bounded_body': False, 'decision': 'SOURCE_FRESHNESS_HOLD'}
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'EventRadarSourceAudit/1.0 (read-only public evidence)', 'Accept': 'text/html,application/xhtml+xml', 'Accept-Encoding': 'identity'}, method='GET')
                  with opener.open(req, timeout=8) as response:
                      record['http_status'] = response.status
                      record['content_type'] = response.headers.get('Content-Type', '')[:100]
                      body = response.read(524289)
                      record['bytes'] = len(body)
                      record['sha256'] = hashlib.sha256(body).hexdigest()
                      record['truncated'] = len(body) > 524288
                      record['marker_present_in_bounded_body'] = marker.encode('utf-8') in body
                      record['decision'] = 'HTTP200_ONLY_FIELD_UNVERIFIED' if response.status == 200 and not record['truncated'] else 'BODY_OR_STATUS_HOLD'
              except urllib.error.HTTPError as exc:
                  record['http_status'] = exc.code
                  record['decision'] = 'REDIRECT_BLOCKED' if 300 <= exc.code < 400 else 'HTTP_ERROR_HOLD'
              except urllib.error.URLError as exc:
                  reason = exc.reason
                  record['error_type'] = type(reason).__name__
                  record['decision'] = 'DNS_OR_EGRESS_HOLD' if isinstance(reason, socket.gaierror) else 'NETWORK_OR_TLS_HOLD'
              except (TimeoutError, socket.timeout, ssl.SSLError, OSError) as exc:
                  record['error_type'] = type(exc).__name__
                  record['decision'] = 'NETWORK_OR_TLS_HOLD'
              results.append(record)
              print('SOURCE_PROBE', line, role, record['http_status'], record['decision'], flush=True)
          report = {'kind': 'P30_L7_ONE_SHOT_OFFICIAL_NATIVE_ACQUISITION_DIAGNOSTIC', 'observed_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'request_count': len(targets), 'native_http_200_count': sum(x['http_status'] == 200 for x in results), 'formal_accepted_fields': 0, 'golden': 0, 'published': 0, 'no_raw_pages_saved': True, 'results': results}
          Path('evidence/source_acquisition.json').write_text(json.dumps(report, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print('SOURCE_PROBE_SUMMARY', json.dumps({'requests': len(targets), 'native_http_200': report['native_http_200_count'], 'formal_accepted_fields': 0, 'golden': 0, 'published': 0}), flush=True)
          PY
      - name: One-shot native LIST DETAIL field-role semantic receipt (not Golden)
        shell: bash
        run: |
          set -euo pipefail
          if ! git log -1 --format=%s | grep -Fq '[semantic-probe-once]'; then
            echo 'SEMANTIC_PROBE_SKIPPED_NO_ONE_SHOT_COMMIT_MARKER'
            exit 0
          fi
          mkdir -p evidence
          python - <<'PY'
          import datetime, hashlib, json, re, socket, ssl, urllib.error, urllib.parse, urllib.request
          from html.parser import HTMLParser
          from pathlib import Path
          
          # Independent native source-field hypothesis. Public, bounded, read-only.
          # No checkout, authentication, redirect, retry, cookies, or raw page persistence.
          TMC_LIST = 'https://www.tmc.taipei/tw/blog/show'
          TMC_DETAIL = 'https://www.tmc.taipei/tw/blog/show/2026SungNien-Yu'
          KHAM = 'https://kham.com.tw/application/UTK02/UTK0201_.aspx?PRODUCT_ID=P1DF32E2'
          TWTC_LIST = 'https://twtc.com.tw/exhibition?p=home'
          TWTC_DETAIL = 'https://twtc.com.tw/exhibition_more.aspx?id=29418&p=home'
          TARGETS = [('A','TMC_LIST',TMC_LIST),('A','TMC_DETAIL',TMC_DETAIL),
                     ('A','KHAM_EVENT',KHAM),('B','TWTC_LIST',TWTC_LIST),
                     ('B','TWTC_DETAIL',TWTC_DETAIL)]
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, msg, headers, newurl):
                  return None
          class PublicHTML(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.texts = []
                  self.links = []
                  self.skip = 0
              def handle_starttag(self, tag, attrs):
                  if tag in ('script','style','noscript'):
                      self.skip += 1
                  if tag == 'a':
                      self.links.extend(v for k,v in attrs if k == 'href' and v)
              def handle_endtag(self, tag):
                  if tag in ('script','style','noscript') and self.skip:
                      self.skip -= 1
              def handle_data(self, data):
                  if not self.skip and data.strip():
                      self.texts.append(data.strip())
          def normalized(text):
              return re.sub(r'\s+', ' ', text).strip()
          def exact_link(page, target):
              if not page:
                  return False
              return any(urllib.parse.urljoin(page['url'], h) == target for h in page['links'])
          def match_label(page, pattern):
              if not page:
                  return False
              return bool(re.search(pattern, page['text']))
          def source(url, line, role):
              out = {'line':line,'role':role,'url':url,'http_status':None,'bytes':0,
                     'sha256':None,'decision':'SOURCE_FRESHNESS_HOLD'}
              try:
                  req = urllib.request.Request(url, headers={
                      'User-Agent':'EventRadarSourceAudit/1.0 (public read-only)',
                      'Accept':'text/html,application/xhtml+xml','Accept-Encoding':'identity'
                  }, method='GET')
                  with urllib.request.build_opener(NoRedirect).open(req, timeout=8) as resp:
                      out['http_status'] = resp.status
                      raw = resp.read(524289)
                      out['bytes'] = len(raw)
                      out['sha256'] = hashlib.sha256(raw).hexdigest()
                      if resp.status != 200 or len(raw) > 524288:
                          out['decision'] = 'HTTP_OR_BODY_SIZE_HOLD'
                          return out, None
                      charset = resp.headers.get_content_charset() or 'utf-8'
                      if charset.lower() not in ('utf-8','big5','cp950'):
                          out['decision'] = 'CHARSET_HOLD'
                          return out, None
                      try:
                          decoded = raw.decode(charset, errors='strict')
                      except (UnicodeError,LookupError):
                          out['decision'] = 'DECODE_HOLD'
                          return out, None
                      parser = PublicHTML()
                      parser.feed(decoded)
                      out['decision'] = 'HTTP200_NATIVE_BODY_REVIEW_ONLY'
                      return out, {'url':url,'text':normalized(' '.join(parser.texts)),
                                   'links':parser.links}
              except urllib.error.HTTPError as err:
                  out['http_status'] = err.code
                  out['decision'] = 'REDIRECT_BLOCKED' if 300 <= err.code < 400 else 'HTTP_ERROR_HOLD'
              except urllib.error.URLError as err:
                  out['error_type'] = type(err.reason).__name__
                  out['decision'] = 'DNS_OR_EGRESS_HOLD' if isinstance(err.reason,socket.gaierror) else 'NETWORK_HOLD'
              except (OSError,TimeoutError,ssl.SSLError) as err:
                  out['error_type'] = type(err).__name__
                  out['decision'] = 'NETWORK_HOLD'
              return out, None
          
          pages = {}
          records = []
          for line,role,url in TARGETS:
              rec,page = source(url,line,role)
              records.append(rec)
              pages[role] = page
              print('NATIVE_SEMANTIC_SOURCE',line,role,rec['http_status'],rec['decision'],flush=True)
          
          # Each field requires its own exact source/role. A literal marker is insufficient.
          checks = [
              ('A','tmc_list_exact_detail_href','EXACT_SAME_VENUE_DETAIL_HREF',
               TMC_LIST,exact_link(pages['TMC_LIST'],TMC_DETAIL)),
              ('A','tmc_detail_direct_kham_href','EXACT_TICKET_PRODUCT_HREF_NOT_SESSION',
               TMC_DETAIL,exact_link(pages['TMC_DETAIL'],KHAM)),
              ('A','tmc_venue_showtime','VENUE_SHOWTIME_NOT_SALE',
               TMC_DETAIL,match_label(pages['TMC_DETAIL'],r'2026[./]11[./]07\s*19:30')),
              ('A','tmc_venue_hall','VENUE_HALL_NOT_TICKET_SESSION',
               TMC_DETAIL,match_label(pages['TMC_DETAIL'],r'活動地點\s*臺北流行音樂中心\s*表演廳')),
              ('A','kham_sale_time','SALE_TIME_NOT_SHOWTIME',
               KHAM,match_label(pages['KHAM_EVENT'],r'開賣時間\s*[：:]\s*2026年\s*08月\s*22日.{0,25}12點')),
              ('B','twtc_list_same_id_href','EXACT_EXHIBITION_DETAIL_ID_HREF',
               TWTC_LIST,exact_link(pages['TWTC_LIST'],TWTC_DETAIL)),
              ('B','twtc_detail_title','EXHIBITION_TITLE_NOT_OTHER_EVENT',
               TWTC_DETAIL,match_label(pages['TWTC_DETAIL'],r'2026年電器空調影音大展')),
              ('B','twtc_exhibition_dates','EXHIBITION_DATES_NOT_TICKET_SESSION',
               TWTC_DETAIL,match_label(pages['TWTC_DETAIL'],r'展出日期\s*[：:]\s*2026/11/06\s*[~～\-]\s*2026/11/09')),
              ('B','twtc_daily_open_hours','EXHIBITION_OPEN_HOURS_NOT_SHOWTIME',
               TWTC_DETAIL,match_label(pages['TWTC_DETAIL'],r'展出時間\s*[：:]\s*10:00\s*[~～\-]\s*18:00')),
              ('B','twtc_venue_hall','EXHIBITION_HALL_NOT_TICKET_VENUE_ID',
               TWTC_DETAIL,match_label(pages['TWTC_DETAIL'],r'展覽館別\s*[：:]\s*世貿一館')),
          ]
          field_receipts = [
              {'line':line,'field':name,'role':role,'source':url,'native_label_or_href_match':bool(hit),
               'decision':'NATIVE_SOURCE_ROLE_REVIEW_ONLY' if hit else 'NATIVE_LABEL_OR_LINK_HOLD',
               'formal_accepted':False}
              for line,name,role,url,hit in checks
          ]
          report = {
              'kind':'P30_L7_ONE_SHOT_NATIVE_SEMANTIC_FIELD_DIAGNOSTIC',
              'observed_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'request_count':len(records),'native_http_200_count':sum(r['http_status']==200 for r in records),
              'field_context_review_count':sum(x['native_label_or_href_match'] for x in field_receipts),
              'field_context_hold_count':sum(not x['native_label_or_href_match'] for x in field_receipts),
              'sources':records,'field_receipts':field_receipts,
              'formal_accepted_fields':0,'golden':0,'published':0,
              'no_raw_html_saved':True,'release_state':'HARD_HOLD_NO_PUBLICATION',
              'next_gate':'INDEPENDENT_SOURCE_IDENTITY_AND_FIELD_GOLDEN_REVIEW'
          }
          Path('evidence').mkdir(exist_ok=True)
          Path('evidence/native_semantic_fields.json').write_text(
              json.dumps(report,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print('NATIVE_SEMANTIC_SUMMARY',json.dumps({
              'requests':report['request_count'],'http200':report['native_http_200_count'],
              'review':report['field_context_review_count'],'hold':report['field_context_hold_count'],
              'formal':0,'golden':0,'published':0}),flush=True)
          PY
      - name: One-shot A/B official DOM-local anchor identity (not Golden)
        shell: bash
        run: |
          set -euo pipefail
          if ! git log -1 --format=%s | grep -Fq '[dom-link-probe-once]'; then
            echo 'DOM_LINK_PROBE_SKIPPED_NO_ONE_SHOT_COMMIT_MARKER'
            exit 0
          fi
          mkdir -p evidence
          python - <<'PY'
          import datetime, hashlib, json, re, socket, ssl, urllib.error, urllib.parse, urllib.request
          from html.parser import HTMLParser
          from pathlib import Path

          # New hypotheses: A ticket URL must belong to a locally labelled
          # purchase anchor; B same-ID detail href must be in the title's row.
          # One public GET per official URL, no redirects/retries/auth/cookies.
          A_URL = 'https://www.tmc.taipei/tw/blog/show/2026SungNien-Yu'
          A_TICKET = 'https://kham.com.tw/application/UTK02/UTK0201_.aspx?PRODUCT_ID=P1DF32E2'
          B_URL = 'https://twtc.com.tw/exhibition?p=home'
          B_TITLE = '2026年電器空調影音大展'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          class Anchors(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.links = []
                  self.anchor = None
                  self.row = None
                  self.rows = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == 'tr':
                      self.row = {'text': [], 'links': []}
                  if tag == 'a':
                      self.anchor = {'href': attrs.get('href',''), 'text': []}
              def handle_data(self, data):
                  if self.anchor is not None: self.anchor['text'].append(data)
                  if self.row is not None: self.row['text'].append(data)
              def handle_endtag(self, tag):
                  if tag == 'a' and self.anchor is not None:
                      a = {'href': self.anchor['href'],
                           'text': ' '.join(' '.join(self.anchor['text']).split())}
                      self.links.append(a)
                      if self.row is not None: self.row['links'].append(a)
                      self.anchor = None
                  if tag == 'tr' and self.row is not None:
                      self.rows.append({'text': ' '.join(' '.join(self.row['text']).split()),
                                        'links': self.row['links']})
                      self.row = None
          def fetch(url):
              rec = {'url':url,'http_status':None,'sha256':None,'bytes':0,
                     'decision':'SOURCE_FRESHNESS_HOLD'}
              try:
                  req = urllib.request.Request(url,method='GET',headers={
                      'User-Agent':'EventRadarSourceAudit/1.0 (public read-only)',
                      'Accept':'text/html,application/xhtml+xml','Accept-Encoding':'identity'})
                  with urllib.request.build_opener(NoRedirect).open(req,timeout=8) as response:
                      rec['http_status'] = response.status
                      body = response.read(524289)
                      rec['bytes'] = len(body)
                      rec['sha256'] = hashlib.sha256(body).hexdigest()
                      if response.status != 200 or len(body) > 524288:
                          rec['decision'] = 'HTTP_OR_SIZE_HOLD'
                          return rec,None
                      charset = (response.headers.get_content_charset() or 'utf-8').lower()
                      if charset not in ('utf-8','big5','cp950'):
                          rec['decision'] = 'CHARSET_HOLD'
                          return rec,None
                      p = Anchors()
                      p.feed(body.decode(charset,errors='strict'))
                      rec['decision'] = 'NATIVE_HTML_PARSED_REVIEW_ONLY'
                      return rec,p
              except urllib.error.HTTPError as e:
                  rec['http_status'] = e.code
                  rec['decision'] = 'REDIRECT_BLOCKED' if 300 <= e.code < 400 else 'HTTP_ERROR_HOLD'
              except urllib.error.URLError as e:
                  rec['error_type'] = type(e.reason).__name__
                  rec['decision'] = 'DNS_OR_EGRESS_HOLD' if isinstance(e.reason,socket.gaierror) else 'NETWORK_HOLD'
              except (UnicodeError,OSError,TimeoutError,ssl.SSLError) as e:
                  rec['error_type'] = type(e).__name__
                  rec['decision'] = 'DECODE_OR_NETWORK_HOLD'
              return rec,None
          def b_same_id(href):
              try:
                  u = urllib.parse.urlsplit(urllib.parse.urljoin(B_URL,href))
                  if (u.scheme != 'https' or u.hostname not in ('twtc.com.tw','www.twtc.com.tw')
                      or u.username or u.password or u.fragment
                      or u.path.lower() != '/exhibition_more.aspx'): return False
                  pairs = urllib.parse.parse_qsl(u.query,keep_blank_values=True,strict_parsing=True)
                  return (sum(k.lower()=='id' for k,v in pairs)==1
                      and any(k.lower()=='id' and v=='29418' for k,v in pairs)
                      and all(k.lower() in ('id','p') for k,v in pairs)
                      and all(v=='home' for k,v in pairs if k.lower()=='p'))
              except (ValueError,TypeError): return False
          # Synthetic negatives enforce no cross-event ID/host, no duplicate ID.
          assert b_same_id('/exhibition_more.aspx?id=29418&p=home')
          for bad in ('/exhibition_more.aspx?id=29419&p=home',
                      '/exhibition_more.aspx?id=29418&id=29419',
                      'https://other.example/exhibition_more.aspx?id=29418',
                      '/exhibition_more.aspx?id=29418&ticket=123'):
              assert not b_same_id(bad)
          a,ap = fetch(A_URL)
          b,bp = fetch(B_URL)
          a_anchor = bool(ap and any(
              urllib.parse.urljoin(A_URL,x['href'])==A_TICKET
              and '購票' in x['text'] for x in ap.links))
          b_row = bool(bp and any(
              B_TITLE in row['text'] and any(b_same_id(x['href']) for x in row['links'])
              for row in bp.rows))
          b_link_any = bool(bp and any(b_same_id(x['href']) for x in bp.links))
          checks = [
              {'line':'A','field':'tmc_same_detail_local_purchase_anchor',
               'source':A_URL,'role':'LOCAL_ANCHOR_TICKET_PRODUCT_NOT_SESSION',
               'matched':a_anchor,'decision':'NATIVE_DOM_LOCAL_REVIEW_ONLY' if a_anchor else 'HOLD'},
              {'line':'B','field':'twtc_same_title_row_exact_detail_id',
               'source':B_URL,'role':'SAME_ROW_TITLE_AND_DETAIL_ID_NOT_TICKET_SESSION',
               'matched':b_row,'same_id_href_elsewhere':b_link_any,
               'decision':'NATIVE_DOM_LOCAL_REVIEW_ONLY' if b_row else 'HOLD'}]
          report = {'kind':'P30_L7_ONE_SHOT_DOM_LOCAL_IDENTITY_DIAGNOSTIC',
              'observed_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
