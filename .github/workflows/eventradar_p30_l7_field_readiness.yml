              except urllib.error.HTTPError as e:
                  r['http_status']=e.code
                  r['decision']='REDIRECT_HOLD' if 300<=e.code<400 else 'HTTP_ERROR_HOLD'
              except urllib.error.URLError as e:
                  r['error_type']=type(e.reason).__name__
