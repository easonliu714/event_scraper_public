                      if res.status!=200 or len(raw)>524288:
                          r['decision']='HTTP_OR_SIZE_HOLD'; return r,None
                      charset=(res.headers.get_content_charset() or 'utf-8').lower()
                      if charset not in ('utf-8','big5','cp950'):
                          r['decision']='CHARSET_HOLD'; return r,None
                      p=PublicDOM(); p.feed(raw.decode(charset,errors='strict'))
                      r['decision']='NATIVE_PARSED_REVIEW_ONLY'
