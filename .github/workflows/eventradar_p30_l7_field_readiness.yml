              except (TimeoutError,socket.timeout,ssl.SSLError,OSError,UnicodeError,LookupError,ValueError) as exc:
                  r['error_type']=type(exc).__name__
                  r['decision']='BODY_OR_NETWORK_HOLD'
              receipts.append(r)
              print('BILINGUAL_NATIVE',role,r['http_status'],r['decision'],flush=True)

          a=texts.get('A_TMC_VENUE','')
