          }
          field_roles=(
              ('A','venue_showtime',('A_SHOW',)),
              ('A','venue_hall',('A_HALL',)),
              ('B','exhibition_dates',('B_ZH_DATES','B_EN_DATES','B_EXECUTOR_DATES')),
