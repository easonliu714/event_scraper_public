name: EventRadar L8 formal card price and modal exact-head NO PUBLISH
on:
  pull_request:
    paths:
      - 'docs/index.html'
      - 'tests/p30/test_formal_card_role_summary.js'
      - '.github/workflows/eventradar_p30_l8_formal_card.yml'
permissions:
  contents: read
  actions: read
jobs:
  formal-card-review:
    if: github.repository == 'easonliu714/event_scraper_public' && github.head_ref == 'feat/eventradar-l8-formal-card-role-summary'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exact head and production boundaries
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          base=de295950e6aad601f2df148d161e016e08535845
          git merge-base --is-ancestor "$base" HEAD
          test "$(git rev-parse HEAD:docs/data.json)" = 7fc4fe32567a57fd504483eeb9a8b9e10b568ea4
          test "$(git rev-parse HEAD:docs/platform_status.json)" = cdeeb3b551e38f862c37759426a14b5129e1224d
          test "$(git rev-parse HEAD:scraper.py)" = 98eddeafb497718c51aa81c6a150e9a5e1e687a8
          actual="$(git diff --name-only "$base" HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' '.github/workflows/eventradar_p30_l8_formal_card.yml' 'docs/index.html' 'tests/p30/test_formal_card_role_summary.js' | LC_ALL=C sort)"
          test "$actual" = "$expected"
          echo PASS_EXACT_HEAD_FROZEN_DATA_STATUS_AND_THREE_FILES
      - name: Existing source guard and candidate regression
        run: |
          python -m unittest discover -s tests/p30 -p test_candidate_review_pipeline.py -v
          node tests/p30/test_candidate_review_ui_provenance.js
          node tests/p30/test_candidate_source_summary.js
      - name: Formal summary and Golden-only modal role negative tests
        run: |
          node tests/p30/test_formal_card_role_summary.js
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('docs/index.html').read_text()
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          assert len(scripts)==1
          Path('/tmp/eventradar_formal.js').write_text(scripts[0])
          PY
          node --check /tmp/eventradar_formal.js
          echo PASS_INLINE_JS_SYNTAX
      - name: Audit manifest and no-publication receipt
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p gate-evidence
          printf 'head=%s\ngate=P30-L8-FORMAL-CARD-INTEGRATION\nrelease=HARD_HOLD_NO_PUBLICATION\nformal_data_modified=0\npublished_events_new=0\n' "$HEAD_SHA" > gate-evidence/receipt.txt
          sha256sum docs/index.html tests/p30/test_formal_card_role_summary.js > gate-evidence/SOURCE_SHA256SUMS.txt
          (cd gate-evidence && sha256sum receipt.txt SOURCE_SHA256SUMS.txt > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: eventradar-l8-formal-card-review
          path: gate-evidence/
          if-no-files-found: error
          retention-days: 30
