name: EventRadar P30-L9BU FamiTicket iframe boundary (NO PUBLISH)
on:
  pull_request:
    branches: [feat/eventradar-p30-l9bt-huashan-intrapage-room-conflict]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  iframe-identity:
    if: github.repository == 'easonliu714/event_scraper_public' && github.head_ref == 'feat/eventradar-p30-l9bu-famiticket-iframe-boundary'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: \${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact head and three ADD-only paths; formal data/status frozen
        shell: bash
        run: |
          set -euo pipefail
          base=ac4d174865c9ae16d874f8bca94aabb5d2be49b8
          test "$(git rev-parse HEAD)" = "\${{ github.event.pull_request.head.sha }}"
          test "$(git merge-base "$base" HEAD)" = "$base"
          expected="$(printf 'A\t%s\n' 'scripts/p30_l9bu_famiticket_iframe_boundary.py' 'tests/p30/test_l9bu_famiticket_iframe_boundary.py' '.github/workflows/eventradar_p30_l9bu.yml' | LC_ALL=C sort)"
          test "$expected" = "$(git diff --name-status "$base" HEAD | LC_ALL=C sort)"
          test "$(git rev-parse origin/main:docs/data.json)" = 7fc4fe32567a57fd504483eeb9a8b9e10b568ea4
          test "$(git rev-parse origin/main:docs/platform_status.json)" = e19ca37c4c80c10b7278d0813b8ff1047535d124
      - name: BT predecessor and BU source-iframe boundary tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'beautifulsoup4==4.14.2' 'requests==2.32.5'
          python -m py_compile scripts/p30_l9bu_famiticket_iframe_boundary.py tests/p30/test_l9bu_famiticket_iframe_boundary.py
          python -m unittest discover -s tests/p30 -p 'test_l9bt_huashan_intrapage_room_conflict.py' -v
          python -m unittest discover -s tests/p30 -p 'test_l9bu_famiticket_iframe_boundary.py' -v
      - name: Sanitized source-bound audit and SHA manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p eventradar_l9bu-evidence
          python - <<'PY'
          import hashlib,json,pathlib,subprocess
          p=pathlib.Path('eventradar_l9bu-evidence')
          a={'gate':'P30-L9-BU','headSHA':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'canonicalPlatform':'FamiTicket#07','officialGETinCI':0,'independentSourceEvidence':'INDEX_ANCHOR_TO_OPAQUE_DETAIL_IFRAME_ONLY','sameIdDetailTitleVerified':False,'acceptedFields':0,'goldenAccepted':0,'published':False,'decision':'HOLD_MIXED_LIST_CATEGORY_AND_IFRAME_IDENTITY','releaseState':'HARD_HOLD_NO_PUBLICATION'}
          (p/'audit.json').write_text(json.dumps(a,sort_keys=True)+'\n')
          (p/'manifest.json').write_text(json.dumps({'filesSHA256':{'audit.json':hashlib.sha256((p/'audit.json').read_bytes()).hexdigest()}},sort_keys=True)+'\n')
          PY
          (cd eventradar_l9bu-evidence && sha256sum *.json > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eventradar_l9bu-evidence
          path: eventradar_l9bu-evidence/
          if-no-files-found: ignore
