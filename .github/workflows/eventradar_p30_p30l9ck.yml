name: EventRadar P30-L9-CK exact-head NO PUBLISH
on:
  pull_request:
    branches: [feat/eventradar-p30-l9cj-opentix-sale-admission-refund]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  exact-head:
    if: github.repository == 'easonliu714/event_scraper_public' && github.head_ref == 'feat/eventradar-p30-l9ck-tixfun-postponement'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact-head ADD-only and frozen formal data
        shell: bash
        run: |
          set -euo pipefail
          base=13f9c0f6d7defed440bbe6a803fbdf2854a2472d
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git merge-base "$base" HEAD)" = "$base"
          expected="$(printf 'A\t%s\n' 'scripts/p30_l9ck_tixfun_postponement.py' 'tests/p30/test_l9ck_tixfun_postponement.py' '.github/workflows/eventradar_p30_p30l9ck.yml' | LC_ALL=C sort)"
          test "$expected" = "$(git diff --name-status "$base" HEAD | LC_ALL=C sort)"
          test "$(git rev-parse origin/main:docs/data.json)" = 7fc4fe32567a57fd504483eeb9a8b9e10b568ea4
          test "$(git rev-parse origin/main:docs/platform_status.json)" = e19ca37c4c80c10b7278d0813b8ff1047535d124
      - name: Predecessor and new regression
        run: |
          python -m py_compile scripts/p30_l9ck_tixfun_postponement.py tests/p30/test_l9ck_tixfun_postponement.py
          python -m unittest discover -s tests/p30 -p 'test_l9cj_opentix_role_boundaries.py' -v
          python -m unittest discover -s tests/p30 -p 'test_l9ck_tixfun_postponement.py' -v
      - name: SHA256 manifest exact HEAD
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python - <<'PY'
          import hashlib,json,pathlib,subprocess
          p=pathlib.Path("evidence")
          a={"gate":"P30-L9-CK","headSHA":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),"officialGETinCI":0,"sourceObservationDate":"2026-11-01","sourceEvidence":"TixFun #09 list to exact product Q023RA4H detail; Chiayi 2026-09-05 14:30 show moved to 2027-03-06 14:30; original-date refund exception must not be treated as current general refund deadline. Header range and NT$800-3200 are product-level, not ticket sessions.","acceptedFields":0,"ticketSessionIdsVerified":0,"goldenAccepted":0,"published":False,"releaseState":"HARD_HOLD_NO_PUBLICATION"}
          (p/"audit.json").write_text(json.dumps(a,sort_keys=True)+"\n")
          (p/"manifest.json").write_text(json.dumps({"filesSHA256":{"audit.json":hashlib.sha256((p/"audit.json").read_bytes()).hexdigest()}},sort_keys=True)+"\n")
          PY
          (cd evidence && sha256sum *.json > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eventradar-p30-l9-ck-source-evidence
          path: evidence/
          if-no-files-found: error
