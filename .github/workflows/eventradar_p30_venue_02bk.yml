name: EventRadar P30-VENUE-02BK exact-head NO PUBLISH
on:
  pull_request:
    branches: [feat/eventradar-p30-venue02bj-ntpc-multivenue-weekday]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  exact-head:
    if: github.repository == 'easonliu714/event_scraper_public' && github.head_ref == 'feat/eventradar-p30-venue02bk-shulin-workshop-accupass'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact HEAD, ADD-only scope, frozen formal data
        shell: bash
        run: |
          set -euo pipefail
          base=fe6fa8c6ca1fbc4382dc160fecef9a4ada701975
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git merge-base "$base" HEAD)" = "$base"
          expected="$(printf 'A\t%s\n' 'scripts/p30_venue02bk_shulin_workshop_accupass.py' 'tests/p30/test_venue02bk_shulin_workshop_accupass.py' '.github/workflows/eventradar_p30_venue_02bk.yml' | LC_ALL=C sort)"
          test "$expected" = "$(git diff --name-status "$base" HEAD | LC_ALL=C sort)"
          test "$(git rev-parse origin/main:docs/data.json)" = 7fc4fe32567a57fd504483eeb9a8b9e10b568ea4
          python - <<'PY'
          import json, subprocess
          d=json.loads(subprocess.check_output(['git','show','origin/main:docs/platform_status.json']))
          assert len(d['platforms'])==19
          assert d['production']['eventFeedReleaseState']=='HARD_HOLD_NO_PUBLICATION'
          assert d['production']['goldenAccepted']==0
          PY
      - name: Predecessor and new source-bound negative tests
        run: |
          python -m py_compile scripts/p30_venue02bk_shulin_workshop_accupass.py tests/p30/test_venue02bk_shulin_workshop_accupass.py
          python -m unittest discover -s tests/p30 -p 'test_venue02bj_ntpc_multivenue_weekday.py' -v
          python -m unittest discover -s tests/p30 -p 'test_venue02bk_shulin_workshop_accupass.py' -v
      - name: Exact-head SHA evidence manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python - <<'PY'
          import hashlib, json, pathlib, subprocess
          p=pathlib.Path('evidence')
          a={'gate':'P30-VENUE-02BK',
             'headSHA':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
             'officialGETinCI':0,'sourceObservationDate':'2026-11-01',
             'sourceEvidence':'New Taipei Shulin Art Center first-party LIST→bulletin sid 0Q273522679833703495 → direct ACCUPASS #02 event 2609151410103172453460; two Nov21/Nov22 10:30 workshops and NT$100 per parent-child pair; not ticket Session IDs.',
             'acceptedFields':0,'ticketSessionIdsVerified':0,'goldenAccepted':0,
             'published':False,'releaseState':'HARD_HOLD_NO_PUBLICATION'}
          (p/'audit.json').write_text(json.dumps(a,sort_keys=True,ensure_ascii=False)+'\n',encoding='utf-8')
          (p/'manifest.json').write_text(json.dumps({'filesSHA256':{'audit.json':hashlib.sha256((p/'audit.json').read_bytes()).hexdigest()}},sort_keys=True)+'\n')
          PY
          (cd evidence && sha256sum *.json > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eventradar_p30_venue_02bk-source-evidence
          path: evidence/
          if-no-files-found: error
