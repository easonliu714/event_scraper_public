name: EventRadar P30-VENUE-02AU strict official field roles (NO PUBLISH)
on:
  pull_request:
    branches: [feat/eventradar-p30-venue02at-shulin-opentix-identity]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  exact-head:
    if: github.repository == 'easonliu714/event_scraper_public' && github.head_ref == 'feat/eventradar-p30-venue02au-opentix-marathon-segments'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact-head ADD-only and production freeze
        shell: bash
        run: |
          set -euo pipefail
          base=a889b1e66dcb666d7ab937a9035801e32ee68119
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git merge-base "$base" HEAD)" = "$base"
          expected="$(printf 'A\t%s\n' 'scripts/p30_venue02au_opentix_marathon_segments.py' 'tests/p30/test_venue02au_opentix_marathon_segments.py' '.github/workflows/eventradar_p30_venue02au.yml' | LC_ALL=C sort)"
          test "$expected" = "$(git diff --name-status "$base" HEAD | LC_ALL=C sort)"
          test "$(git rev-parse origin/main:docs/data.json)" = 7fc4fe32567a57fd504483eeb9a8b9e10b568ea4
          test "$(git rev-parse origin/main:docs/platform_status.json)" = e19ca37c4c80c10b7278d0813b8ff1047535d124
      - name: Predecessor and new strict regressions
        run: |
          python -m py_compile scripts/p30_venue02au_opentix_marathon_segments.py tests/p30/test_venue02au_opentix_marathon_segments.py
          python -m unittest discover -s tests/p30 -p 'test_venue02at_shulin_opentix_identity.py' -v
          python -m unittest discover -s tests/p30 -p 'test_venue02au_opentix_marathon_segments.py' -v
      - name: Sanitized exact-head audit and SHA manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python - <<'PY'
          import json,pathlib,subprocess,hashlib
          p=pathlib.Path("evidence")
          a={"gate":"P30-VENUE-02AU","headSHA":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),"officialGETinCI":0,"sourceObservationDate":"2026-11-01","sourceEvidence":"OPENTIX BODY two descriptive shows, eight program blocks, event price tiers not ticket sessions","ticketSessionIdsVerified":0,"acceptedFields":0,"goldenAccepted":0,"published":False,"releaseState":"HARD_HOLD_NO_PUBLICATION"}
          (p/"audit.json").write_text(json.dumps(a,sort_keys=True)+"\n")
          (p/"manifest.json").write_text(json.dumps({"filesSHA256":{"audit.json":hashlib.sha256((p/"audit.json").read_bytes()).hexdigest()}},sort_keys=True)+"\n")
          PY
          (cd evidence && sha256sum *.json > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eventradar-venue02au_opentix_marathon-evidence
          path: evidence/
          if-no-files-found: ignore
