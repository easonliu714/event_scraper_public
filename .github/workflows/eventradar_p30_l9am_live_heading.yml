name: EventRadar P30 L9-AM bounded live heading review (NO PUBLISH)
on:
  pull_request:
    branches: [feat/eventradar-p30-l9ak-heading-near-20261029]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: eventradar-p30-l9am-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  accupass-live-heading:
    if: github.repository == 'easonliu714/event_scraper_public' && github.head_ref == 'feat/eventradar-p30-l9am-live-heading-20261029-2256'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact-head scope and formal frozen blobs
        shell: bash
        run: |
          set -euo pipefail
          base=f609d1557f39f0eb9d3d93192c07052bba935b8f
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git merge-base "$base" HEAD)" = "$base"
          expected="$(printf 'A\t%s\n' '.github/workflows/eventradar_p30_l9am_live_heading.yml' 'scripts/p30_l9am_accupass_live_heading.py' 'tests/p30/test_l9am_accupass_live_heading.py' | LC_ALL=C sort)"
          actual="$(git diff --name-status "$base" HEAD | LC_ALL=C sort)"
          test "$expected" = "$actual"
          test "$(git rev-parse origin/main:docs/data.json)" = 7fc4fe32567a57fd504483eeb9a8b9e10b568ea4
          test "$(git rev-parse origin/main:docs/platform_status.json)" = e19ca37c4c80c10b7278d0813b8ff1047535d124
          git show origin/main:docs/platform_status.json > /tmp/l9am-status.json
      - name: Install normal public Chromium and bounded parser
        run: |
          python -m pip install --disable-pip-version-check 'beautifulsoup4==4.14.2' 'playwright==1.55.0'
          python -m playwright install chromium
      - name: Frozen heading negatives and new identity-scope tests
        run: |
          python -m py_compile scripts/p30_l9am_accupass_live_heading.py tests/p30/test_l9am_accupass_live_heading.py
          python -m unittest discover -s tests/p30 -p test_l9ak_accupass_heading_near.py -v
          python -m unittest discover -s tests/p30 -p test_l9am_accupass_live_heading.py -v
      - name: One public list and maximum two source-matched details
        run: |
          python scripts/p30_l9am_accupass_live_heading.py --live --status /tmp/l9am-status.json --out p30-l9am-evidence
      - name: Independent SHA and no-publication
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('p30-l9am-evidence')
          r=json.loads((p/'heading_review.json').read_text())
          m=json.loads((p/'manifest.json').read_text())
          assert m['filesSHA256']['heading_review.json']==hashlib.sha256((p/'heading_review.json').read_bytes()).hexdigest()
          assert r['detailCount']<=2 and r['acceptedFields']==0 and r['goldenAccepted']==0
          assert r['published'] is False and not r['rawHtmlPersisted'] and not r['rawEventIdsPersisted']
          print('PASS_L9AM_SHA_NO_PUBLICATION')
          PY
          (cd p30-l9am-evidence && sha256sum *.json > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eventradar-p30-l9am-live-heading-review
          path: p30-l9am-evidence/
          if-no-files-found: ignore
