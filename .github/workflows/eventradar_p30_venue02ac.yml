name: EventRadar P30-VENUE02AC Ceramics SID/title parity (NO PUBLISH)
on:
  pull_request:
    branches: [feat/eventradar-p30-venue02ab-ceramics-role-ownership]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: eventradar-venue02ac-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  source-sid-parity:
    if: github.repository == 'easonliu714/event_scraper_public' && github.head_ref == 'feat/eventradar-p30-venue02ac-ceramics-sid-title'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact-head and frozen formal-data guard
        shell: bash
        run: |
          set -euo pipefail
          base=c6e27a4ba16c2cbc72abee20cab79d4bb62caf8e
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git merge-base "$base" HEAD)" = "$base"
          expected="$(printf 'A\t%s\n' 'scripts/p30_venue02ac_ceramics_sid_title.py' 'tests/p30/test_venue02ac_ceramics_sid_title.py' '.github/workflows/eventradar_p30_venue02ac.yml' | LC_ALL=C sort)"
          test "$expected" = "$(git diff --name-status "$base" HEAD | LC_ALL=C sort)"
          test "$(git rev-parse origin/main:docs/data.json)" = 7fc4fe32567a57fd504483eeb9a8b9e10b568ea4
          test "$(git rev-parse origin/main:docs/platform_status.json)" = e19ca37c4c80c10b7278d0813b8ff1047535d124
      - name: Ceramics two official SIDs and predecessor (zero GET)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'beautifulsoup4==4.14.2' 'requests==2.32.5'
          python -m py_compile scripts/p30_venue02ac_ceramics_sid_title.py tests/p30/test_venue02ac_ceramics_sid_title.py
          python -m unittest discover -s tests/p30 -p 'test_venue02ab_ceramics_role_ownership.py' -v
          python -m unittest discover -s tests/p30 -p 'test_venue02ac_ceramics_sid_title.py' -v
      - name: SHA256 evidence manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p eventradar_venue02ac-evidence
          python - <<'PY'
          import hashlib,json,pathlib,subprocess
          p=pathlib.Path('eventradar_venue02ac-evidence')
          d={'gate':'P30-VENUE-02AC','mode':'TWO_OFFICIAL_SID_TITLE_SAMPLES_OFFLINE_CI','officialGET':0,
             'sourceQualityNewFromCI':False,'acceptedFields':0,'goldenAccepted':0,
             'published':False,'releaseState':'HARD_HOLD_NO_PUBLICATION',
             'headSHA':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()}
          a=p/'audit.json';a.write_text(json.dumps(d,sort_keys=True)+'\n')
          (p/'manifest.json').write_text(json.dumps({'filesSHA256':{'audit.json':hashlib.sha256(a.read_bytes()).hexdigest()}},sort_keys=True)+'\n')
          PY
          (cd eventradar_venue02ac-evidence && sha256sum *.json > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eventradar_venue02ac-evidence
          path: eventradar_venue02ac-evidence/
          if-no-files-found: ignore
