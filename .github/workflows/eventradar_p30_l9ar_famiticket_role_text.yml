name: EventRadar P30 L9-AR FamiTicket role text refusal (NO PUBLISH)
on:
  pull_request:
    branches: [feat/eventradar-p30-l9aq-famiticket-iframe-20261030-0255]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: eventradar-p30-l9ar-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  famiticket-role-text:
    if: github.repository == 'easonliu714/event_scraper_public' && github.head_ref == 'feat/eventradar-p30-l9ar-famiticket-role-text'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact head and add-only scope
        shell: bash
        run: |
          set -euo pipefail
          base=be0a94b076991e75e9ae1ff4f5b2cf0d8a9c70c3
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git merge-base "$base" HEAD)" = "$base"
          expected="$(printf 'A\t%s\n' '.github/workflows/eventradar_p30_l9ar_famiticket_role_text.yml' 'scripts/p30_l9ar_famiticket_role_text.py' 'tests/p30/test_l9ar_famiticket_role_text.py' | LC_ALL=C sort)"
          test "$expected" = "$(git diff --name-status "$base" HEAD | LC_ALL=C sort)"
          test "$(git rev-parse origin/main:docs/data.json)" = 7fc4fe32567a57fd504483eeb9a8b9e10b568ea4
          test "$(git rev-parse origin/main:docs/platform_status.json)" = e19ca37c4c80c10b7278d0813b8ff1047535d124
      - name: Frozen and role-local offline tests
        run: |
          python -m pip install --disable-pip-version-check 'requests==2.32.5' 'beautifulsoup4==4.14.2'
          python -m py_compile scripts/p30_l9ar_famiticket_role_text.py tests/p30/test_l9ar_famiticket_role_text.py
          python -m unittest discover -s tests/p30 -p test_l9aq_famiticket_iframe_boundary.py -v
          python -m unittest discover -s tests/p30 -p test_l9ar_famiticket_role_text.py -v
      - name: SHA evidence with offline provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p p30-l9ar-evidence
          python - <<'PY'
          import hashlib,json,pathlib
          d=pathlib.Path('p30-l9ar-evidence')
          obj=dict(kind='EVENTRADAR_P30_L9AR_FAMITICKET_ROLE_REVIEW',
                   sourceQualityThisCI='UNVERIFIED_NO_LIVE_GET',
                   evidenceOrigin='OFFLINE_TEXT_ROLE_CONTRACT',
                   acceptedFields=0,goldenAccepted=0,published=False,
                   releaseState='HARD_HOLD_NO_PUBLICATION')
          raw=(json.dumps(obj,sort_keys=True,indent=2)+'\n').encode()
          (d/'audit.json').write_bytes(raw)
          (d/'manifest.json').write_text(json.dumps({'filesSHA256':{'audit.json':hashlib.sha256(raw).hexdigest()}},sort_keys=True)+'\n')
          PY
          (cd p30-l9ar-evidence && sha256sum *.json > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eventradar-p30-l9ar-role-review
          path: p30-l9ar-evidence/
          if-no-files-found: ignore
