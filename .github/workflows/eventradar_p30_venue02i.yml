name: EventRadar P30 VENUE-02I exact-head source-first review (NO PUBLISH)
on:
  pull_request:
    branches: [feat/eventradar-p30-venue02h-tainex-live-identity]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: eventradar-venue02i-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  source-quality:
    if: github.repository == 'easonliu714/event_scraper_public' && github.head_ref == 'feat/eventradar-p30-venue02i-tainex-provenance-20261030-0755'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact head and immutable formal data guard
        shell: bash
        run: |
          set -euo pipefail
          base=b1f4ea1b0ada362aa0db1772434212c9b69ecca9
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git merge-base "$base" HEAD)" = "$base"
          expected="$(printf 'A\t%s\n' '.github/workflows/eventradar_p30_venue02i.yml' 'scripts/p30_venue02i_tainex_provenance.py' 'tests/p30/test_venue02i_tainex_provenance.py' | LC_ALL=C sort)"
          test "$expected" = "$(git diff --name-status "$base" HEAD | LC_ALL=C sort)"
          test "$(git rev-parse origin/main:docs/data.json)" = 7fc4fe32567a57fd504483eeb9a8b9e10b568ea4
          test "$(git rev-parse origin/main:docs/platform_status.json)" = e19ca37c4c80c10b7278d0813b8ff1047535d124
      - name: Frozen predecessor and new negative regression
        run: |
          python -m pip install --disable-pip-version-check 'requests==2.32.5' 'beautifulsoup4==4.14.2'
          python -m py_compile scripts/p30_venue02i_tainex_provenance.py tests/p30/test_venue02i_tainex_provenance.py
          python -m unittest discover -s tests/p30 -p test_venue02h_tainex_live_identity.py -v
          python -m unittest discover -s tests/p30 -p test_venue02i_tainex_provenance.py -v
      - name: One normal bounded official GET; no raw HTML retention
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p p30-venue02i-evidence
          python scripts/p30_venue02i_tainex_provenance.py --live-one --out p30-venue02i-evidence/audit.json
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('p30-venue02i-evidence')
          p=root/'audit.json'
          a=json.loads(p.read_text())
          assert a['requestCount']==1 and a['acceptedFields']==0 and a['goldenAccepted']==0
          assert a['published'] is False and a['releaseState']=='HARD_HOLD_NO_PUBLICATION'
          assert 'rawHtml' not in a and 'cookies' not in a
          (root/'manifest.json').write_text(json.dumps({'filesSHA256':{'audit.json':hashlib.sha256(p.read_bytes()).hexdigest()}},sort_keys=True)+'\n')
          PY
          (cd p30-venue02i-evidence && sha256sum *.json > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eventradar-venue-02i-source-review
          path: p30-venue02i-evidence/
          if-no-files-found: ignore
