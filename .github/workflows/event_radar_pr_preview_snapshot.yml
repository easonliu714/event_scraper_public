name: Event Radar PR1 - PWA Preview Snapshot (NO Publish)
on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: eventradar-pr1-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  snapshot-readonly:
    if: >-
      github.event.pull_request.number == 1 &&
      github.event.pull_request.head.repo.full_name == 'easonliu714/event_scraper_public' &&
      github.event.pull_request.head.ref == 'fix/event-radar-v44-cloud-20261023'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Taipei
      EVENT_RADAR_ACTIONS: '1'
      EVENT_RADAR_TELEGRAM: '0'
      EVENT_RADAR_TERMUX: '0'
      DETAIL_NEW_LIMIT: '12'
      DETAIL_REPAIR_LIMIT: '8'
    steps:
      - name: Checkout PR merge candidate with no Git credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install read-only scraper dependencies
        run: python -m pip install -r requirements-actions.txt
      - name: Scrape in temp and export review-only JSON snapshot
        run: python scripts/pr1_preview_snapshot.py --generate
      - name: Upload snapshot for manual separate-site publication
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: eventradar-pr1-pwa-preview-snapshot
          path: ${{ runner.temp }}/eventradar_pr1_preview_snapshot/export/
          retention-days: 7
          if-no-files-found: error
