name: EventRadar P30-L9BQ bounded static route cause (NO PUBLISH)
on:
  pull_request:
    branches: [feat/eventradar-p30-l9bp-huashan-live-card-dom]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: eventradar-l9bq-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  static-route-cause:
    if: github.repository == 'easonliu714/event_scraper_public' && github.head_ref == 'feat/eventradar-p30-l9bq-huashan-static-route-topology'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact-head and frozen production guard
        shell: bash
        run: |
          set -euo pipefail
          base=3b69b8789fffcf86bdcf843d5e683ed21d87c22e
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git merge-base "$base" HEAD)" = "$base"
          expected="$(printf 'A\t%s\n' 'scripts/p30_l9bq_huashan_static_route_topology.py' 'tests/p30/test_l9bq_huashan_static_route_topology.py' '.github/workflows/eventradar_p30_l9bq.yml' | LC_ALL=C sort)"
          test "$expected" = "$(git diff --name-status "$base" HEAD | LC_ALL=C sort)"
          test "$(git rev-parse origin/main:docs/data.json)" = 7fc4fe32567a57fd504483eeb9a8b9e10b568ea4
          test "$(git rev-parse origin/main:docs/platform_status.json)" = e19ca37c4c80c10b7278d0813b8ff1047535d124
      - name: BP predecessor and BQ strict regression
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'beautifulsoup4==4.14.2' 'requests==2.32.5'
          python -m py_compile scripts/p30_l9bq_huashan_static_route_topology.py tests/p30/test_l9bq_huashan_static_route_topology.py
          python -m unittest discover -s tests/p30 -p 'test_l9bp_huashan_live_card_probe.py' -v
          python -m unittest discover -s tests/p30 -p 'test_l9bq_huashan_static_route_topology.py' -v
      - name: ONE official index GET for new static route-cause diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p eventradar_l9bq-evidence
          python scripts/p30_l9bq_huashan_static_route_topology.py --live-one --out eventradar_l9bq-evidence/source_audit.json
      - name: SHA256 manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib,subprocess
          p=pathlib.Path('eventradar_l9bq-evidence')
          a={'gate':'P30-L9-BQ','headSHA':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'acceptedFields':0,'goldenAccepted':0,'published':False,'releaseState':'HARD_HOLD_NO_PUBLICATION'}
          (p/'audit.json').write_text(json.dumps(a,sort_keys=True)+'\n')
          (p/'manifest.json').write_text(json.dumps({'filesSHA256':{x.name:hashlib.sha256(x.read_bytes()).hexdigest() for x in p.glob('*.json') if x.name!='manifest.json'}},sort_keys=True)+'\n')
          PY
          (cd eventradar_l9bq-evidence && sha256sum *.json > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eventradar_l9bq-evidence
          path: eventradar_l9bq-evidence/
          if-no-files-found: ignore
