name: EventRadar P30-L9BO distinct Huashan source edges (NO PUBLISH)
on:
  pull_request:
    branches: [feat/eventradar-p30-l9bn-huashan-card-identity]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: eventradar-l9bo-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  distinct-source-edges:
    if: github.repository == 'easonliu714/event_scraper_public' && github.head_ref == 'feat/eventradar-p30-l9bo-huashan-distinct-edges'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact-head and frozen formal-data guard
        shell: bash
        run: |
          set -euo pipefail
          base=1c8c2426f3310921dfff273daa4cd5f6daac6156
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git merge-base "$base" HEAD)" = "$base"
          expected="$(printf 'A\t%s\n' 'scripts/p30_l9bo_huashan_distinct_edges.py' 'tests/p30/test_l9bo_huashan_distinct_edges.py' '.github/workflows/eventradar_p30_l9bo.yml' | LC_ALL=C sort)"
          test "$expected" = "$(git diff --name-status "$base" HEAD | LC_ALL=C sort)"
          test "$(git rev-parse origin/main:docs/data.json)" = 7fc4fe32567a57fd504483eeb9a8b9e10b568ea4
          test "$(git rev-parse origin/main:docs/platform_status.json)" = e19ca37c4c80c10b7278d0813b8ff1047535d124
      - name: Distinct source edges and predecessor (zero GET)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'beautifulsoup4==4.14.2' 'requests==2.32.5'
          python -m py_compile scripts/p30_l9bo_huashan_distinct_edges.py tests/p30/test_l9bo_huashan_distinct_edges.py
          python -m unittest discover -s tests/p30 -p 'test_l9bn_huashan_card_identity.py' -v
          python -m unittest discover -s tests/p30 -p 'test_l9bo_huashan_distinct_edges.py' -v
      - name: SHA256 evidence manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p eventradar_l9bo-evidence
          python - <<'PY'
          import hashlib,json,pathlib,subprocess
          p=pathlib.Path('eventradar_l9bo-evidence')
          d={'gate':'P30-L9-BO','mode':'TWO_OFFICIAL_SOURCE_OBSERVED_LINKS_OFFLINE_CI','officialGET':0,
             'sourceQualityNewFromCI':False,'acceptedFields':0,'goldenAccepted':0,
             'published':False,'releaseState':'HARD_HOLD_NO_PUBLICATION',
             'headSHA':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()}
          a=p/'audit.json';a.write_text(json.dumps(d,sort_keys=True)+'\n')
          (p/'manifest.json').write_text(json.dumps({'filesSHA256':{'audit.json':hashlib.sha256(a.read_bytes()).hexdigest()}},sort_keys=True)+'\n')
          PY
          (cd eventradar_l9bo-evidence && sha256sum *.json > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eventradar_l9bo-evidence
          path: eventradar_l9bo-evidence/
          if-no-files-found: ignore
