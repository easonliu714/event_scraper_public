name: EventRadar P30-VENUE-02AN ERA opaque parity (NO PUBLISH)
on:
  pull_request:
    branches: [feat/eventradar-p30-venue02am-xinzhuang-row-opentix]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  source-parity:
    if: github.repository == 'easonliu714/event_scraper_public' && github.head_ref == 'feat/eventradar-p30-venue02an-xinzhuang-era-opaque'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact-head ADD-only and production freeze
        shell: bash
        run: |
          set -euo pipefail
          base=5bb8f31c9b637b15650df1cce39f563dbfc354da
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git merge-base "$base" HEAD)" = "$base"
          expected="$(printf 'A\t%s\n' 'scripts/p30_venue02an_xinzhuang_era_opaque.py' 'tests/p30/test_venue02an_xinzhuang_era_opaque.py' '.github/workflows/eventradar_p30_venue02an.yml' | LC_ALL=C sort)"
          test "$expected" = "$(git diff --name-status "$base" HEAD | LC_ALL=C sort)"
          test "$(git rev-parse origin/main:docs/data.json)" = 7fc4fe32567a57fd504483eeb9a8b9e10b568ea4
          test "$(git rev-parse origin/main:docs/platform_status.json)" = e19ca37c4c80c10b7278d0813b8ff1047535d124
      - name: Predecessor and new source-role tests
        run: |
          python -m py_compile scripts/p30_venue02an_xinzhuang_era_opaque.py tests/p30/test_venue02an_xinzhuang_era_opaque.py
          python -m unittest discover -s tests/p30 -p test_venue02am_xinzhuang_row_opentix.py -v
          python -m unittest discover -s tests/p30 -p test_venue02an_xinzhuang_era_opaque.py -v
      - name: Exact-head sanitized evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p eventradar_venue02an-evidence
          python - <<'PY'
          import hashlib,json,pathlib,subprocess
          p=pathlib.Path('eventradar_venue02an-evidence')
          a={'gate':'P30-VENUE-02AN','headSHA':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'source':'XINZHUANG_VENUE_P0+ERA#08','officialGETinCI':0,'sourceObservationDate':'2026-10-31','independentOfficialReader':True,'acceptedFields':0,'goldenAccepted':0,'published':False,'decision':'HOLD_ERA_TICKET_TITLE_DATE_SESSION_NOT_RENDERED','releaseState':'HARD_HOLD_NO_PUBLICATION'}
          (p/'audit.json').write_text(json.dumps(a,sort_keys=True)+'\n')
          (p/'manifest.json').write_text(json.dumps({'filesSHA256':{'audit.json':hashlib.sha256((p/'audit.json').read_bytes()).hexdigest()}},sort_keys=True)+'\n')
          PY
          (cd eventradar_venue02an-evidence && sha256sum *.json > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eventradar_venue02an-evidence
          path: eventradar_venue02an-evidence/
          if-no-files-found: ignore
