name: EventRadar P30 L9-P ibon local control-type topology (NO INTERACTION)
on:
  push:
    branches:
      - feat/eventradar-p30-l9p-ibon-control-types
permissions:
  contents: read
  actions: read
concurrency:
  group: eventradar-p30-l9p-ibon-control-types
  cancel-in-progress: true
jobs:
  source-control-type-diagnostics:
    if: github.repository == 'easonliu714/event_scraper_public'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Frozen L9-O exact source parent and three added paths only
        run: |
          set -euo pipefail
          base=96748095bbe8084d302bf74b3a7c0aa119039ca2
          git merge-base --is-ancestor "$base" HEAD
          test "$(git rev-parse HEAD:docs/data.json)" = 7fc4fe32567a57fd504483eeb9a8b9e10b568ea4
          test "$(git rev-parse HEAD:scraper.py)" = 98eddeafb497718c51aa81c6a150e9a5e1e687a8
          test "$(git rev-parse HEAD:docs/manifest.json)" = 6fca76fd65958c6ab2381bf949e061aa7f8fb551
          expected="$(printf 'A\t%s\n' '.github/workflows/eventradar_p30_l9p_ibon_control_types.yml' 'scripts/p30_l9p_ibon_control_types.mjs' 'tests/p30/test_l9p_ibon_control_types.mjs' | LC_ALL=C sort)"
          actual="$(git diff --name-status "$base" HEAD | LC_ALL=C sort)"
          test "$expected" = "$actual" || { echo HOLD_L9P_UNEXPECTED_DIFF; exit 1; }
          echo PASS_L9P_EXACT_THREE_PATHS_FROZEN_PRODUCTION
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install standard Chromium without stealth
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.55.0
          ./node_modules/.bin/playwright install chromium
      - name: Syntax and 36 independent fail-closed contracts
        run: |
          set -euo pipefail
          node --check scripts/p30_l9p_ibon_control_types.mjs
          node --test tests/p30/test_l9p_ibon_control_types.mjs
          echo PASS_L9P_36_OFFLINE_GUARDS
      - uses: actions/download-artifact@v4
        with:
          name: eventradar-p30-l9o-ibon-label-topology-readonly
          run-id: 40702378377
          repository: easonliu714/event_scraper_public
          github-token: ${{ github.token }}
          path: pinned-l9o
      - uses: actions/download-artifact@v4
        with:
          name: eventradar-p30-l9f-ibon-detail-roles-review-only
          run-id: 40494326021
          repository: easonliu714/event_scraper_public
          github-token: ${{ github.token }}
          path: pinned-l9f
      - name: Independently verify upstream exact-head artifact ZIP and report SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/easonliu714/event_scraper_public/actions/artifacts/12820574944" \
            | python -c 'import json,sys; a=json.load(sys.stdin); assert a["id"]==12820574944; assert a["workflow_run"]["head_sha"]=="96748095bbe8084d302bf74b3a7c0aa119039ca2"; assert a["digest"]=="sha256:c0f03e2448ae90388f113164388a254808656d5f274a75e2eaad66c2a530b8d3"; assert not a["expired"]; print("PASS_L9P_L9O_EXACT_HEAD_ZIP_PIN")'
          (cd pinned-l9o && sha256sum -c SHA256SUMS.txt)
          (cd pinned-l9f && sha256sum -c SHA256SUMS.txt)
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import {parents} from './scripts/p30_l9p_ibon_control_types.mjs';
          const ob=readFileSync('pinned-l9o/ibon_label_topology.json');
          const fb=readFileSync('pinned-l9f/detail_role_review.json');
          const p=parents(JSON.parse(ob),ob,JSON.parse(fb),fb);
          if(p.sources.length!==4)throw Error('HOLD_L9P_SOURCE_COUNT');
          console.log('PASS_L9P_PARENT_L9O_L9F_REPORT_SHA',p.osha,p.fsha);
          JS
      - name: Four exact official pages and two passive local DOM snapshots each
        run: |
          set -euo pipefail
          node scripts/p30_l9p_ibon_control_types.mjs \
            --l9o pinned-l9o/ibon_label_topology.json \
            --l9f pinned-l9f/detail_role_review.json \
            --out p30-l9p-evidence
      - name: Independent evidence and publication-boundary readback
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          p=Path('p30-l9p-evidence')
          r=json.loads((p/'ibon_local_control_types.json').read_text(encoding='utf-8'))
          m=json.loads((p/'manifest.json').read_text(encoding='utf-8'))
          assert r['kind']=='EVENTRADAR_P30_L9P_IBON_LOCAL_CONTROL_TYPES_V1'
          assert r['sampleCount']==len(r['rows'])==4
          assert [x['id'] for x in r['rows']]==['39575','39878','39907','39978']
          assert r['parentL9ORun']==40702378377 and r['parentL9OArtifact']==12820574944
          assert r['parentL9OZipSHA256']=='c0f03e2448ae90388f113164388a254808656d5f274a75e2eaad66c2a530b8d3'
          assert r['currentTitleBothSnapshots']<=4
          assert r['controlTopologyStableCount']<=r['currentTitleBothSnapshots']
          assert sum(r['reasonCounts'].values())==4
          assert r['formalFieldPromotions']==r['goldenAccepted']==0
          assert r['published'] is False and r['releaseState']=='HARD_HOLD_NO_PUBLICATION'
          assert not any(r[k] for k in ('writerExecuted','schedulerExecuted','notifierExecuted','mergeExecuted','rawHtmlPersisted','sourceTextPersisted','linkUrlsPersisted','screenshotsPersisted','cookiesPersisted'))
          assert r['existingAndroid44Preserved'] and r['l8CoreAndroidPassPreserved']
          for x in r['rows']:
            assert x['url']=='https://ticket.ibon.com.tw/ActivityInfo/Details/'+x['id']
            assert x['formalDate'] is None and x['formalPrice'] is None and x['ticketStatus']=='UNKNOWN'
            assert x['acceptedFields']==0 and x['controlDecision'].startswith('HOLD_')
            if not x['stableTitle']:assert x['controlStable'] is False
            for y in (x['first'],x['second']):
              if y is None:continue
              assert 0<=y['controlCount']<=32
              assert all(not any(s in k.lower() for s in ('href','url','html','cookie','price','date')) for k in y)
            print('L9P_DETAIL',x['id'],x['http'],x['stableTitle'],x['controlDecision'],
              x['controlStable'],x['firstControlCause'],x['secondControlCause'])
          assert hashlib.sha256((p/'ibon_local_control_types.json').read_bytes()).hexdigest()==m['filesSHA256']['ibon_local_control_types.json']
          print('PASS_L9P_FOUR_SOURCE_CONTROL_TYPE_REPORT_SHA')
          print('QUALITY_L9P_CONTROL_STABLE',r['controlTopologyStableCount'])
          print('HOLD_L9P_NO_DATE_PRICE_GOLDEN_PUBLISH')
          PY
      - name: Seal isolated artifact
        if: always()
        run: |
          mkdir -p p30-l9p-evidence
          if test -f p30-l9p-evidence/manifest.json; then
            (cd p30-l9p-evidence && sha256sum ibon_local_control_types.json manifest.json > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          else
            echo HOLD_L9P_REPORT_MISSING
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eventradar-p30-l9p-ibon-control-types-readonly
          path: p30-l9p-evidence/
          retention-days: 14
          if-no-files-found: warn
