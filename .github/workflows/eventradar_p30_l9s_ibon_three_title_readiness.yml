name: EventRadar P30 L9-S three ibon source title readiness (READ ONLY)
on:
  push:
    branches:
      - feat/eventradar-p30-l9s-ibon-three-title-readiness
permissions:
  contents: read
  actions: read
concurrency:
  group: eventradar-p30-l9s-three-title-readiness
  cancel-in-progress: true
jobs:
  three-title-readiness:
    if: github.repository == 'easonliu714/event_scraper_public'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Frozen L9-R base, exact three ADD-only paths and production SHA
        run: |
          set -euo pipefail
          base=3f473d6b377650cf15b84e83d2481f8790347cac
          git merge-base --is-ancestor "$base" HEAD
          test "$(git rev-parse HEAD:docs/data.json)" = 7fc4fe32567a57fd504483eeb9a8b9e10b568ea4
          test "$(git rev-parse HEAD:scraper.py)" = 98eddeafb497718c51aa81c6a150e9a5e1e687a8
          test "$(git rev-parse HEAD:docs/manifest.json)" = 6fca76fd65958c6ab2381bf949e061aa7f8fb551
          expected="$(printf 'A\t%s\n' '.github/workflows/eventradar_p30_l9s_ibon_three_title_readiness.yml' 'scripts/p30_l9s_ibon_three_title_readiness.mjs' 'tests/p30/test_l9s_ibon_three_title_readiness.mjs' | LC_ALL=C sort)"
          actual="$(git diff --name-status "$base" HEAD | LC_ALL=C sort)"
          test "$expected" = "$actual" || { echo HOLD_L9S_UNEXPECTED_DIFF; exit 1; }
          echo PASS_L9S_EXACT_THREE_PATHS_FROZEN_PRODUCTION
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install normal Chromium without stealth
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.55.0
          ./node_modules/.bin/playwright install chromium
      - name: Syntax and 30 deterministic fail-closed tests
        run: |
          set -euo pipefail
          node --check scripts/p30_l9s_ibon_three_title_readiness.mjs
          node --test tests/p30/test_l9s_ibon_three_title_readiness.mjs | tee /tmp/l9s-tests.log
          grep -Eq '^# tests 30$' /tmp/l9s-tests.log
          grep -Eq '^# fail 0$' /tmp/l9s-tests.log
          echo PASS_L9S_30_OFFLINE_GUARDS
      - uses: actions/download-artifact@v4
        with:
          name: eventradar-p30-l9r-ibon-39878-title-state-readonly
          run-id: 40731815454
          repository: easonliu714/event_scraper_public
          github-token: ${{ github.token }}
          path: pinned-l9r
      - uses: actions/download-artifact@v4
        with:
          name: eventradar-p30-l9f-ibon-detail-roles-review-only
          run-id: 40494326021
          repository: easonliu714/event_scraper_public
          github-token: ${{ github.token }}
          path: pinned-l9f
      - name: Pin exact-head R/F artifact digests and validate source lineage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/easonliu714/event_scraper_public/actions/artifacts/12835237400" \
            | python -c 'import json,sys; a=json.load(sys.stdin); assert a["id"]==12835237400; assert a["workflow_run"]["head_sha"]=="3f473d6b377650cf15b84e83d2481f8790347cac"; assert a["digest"]=="sha256:cce75aa2bd82d4a695b58019db8e6c0cee5e703052039f3cb80210dfa70df96a"; assert not a["expired"]; print("PASS_L9S_R_EXACT_HEAD_ZIP_PIN")'
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/easonliu714/event_scraper_public/actions/artifacts/12729277485" \
            | python -c 'import json,sys; a=json.load(sys.stdin); assert a["id"]==12729277485; assert a["workflow_run"]["head_sha"]=="d85504773108281099ec0654c5c772de243f910c"; assert a["digest"]=="sha256:811e1b133c253f3cde33c31a203a9ed4bfbfab7418822a9b3a59c00fdd9cf884"; assert not a["expired"]; print("PASS_L9S_F_EXACT_HEAD_ZIP_PIN")'
          (cd pinned-l9r && sha256sum -c SHA256SUMS.txt)
          (cd pinned-l9f && sha256sum -c SHA256SUMS.txt)
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import {parents} from './scripts/p30_l9s_ibon_three_title_readiness.mjs';
          const rb=readFileSync('pinned-l9r/ibon_39878_title_state.json');
          const fb=readFileSync('pinned-l9f/detail_role_review.json');
          const p=parents(JSON.parse(rb),rb,JSON.parse(fb),fb);
          console.log('PASS_L9S_THREE_PINNED_SOURCE_IDS',p.sources.map(x=>x.id).join(','));
          console.log('PASS_L9S_PARENT_REPORT_SHA',p.rSha,p.fSha);
          JS
      - name: Three normal official pages, eight passive snapshots each
        run: |
          set -euo pipefail
          node scripts/p30_l9s_ibon_three_title_readiness.mjs \
            --l9r pinned-l9r/ibon_39878_title_state.json \
            --l9f pinned-l9f/detail_role_review.json \
            --out p30-l9s-evidence
      - name: Independent report and SHA no-publication readback
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          p=Path('p30-l9s-evidence')
          b=(p/'three_title_readiness.json').read_bytes()
          r=json.loads(b)
          m=json.loads((p/'manifest.json').read_bytes())
          assert r['kind']=='EVENTRADAR_P30_L9S_IBON_THREE_TITLE_READINESS_V1'
          assert r['parentL9RRun']==40731815454 and r['parentL9RArtifact']==12835237400
          assert r['parentL9RZipSHA256']=='cce75aa2bd82d4a695b58019db8e6c0cee5e703052039f3cb80210dfa70df96a'
          assert r['parentL9FFileSHA256']=='81780c6cf5d7fa09239f9d90c5a889b53016c81693d47dc20e8f73a9dc77ffe4'
          assert [x['id'] for x in r['rows']]==['39575','39907','39978']
          assert r['sampleCount']==8 and r['intervalMs']==600
          assert r['stableTitleReviewCount']==sum(x['state']=='REVIEW_STABLE_TITLE_READY_NO_FIELD_PROMOTION' for x in r['rows'])
          for x in r['rows']:
            assert x['url']=='https://ticket.ibon.com.tw/ActivityInfo/Details/'+x['id']
            if x['http']==200 and x['finalUrlExact']:
              assert len(x['timeline'])==8 and [s['index'] for s in x['timeline']]==list(range(8))
              assert sorted(x['timeline'][0])==sorted(('index','readyState','headingCount','titleCandidateCount','exactTitleMatch','candidateFingerprint','dateLabelCount','titleState'))
              assert x['analysis']['acceptedFields']==0
            else:
              assert x['analysis'] is None and not x['timeline'] and x['state'].startswith('HOLD_')
          assert r['formalFieldPromotions']==r['goldenAccepted']==0
          assert r['published'] is False and r['releaseState']=='HARD_HOLD_NO_PUBLICATION'
          assert not any(r[k] for k in ('writerExecuted','schedulerExecuted','notifierExecuted','mergeExecuted','rawHtmlPersisted','sourceTextPersisted','linkUrlsPersisted','screenshotsPersisted','cookiesPersisted'))
          assert r['existingAndroid44Preserved'] and r['l8CoreAndroidPassPreserved']
          assert m['filesSHA256']['three_title_readiness.json']==hashlib.sha256(b).hexdigest()
          assert m['releaseState']=='HARD_HOLD_NO_PUBLICATION' and m['published'] is False
          print('L9S_SOURCE_QUALITY',json.dumps([{k:x[k] for k in ('id','http','state')} for x in r['rows']]))
          print('PASS_L9S_SOURCE_BOUND_REPORT_SHA_AND_HARD_HOLD')
          PY
      - name: Seal isolated evidence SHA manifest
        if: always()
        run: |
          mkdir -p p30-l9s-evidence
          if test -f p30-l9s-evidence/manifest.json; then
            (cd p30-l9s-evidence && sha256sum three_title_readiness.json manifest.json > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          else
            echo HOLD_L9S_REPORT_MISSING
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eventradar-p30-l9s-three-ibon-title-readiness-readonly
          path: p30-l9s-evidence/
          retention-days: 14
          if-no-files-found: warn
