name: EventRadar P30 L9-L four ibon source-bound field semantics (NO PUBLISH)
on:
  push:
    branches:
      - feat/eventradar-p30-l9l-ibon-four-field-semantics
permissions:
  contents: read
  actions: read
concurrency:
  group: eventradar-p30-l9l-ibon-fields-readonly
  cancel-in-progress: true
jobs:
  four-detail-semantic-evidence:
    if: github.repository == 'easonliu714/event_scraper_public'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Exact L9-K parent, formal asset blob freeze, three additions only
        run: |
          set -euo pipefail
          base=30aa18a9fbe4dc7b46f9b4b2cf41a51b70f0b11a
          git merge-base --is-ancestor "$base" HEAD
          test "$(git rev-parse HEAD:docs/data.json)" = 7fc4fe32567a57fd504483eeb9a8b9e10b568ea4
          test "$(git rev-parse HEAD:docs/index.html)" = 8167aa329f6958a076736166bcaf321da1c8e4ee
          test "$(git rev-parse HEAD:scraper.py)" = 98eddeafb497718c51aa81c6a150e9a5e1e687a8
          test "$(git rev-parse HEAD:docs/manifest.json)" = 6fca76fd65958c6ab2381bf949e061aa7f8fb551
          expected="$(printf 'A\t%s\n' '.github/workflows/eventradar_p30_l9l_ibon_four_fields.yml' 'scripts/p30_l9l_ibon_four_field_semantics.mjs' 'tests/p30/test_l9l_ibon_four_field_semantics.mjs' | LC_ALL=C sort)"
          actual="$(git diff --name-status "$base" HEAD | LC_ALL=C sort)"
          test "$expected" = "$actual" || { echo HOLD_L9L_UNEXPECTED_CHANGE; exit 1; }
          echo PASS L9L_EXACT_PARENT_AND_THREE_ADDITIONS
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install fixed normal Chromium
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.55.0
          ./node_modules/.bin/playwright install chromium
      - name: Thirty offline structural semantic negatives
        run: |
          set -euo pipefail
          node --check scripts/p30_l9l_ibon_four_field_semantics.mjs
          node --test tests/p30/test_l9l_ibon_four_field_semantics.mjs
          echo PASS L9L_30_ROLE_NEGATIVES
      - uses: actions/download-artifact@v4
        with:
          name: eventradar-p30-l9f-ibon-detail-roles-review-only
          run-id: 40494326021
          repository: easonliu714/event_scraper_public
          github-token: ${{ github.token }}
          path: l9l-l9f-source
      - name: Verify source SHA and four selected identity/title contracts
        run: |
          set -euo pipefail
          (cd l9l-l9f-source && sha256sum -c SHA256SUMS.txt)
          node --input-type=module <<'JS'
          import {readFileSync} from "node:fs";
          import {createHash} from "node:crypto";
          import {validateParent} from "./scripts/p30_l9l_ibon_four_field_semantics.mjs";
          const dir="l9l-l9f-source/";
          const raw=readFileSync(dir+"detail_role_review.json"),m=JSON.parse(readFileSync(dir+"manifest.json"));
          const digest=createHash("sha256").update(raw).digest("hex");
          if(m.fileSHA256["detail_role_review.json"]!==digest)throw Error("HOLD_SOURCE_SHA");
          const proof=validateParent(JSON.parse(raw),raw);
          console.log("PASS L9L_PARENT_SHA_FOUR_TITLE_IDS",proof.parentSha256,proof.rows.map(x=>x.id).join(","));
          JS
      - name: Four new normal public Chromium detail visits, no formal promotion
        run: |
          node scripts/p30_l9l_ibon_four_field_semantics.mjs --source l9l-l9f-source/detail_role_review.json --out p30-l9l-evidence
      - name: Seal and verify bounded field structure evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          d=Path('p30-l9l-evidence')
          r=json.loads((d/'ibon_four_field_semantics.json').read_text())
          m=json.loads((d/'manifest.json').read_text())
          assert r['kind']=='EVENTRADAR_P30_L9L_FOUR_IBON_DETAIL_SEMANTIC_REVIEW_V1'
          assert r['sampleCount']==len(r['results'])==4
          assert [x['id'] for x in r['results']]==['39575','39878','39907','39978']
          assert r['releaseState']=='HARD_HOLD_NO_PUBLICATION'
          assert r['formalFieldPromotions']==r['sessionSplits']==r['goldenAccepted']==0
          assert not any(r[k] for k in ('published','writerExecuted','schedulerExecuted','notifierExecuted','mergeExecuted'))
          for x in r['results']:
            assert x['formalDate'] is None and x['formalPrice'] is None and x['ticketStatus']=='UNKNOWN'
            if not x['titleParity']:assert not x['accepted'] and not x['rejected']
            for e in x['accepted']+x['rejected']:
              assert not e['verified'] and not e['formalFieldPromoted']
          assert hashlib.sha256((d/'ibon_four_field_semantics.json').read_bytes()).hexdigest()==m['sha256']['ibon_four_field_semantics.json']
          print('PASS L9L_FOUR_SOURCE_BOUND_DETAILS_SHA_NO_RELEASE')
          print('QUALITY L9L_TITLE',r['titleParityCount'],'REVIEW',r['reviewPairCount'],'REJECT',r['rejectedPairCount'])
          PY
      - name: SHA seal isolated evidence
        if: always()
        run: |
          mkdir -p p30-l9l-evidence
          if test -f p30-l9l-evidence/manifest.json; then
            (cd p30-l9l-evidence && sha256sum ibon_four_field_semantics.json manifest.json > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eventradar-p30-l9l-ibon-four-field-semantics
          path: p30-l9l-evidence/
          if-no-files-found: warn
          retention-days: 14
