name: EventRadar P30 VENUE-01F bounded official detail review (NO PUBLISH)
on:
  pull_request:
    branches: [feat/eventradar-p30-venue01d-offline-identity-20261029]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: eventradar-p30-venue01f-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  venue01f-live:
    if: github.repository == 'easonliu714/event_scraper_public' && github.head_ref == 'feat/eventradar-p30-venue01f-live-detail-20261029-2256'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact-head isolated scope and frozen production blobs
        shell: bash
        run: |
          set -euo pipefail
          base=79d84788c5e63412430998470dc961c0b4251376
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git merge-base "$base" HEAD)" = "$base"
          expected="$(printf 'A\t%s\n' '.github/workflows/eventradar_p30_venue01f_live_detail.yml' 'scripts/p30_venue01f_live_detail.py' 'tests/p30/test_venue01f_live_detail.py' | LC_ALL=C sort)"
          actual="$(git diff --name-status "$base" HEAD | LC_ALL=C sort)"
          test "$expected" = "$actual"
          test "$(git rev-parse origin/main:docs/data.json)" = 7fc4fe32567a57fd504483eeb9a8b9e10b568ea4
          test "$(git rev-parse origin/main:docs/platform_status.json)" = e19ca37c4c80c10b7278d0813b8ff1047535d124
      - name: Exact-scope eight negative tests
        run: |
          python -m py_compile scripts/p30_venue01f_live_detail.py tests/p30/test_venue01f_live_detail.py
          python -m unittest discover -s tests/p30 -p test_venue01f_live_detail.py -v
      - name: One official detail HTTPS GET without redirect or retry
        run: |
          python scripts/p30_venue01f_live_detail.py --live --out p30-venue01f-evidence
      - name: Independent SHA and no-publication checks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('p30-venue01f-evidence')
          r=json.loads((p/'detail_review.json').read_text())
          m=json.loads((p/'manifest.json').read_text())
          assert m['filesSHA256']['detail_review.json']==hashlib.sha256((p/'detail_review.json').read_bytes()).hexdigest()
          assert r['acceptedFields']==0 and r['goldenAccepted']==0 and r['published'] is False
          assert not r.get('rawHtmlPersisted',False) and not r.get('rawTitlesPersisted',False)
          print('PASS_VENUE01F_SHA_NO_PUBLICATION')
          PY
          (cd p30-venue01f-evidence && sha256sum *.json > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eventradar-p30-venue01f-live-detail
          path: p30-venue01f-evidence/
          if-no-files-found: ignore
