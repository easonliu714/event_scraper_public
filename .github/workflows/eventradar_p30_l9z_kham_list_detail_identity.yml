name: EventRadar P30 L9-Z Kham same-ID list/detail identity (NO PUBLISH)
on:
  push:
    branches: [feat/eventradar-p30-l9z-kham-list-detail-identity]
permissions:
  contents: read
  actions: read
concurrency:
  group: eventradar-p30-l9z-kham-identity
  cancel-in-progress: false
jobs:
  kham-list-detail-identity:
    if: github.repository == 'easonliu714/event_scraper_public'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Exact frozen parent, formal main and three ADD-only paths
        run: |
          set -euo pipefail
          base=b8bd1905a875d62d131cd8db1fec814437b2fcb5
          test "$(git rev-parse origin/main)" = fbf4ca02b91159f2423caf3d79fb0ca4bb747069
          test "$(git rev-parse HEAD:scraper.py)" = 98eddeafb497718c51aa81c6a150e9a5e1e687a8
          test "$(git rev-parse HEAD:docs/data.json)" = 7fc4fe32567a57fd504483eeb9a8b9e10b568ea4
          test "$(git rev-parse origin/main:docs/data.json)" = 7fc4fe32567a57fd504483eeb9a8b9e10b568ea4
          test "$(git rev-parse origin/main:docs/platform_status.json)" = e19ca37c4c80c10b7278d0813b8ff1047535d124
          git merge-base --is-ancestor "$base" HEAD
          expected="$(printf 'A\t%s\n' '.github/workflows/eventradar_p30_l9z_kham_list_detail_identity.yml' 'scripts/p30_l9z_kham_list_detail_identity.py' 'tests/p30/test_l9z_kham_list_detail_identity.py' | LC_ALL=C sort)"
          actual="$(git diff --name-status "$base" HEAD | LC_ALL=C sort)"
          test "$actual" = "$expected" || { echo HOLD_L9Z_SCOPE; exit 1; }
          git show origin/main:docs/platform_status.json > /tmp/l9z-status.json
          echo PASS_L9Z_FROZEN_PARENT_SOURCE_SCOPE
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned BeautifulSoup and normal Chromium
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'beautifulsoup4==4.14.2' 'playwright==1.55.0'
          python -m playwright install chromium
      - name: 49 offline fail-closed tests before any live request
        run: |
          set -euo pipefail
          python -m py_compile scripts/p30_l9z_kham_list_detail_identity.py tests/p30/test_l9z_kham_list_detail_identity.py
          python -m unittest discover -s tests/p30 -p test_l9z_kham_list_detail_identity.py -v 2>&1 | tee /tmp/l9z-tests.log
          grep -q 'Ran 49 tests' /tmp/l9z-tests.log
          grep -q '^OK$' /tmp/l9z-tests.log
      - uses: actions/download-artifact@v4
        with:
          name: eventradar-p30-l9y-kham-event-object-boundary
          run-id: 40790894717
          repository: easonliu714/event_scraper_public
          github-token: ${{ github.token }}
          path: pinned-l9y
      - name: Verify frozen parent artifact GitHub ZIP digest and manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/easonliu714/event_scraper_public/actions/artifacts/12860709898" | python -c 'import json,sys; a=json.load(sys.stdin); assert a["digest"]=="sha256:436199dd5cf7b8f18c552f6fd128b4a5654b8fd421042de2adcc798e22186568" and not a["expired"],"HOLD_L9Y_PARENT_DIGEST"'
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          base=Path("pinned-l9y")
          manifest=json.loads((base/"manifest.json").read_bytes())
          assert manifest["releaseState"]=="HARD_HOLD_NO_PUBLICATION"
          for name,digest in manifest["filesSHA256"].items():
              assert hashlib.sha256((base/name).read_bytes()).hexdigest()==digest,"HOLD_L9Y_MANIFEST"
          assert hashlib.sha256((base/"kham_event_object_boundary.json").read_bytes()).hexdigest()=="9104fcd2e6d5c3f78c9a7b5d86754abbfb9f5f0b0fd5462fd25e76bcdfb89e12"
          print("PASS_L9Z_PARENT_SHA_MANIFEST")
          PY
      - name: One normal public list and at most two exact-ID detail navigations
        run: |
          set -euo pipefail
          python scripts/p30_l9z_kham_list_detail_identity.py --status /tmp/l9z-status.json --parent pinned-l9y/kham_event_object_boundary.json --scraper scraper.py --out p30-l9z-evidence --live-kham
      - name: Independent structural, SHA, privacy and NO PUBLISH readback
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path("p30-l9z-evidence")
          raw=(root/"kham_list_detail_identity.json").read_bytes()
          r=json.loads(raw)
          manifest=json.loads((root/"manifest.json").read_bytes())
          assert r["kind"]=="EVENTRADAR_P30_L9Z_KHAM_LIST_DETAIL_IDENTITY_V1"
          assert r["parentHead"]=="b8bd1905a875d62d131cd8db1fec814437b2fcb5"
          assert r["releaseState"]=="HARD_HOLD_NO_PUBLICATION"
          assert 1<=r["navigationCount"]<=3 and len(r["samples"])<=2
          assert r["formalVerifiedEventIdentity"]==r["acceptedFields"]==r["goldenAccepted"]==0
          assert r["sampledCurrentTitleMatches"]<=2
          for k in ("published","productionModified","mergeExecuted","writerExecuted","schedulerExecuted","notifierExecuted","rawHtmlPersisted","rawUrlsPersisted","rawTitlesPersisted","rawProductIdsPersisted","cookiesPersisted","screenshotsPersisted"):
              assert r[k] is False,k
          assert b"https://" not in raw and b"PRODUCT_ID=" not in raw and b"<html" not in raw.lower()
          assert hashlib.sha256(raw).hexdigest()==manifest["filesSHA256"]["kham_list_detail_identity.json"]
          assert manifest["releaseState"]=="HARD_HOLD_NO_PUBLICATION" and manifest["published"] is False
          print("PASS_L9Z_SHA_PRIVACY_NO_PUBLICATION",r["decision"])
          PY
      - name: Seal evidence SHA256SUMS
        if: always()
        run: |
          mkdir -p p30-l9z-evidence
          if test -f p30-l9z-evidence/manifest.json; then
            (cd p30-l9z-evidence && sha256sum kham_list_detail_identity.json manifest.json > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          else
            echo HOLD_L9Z_REPORT_MISSING
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eventradar-p30-l9z-kham-list-detail-identity
          path: p30-l9z-evidence/
          retention-days: 14
          if-no-files-found: warn
