name: EventRadar P30 L9-AS one bounded FamiTicket live HTML DOM (NO PUBLISH)
on:
  pull_request:
    branches: [feat/eventradar-p30-l9ar-famiticket-role-text]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: eventradar-p30-l9as-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  famiticket-live-dom:
    if: github.repository == 'easonliu714/event_scraper_public' && github.head_ref == 'feat/eventradar-p30-l9as-famiticket-live-dom-20261030-0555'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact HEAD and three ADD-only files and formal blob guards
        shell: bash
        run: |
          set -euo pipefail
          base=7767c74779c6323214b12f4ffe663378428254dd
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git merge-base "$base" HEAD)" = "$base"
          expected="$(printf 'A\t%s\n' '.github/workflows/eventradar_p30_l9as_famiticket_live_dom.yml' 'scripts/p30_l9as_famiticket_live_dom.py' 'tests/p30/test_l9as_famiticket_live_dom.py' | LC_ALL=C sort)"
          test "$expected" = "$(git diff --name-status "$base" HEAD | LC_ALL=C sort)"
          test "$(git rev-parse origin/main:docs/data.json)" = 7fc4fe32567a57fd504483eeb9a8b9e10b568ea4
          test "$(git rev-parse origin/main:docs/platform_status.json)" = e19ca37c4c80c10b7278d0813b8ff1047535d124
      - name: Frozen role tests and new HTML negative controls
        run: |
          python -m pip install --disable-pip-version-check 'requests==2.32.5' 'beautifulsoup4==4.14.2'
          python -m py_compile scripts/p30_l9as_famiticket_live_dom.py tests/p30/test_l9as_famiticket_live_dom.py
          python -m unittest discover -s tests/p30 -p test_l9ar_famiticket_role_text.py -v
          python -m unittest discover -s tests/p30 -p test_l9as_famiticket_live_dom.py -v
      - name: One normal official GET only, sanitized DOM result, no raw HTML
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p p30-l9as-evidence
          python scripts/p30_l9as_famiticket_live_dom.py --live-one --out p30-l9as-evidence/audit.json
          python - <<'PY'
          import hashlib,json,pathlib
          d=pathlib.Path('p30-l9as-evidence')
          p=d/'audit.json'; obj=json.loads(p.read_text())
          assert obj['requestCount']==1 and obj['acceptedFields']==0 and obj['goldenAccepted']==0
          assert obj['published'] is False and obj['releaseState']=='HARD_HOLD_NO_PUBLICATION'
          assert 'rawHtml' not in obj and 'cookies' not in obj
          (d/'manifest.json').write_text(json.dumps({'filesSHA256':{'audit.json':hashlib.sha256(p.read_bytes()).hexdigest()}},sort_keys=True)+'\n')
          PY
          (cd p30-l9as-evidence && sha256sum *.json > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eventradar-p30-l9as-one-live-html-review
          path: p30-l9as-evidence/
          if-no-files-found: ignore
