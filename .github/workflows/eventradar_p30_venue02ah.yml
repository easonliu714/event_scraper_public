name: EventRadar P30-VENUE02AH Ceramics metadata role boundary (NO PUBLISH)
on:
  pull_request:
    branches: [feat/eventradar-p30-venue02ag-two-sid-role-review]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  metadata-roles:
    if: github.repository == 'easonliu714/event_scraper_public' && github.head_ref == 'feat/eventradar-p30-venue02ah-ceramics-date-role-boundary'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact head, three ADD-only paths, frozen production
        shell: bash
        run: |
          set -euo pipefail
          base=d2d594197276b6a38fe45bb605c3afdb1cdd110a
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git merge-base "$base" HEAD)" = "$base"
          expected="$(printf 'A\t%s\n' 'scripts/p30_venue02ah_ceramics_date_role_boundary.py' 'tests/p30/test_venue02ah_ceramics_date_role_boundary.py' '.github/workflows/eventradar_p30_venue02ah.yml' | LC_ALL=C sort)"
          test "$expected" = "$(git diff --name-status "$base" HEAD | LC_ALL=C sort)"
          test "$(git rev-parse origin/main:docs/data.json)" = 7fc4fe32567a57fd504483eeb9a8b9e10b568ea4
          test "$(git rev-parse origin/main:docs/platform_status.json)" = e19ca37c4c80c10b7278d0813b8ff1047535d124
      - name: AG predecessor and AH metadata role tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'beautifulsoup4==4.14.2' 'requests==2.32.5'
          python -m py_compile scripts/p30_venue02ah_ceramics_date_role_boundary.py tests/p30/test_venue02ah_ceramics_date_role_boundary.py
          python -m unittest discover -s tests/p30 -p 'test_venue02ag_ceramics_two_sid_roles.py' -v
          python -m unittest discover -s tests/p30 -p 'test_venue02ah_ceramics_date_role_boundary.py' -v
      - name: Immutable sanitized receipt and SHA manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p eventradar_venue02ah-evidence
          python - <<'PY'
          import hashlib,json,pathlib,subprocess
          p=pathlib.Path('eventradar_venue02ah-evidence')
          a={'gate':'P30-VENUE-02AH','headSHA':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'officialGETinCI':0,'sourceQualityFromIndependentReader':'ARTICLE_UPDATE_VS_EXHIBITION_ROLE','distinctOfficialSIDCount':2,'acceptedFields':0,'goldenAccepted':0,'published':False,'decision':'REVIEW_TWO_SIDS_UPDATE_DATES_NOT_EVENT_SESSIONS','releaseState':'HARD_HOLD_NO_PUBLICATION'}
          (p/'audit.json').write_text(json.dumps(a,sort_keys=True)+'\n')
          (p/'manifest.json').write_text(json.dumps({'filesSHA256':{'audit.json':hashlib.sha256((p/'audit.json').read_bytes()).hexdigest()}},sort_keys=True)+'\n')
          PY
          (cd eventradar_venue02ah-evidence && sha256sum *.json > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eventradar_venue02ah-evidence
          path: eventradar_venue02ah-evidence/
          if-no-files-found: ignore
