name: EventRadar P30-VENUE-02BH exact-head NO PUBLISH
on:
  pull_request:
    branches: [feat/eventradar-p30-venue02bg-cloudgate-postponement]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  exact-head:
    if: github.repository == 'easonliu714/event_scraper_public' && github.head_ref == 'feat/eventradar-p30-venue02bh-zepp-two-shows-bundle'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact HEAD, ADD-only paths, frozen feed
        shell: bash
        run: |
          set -euo pipefail
          base=55f2631a927cb1750deeefa8c0b82835e96b5f4d
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git merge-base "$base" HEAD)" = "$base"
          expected="$(printf 'A\t%s\n' 'scripts/p30_venue02bh_zepp_two_shows_bundle.py' 'tests/p30/test_venue02bh_zepp_two_shows_bundle.py' '.github/workflows/eventradar_p30_venue_02bh.yml' | LC_ALL=C sort)"
          test "$expected" = "$(git diff --name-status "$base" HEAD | LC_ALL=C sort)"
          test "$(git rev-parse origin/main:docs/data.json)" = 7fc4fe32567a57fd504483eeb9a8b9e10b568ea4
          python - <<'PY'
          import json,subprocess
          d=json.loads(subprocess.check_output(['git','show','origin/main:docs/platform_status.json']))
          assert len(d['platforms'])==19
          assert d['production']['eventFeedReleaseState']=='HARD_HOLD_NO_PUBLICATION'
          assert d['production']['goldenAccepted']==0
          PY
      - name: Predecessor and current source-bound tests
        run: |
          python -m py_compile scripts/p30_venue02bh_zepp_two_shows_bundle.py tests/p30/test_venue02bh_zepp_two_shows_bundle.py
          python -m unittest discover -s tests/p30 -p 'test_venue02bg_cloudgate_postponement.py' -v
          python -m unittest discover -s tests/p30 -p 'test_venue02bh_zepp_two_shows_bundle.py' -v
      - name: Evidence SHA256 manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python - <<'PY'
          import hashlib,json,pathlib,subprocess
          p=pathlib.Path('evidence')
          a={'gate':'P30-VENUE-02BH','headSHA':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
             'officialGETinCI':0,'sourceObservationDate':'2026-11-01',
             'sourceEvidence':"New Taipei Zepp official rid=160668 Nov07 18:00 and rid=165132 Nov08 17:00, both direct-link same KKTIX /events/takasetoya202611. KKTIX Event Dates has bundle span Nov07->Nov08 plus two separate show rows; bundle not third show. Single VVIP 5880 vs two-day bundle 10800, sale 09/23 20:00 distinct from shows. Web-reader source evidence, CI GET=0.",
             'acceptedFields':0,'ticketSessionIdsVerified':0,'goldenAccepted':0,
             'published':False,'releaseState':'HARD_HOLD_NO_PUBLICATION'}
          (p/'audit.json').write_text(json.dumps(a,sort_keys=True,ensure_ascii=False)+'\n',encoding='utf-8')
          (p/'manifest.json').write_text(json.dumps({'filesSHA256':{'audit.json':hashlib.sha256((p/'audit.json').read_bytes()).hexdigest()}},sort_keys=True)+'\n')
          PY
          (cd evidence && sha256sum *.json > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eventradar_p30_venue_02bh-source-evidence
          path: evidence/
          if-no-files-found: error
