name: EventRadar P30-VENUE-02BB exact-head NO PUBLISH
on:
  pull_request:
    branches: [feat/eventradar-p30-venue02ba-fuzhong-screening-date-conflict]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  exact-head:
    if: github.repository == 'easonliu714/event_scraper_public' && github.head_ref == 'feat/eventradar-p30-venue02bb-zepp-ticketplus-js-hold'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact-head ADD-only and frozen formal blobs
        shell: bash
        run: |
          set -euo pipefail
          base=2e702fe63a819c9845a8bf12814dad79ff9d661d
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git merge-base "$base" HEAD)" = "$base"
          expected="$(printf 'A\t%s\n' 'scripts/p30_venue02bb_zepp_ticketplus_link.py' 'tests/p30/test_venue02bb_zepp_ticketplus_link.py' '.github/workflows/eventradar_p30_venue02bb.yml' | LC_ALL=C sort)"
          test "$expected" = "$(git diff --name-status "$base" HEAD | LC_ALL=C sort)"
          test "$(git rev-parse origin/main:docs/data.json)" = 7fc4fe32567a57fd504483eeb9a8b9e10b568ea4
          test "$(git rev-parse origin/main:docs/platform_status.json)" = e19ca37c4c80c10b7278d0813b8ff1047535d124
      - name: Predecessor and new regression
        run: |
          python -m py_compile scripts/p30_venue02bb_zepp_ticketplus_link.py tests/p30/test_venue02bb_zepp_ticketplus_link.py
          python -m unittest discover -s tests/p30 -p 'test_venue02ba_fuzhong_date_conflict.py' -v
          python -m unittest discover -s tests/p30 -p 'test_venue02bb_zepp_ticketplus_link.py' -v
      - name: SHA256 manifest exact HEAD
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python - <<'PY'
          import hashlib,json,pathlib,subprocess
          p=pathlib.Path("evidence")
          a={"gate":"P30-VENUE-02BB","headSHA":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),"officialGETinCI":0,"sourceObservationDate":"2026-11-01","sourceEvidence":"Zepp New Taipei official 2026-11-01 rid 163838 LIST to DETAIL and direct Ticket Plus activity href. Venue text also says ticket URL under construction; Ticket Plus GET returns JS app shell without event detail. Venue show 18:30, sale start Sep 5 14:00, benefit cutoff Oct 16 23:59, nine product price tiers are distinct roles. Ticket Plus not in frozen 19 platforms.","acceptedFields":0,"ticketSessionIdsVerified":0,"goldenAccepted":0,"published":False,"releaseState":"HARD_HOLD_NO_PUBLICATION"}
          (p/"audit.json").write_text(json.dumps(a,sort_keys=True,ensure_ascii=False)+"\n",encoding="utf-8")
          (p/"manifest.json").write_text(json.dumps({"filesSHA256":{"audit.json":hashlib.sha256((p/"audit.json").read_bytes()).hexdigest()}},sort_keys=True)+"\n")
          PY
          (cd evidence && sha256sum *.json > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eventradar-p30-venue-02bb-source-evidence
          path: evidence/
          if-no-files-found: error
