name: Event Radar PR1 G5G - In-memory field parity (NO Publish)
on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: eventradar-pr1-g5g-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  field-parity:
    if: >-
      github.event.pull_request.number == 1 &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == 'easonliu714/event_scraper_public' &&
      github.event.pull_request.head.ref == 'fix/event-radar-v44-cloud-20261023'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EVENT_RADAR_TERMUX: '0'
      EVENT_RADAR_TELEGRAM: '0'
    steps:
      - name: Checkout PR source without credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded parser dependency
        run: python -m pip install 'beautifulsoup4>=4.12,<5'
      - name: Eleven exact public HTML parses in memory - evidence only
        run: |
          python scripts/g5g_field_probe.py \
            --environment cloud \
            --manifest fixtures/g5f_probe_targets.json \
            --output "$RUNNER_TEMP/g5g_evidence/cloud.json"
      - name: Upload sanitized field evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eventradar-pr1-g5g-field-ab
          path: ${{ runner.temp }}/g5g_evidence/cloud.json
          if-no-files-found: warn
          retention-days: 7
