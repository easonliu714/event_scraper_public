name: EventRadar P30-L9BT Huashan intrapage room conflict (NO PUBLISH)
on:
  pull_request:
    branches: [feat/eventradar-p30-l9bs-direct-ticket-edge]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  intrapage-room:
    if: github.repository == 'easonliu714/event_scraper_public' && github.head_ref == 'feat/eventradar-p30-l9bt-huashan-intrapage-room-conflict'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact head, three ADD-only paths, frozen production
        shell: bash
        run: |
          set -euo pipefail
          base=b3f6cbebb4f6c4ce1fa48e7ed6d65ba0833edb29
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git merge-base "$base" HEAD)" = "$base"
          expected="$(printf 'A\t%s\n' 'scripts/p30_l9bt_huashan_intrapage_room_conflict.py' 'tests/p30/test_l9bt_huashan_intrapage_room_conflict.py' '.github/workflows/eventradar_p30_l9bt.yml' | LC_ALL=C sort)"
          test "$expected" = "$(git diff --name-status "$base" HEAD | LC_ALL=C sort)"
          test "$(git rev-parse origin/main:docs/data.json)" = 7fc4fe32567a57fd504483eeb9a8b9e10b568ea4
          test "$(git rev-parse origin/main:docs/platform_status.json)" = e19ca37c4c80c10b7278d0813b8ff1047535d124
      - name: BS predecessor and BT intrapage conflict tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'beautifulsoup4==4.14.2' 'requests==2.32.5'
          python -m py_compile scripts/p30_l9bt_huashan_intrapage_room_conflict.py tests/p30/test_l9bt_huashan_intrapage_room_conflict.py
          python -m unittest discover -s tests/p30 -p 'test_l9bs_huashan_accupass_direct_edge.py' -v
          python -m unittest discover -s tests/p30 -p 'test_l9bt_huashan_intrapage_room_conflict.py' -v
      - name: Immutable sanitized receipt and SHA manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p eventradar_l9bt-evidence
          python - <<'PY'
          import hashlib,json,pathlib,subprocess
          p=pathlib.Path('eventradar_l9bt-evidence')
          a={'gate':'P30-L9-BT','headSHA':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'officialGETinCI':0,'sourceQualityFromIndependentReader':'INTRAPAGE_ROOM_CONFLICT','acceptedFields':0,'goldenAccepted':0,'published':False,'decision':'HOLD_SAME_SOURCE_HEADER_BODY_ROOM_CONFLICT','releaseState':'HARD_HOLD_NO_PUBLICATION'}
          (p/'audit.json').write_text(json.dumps(a,sort_keys=True)+'\n')
          (p/'manifest.json').write_text(json.dumps({'filesSHA256':{'audit.json':hashlib.sha256((p/'audit.json').read_bytes()).hexdigest()}},sort_keys=True)+'\n')
          PY
          (cd eventradar_l9bt-evidence && sha256sum *.json > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eventradar_l9bt-evidence
          path: eventradar_l9bt-evidence/
          if-no-files-found: ignore
