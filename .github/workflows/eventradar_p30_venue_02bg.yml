name: EventRadar P30-VENUE-02BG exact-head NO PUBLISH
on:
  pull_request:
    branches: [feat/eventradar-p30-venue02bf-zepp-perses-price-split]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  exact-head:
    if: github.repository == 'easonliu714/event_scraper_public' && github.head_ref == 'feat/eventradar-p30-venue02bg-cloudgate-postponement'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact HEAD, ADD-only paths, frozen feed
        shell: bash
        run: |
          set -euo pipefail
          base=9619876a631cda412e54ed9f65703bce96d2e5cb
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git merge-base "$base" HEAD)" = "$base"
          expected="$(printf 'A\t%s\n' 'scripts/p30_venue02bg_cloudgate_postponement.py' 'tests/p30/test_venue02bg_cloudgate_postponement.py' '.github/workflows/eventradar_p30_venue_02bg.yml' | LC_ALL=C sort)"
          test "$expected" = "$(git diff --name-status "$base" HEAD | LC_ALL=C sort)"
          test "$(git rev-parse origin/main:docs/data.json)" = 7fc4fe32567a57fd504483eeb9a8b9e10b568ea4
          python - <<'PY'
          import json,subprocess
          d=json.loads(subprocess.check_output(['git','show','origin/main:docs/platform_status.json']))
          assert len(d['platforms'])==19
          assert d['production']['eventFeedReleaseState']=='HARD_HOLD_NO_PUBLICATION'
          assert d['production']['goldenAccepted']==0
          PY
      - name: Predecessor and current strict source-bound tests
        run: |
          python -m py_compile scripts/p30_venue02bg_cloudgate_postponement.py tests/p30/test_venue02bg_cloudgate_postponement.py
          python -m unittest discover -s tests/p30 -p 'test_venue02bf_zepp_perses_price_split.py' -v
          python -m unittest discover -s tests/p30 -p 'test_venue02bg_cloudgate_postponement.py' -v
      - name: Evidence SHA256 manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python - <<'PY'
          import hashlib,json,pathlib,subprocess
          p=pathlib.Path('evidence')
          a={'gate':'P30-VENUE-02BG','headSHA':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
             'officialGETinCI':0,'sourceObservationDate':'2026-11-01',
             'sourceEvidence':"Cloud Gate Theater official latest-program -> exact /theater-event/1680. Sep24 notice explicitly postpones Nov14 13:30/16:30 to Dec19 same times/venue; refund grace Nov14. OPENTIX only named, no direct verified ticket Event/Session URL. October shows unaffected; source-local candidate REVIEW.",
             'acceptedFields':0,'ticketSessionIdsVerified':0,'goldenAccepted':0,
             'published':False,'releaseState':'HARD_HOLD_NO_PUBLICATION'}
          (p/'audit.json').write_text(json.dumps(a,sort_keys=True,ensure_ascii=False)+'\n',encoding='utf-8')
          (p/'manifest.json').write_text(json.dumps({'filesSHA256':{'audit.json':hashlib.sha256((p/'audit.json').read_bytes()).hexdigest()}},sort_keys=True)+'\n')
          PY
          (cd evidence && sha256sum *.json > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eventradar_p30_venue02bg-source-evidence
          path: evidence/
          if-no-files-found: error
