name: EventRadar P30 VENUE-02C TMC card heading source review (NO PUBLISH)
on:
  pull_request:
    branches: [feat/eventradar-p30-venue02b-tmc-title-parity-20261030-0100]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: eventradar-p30-venue02c-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  tmc-card-heading-review:
    if: github.repository == 'easonliu714/event_scraper_public' && github.head_ref == 'feat/eventradar-p30-venue02c-card-heading-20261030-0112'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact head, isolated files, frozen formal data
        shell: bash
        run: |
          set -euo pipefail
          base=4b7792066dbec130d21e4db01d082363fc6ca031
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git merge-base "$base" HEAD)" = "$base"
          expected="$(printf 'A\t%s\n' '.github/workflows/eventradar_p30_venue02c_tmc_card_heading.yml' 'scripts/p30_venue02c_tmc_card_heading.py' 'tests/p30/test_venue02c_tmc_card_heading.py' | LC_ALL=C sort)"
          actual="$(git diff --name-status "$base" HEAD | LC_ALL=C sort)"
          test "$expected" = "$actual"
          test "$(git rev-parse origin/main:docs/data.json)" = 7fc4fe32567a57fd504483eeb9a8b9e10b568ea4
          test "$(git rev-parse origin/main:docs/platform_status.json)" = e19ca37c4c80c10b7278d0813b8ff1047535d124
      - name: Bounded parser and frozen regressions
        run: |
          python -m pip install --disable-pip-version-check 'beautifulsoup4==4.14.2'
          python -m py_compile scripts/p30_venue02c_tmc_card_heading.py tests/p30/test_venue02c_tmc_card_heading.py
          python -m unittest discover -s tests/p30 -p test_venue02a_tmc_source.py -v
          python -m unittest discover -s tests/p30 -p test_venue02b_tmc_title_identity.py -v
          python -m unittest discover -s tests/p30 -p test_venue02c_tmc_card_heading.py -v
      - name: At most one official list and one same-path detail
        run: |
          python scripts/p30_venue02c_tmc_card_heading.py --live --out p30-venue02c-evidence
      - name: Verify SHA manifest and no publication
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('p30-venue02c-evidence')
          r=json.loads((p/'card_heading_review.json').read_text())
          m=json.loads((p/'manifest.json').read_text())
          assert hashlib.sha256((p/'card_heading_review.json').read_bytes()).hexdigest()==m['filesSHA256']['card_heading_review.json']
          assert r['releaseState']=='HARD_HOLD_NO_PUBLICATION'
          assert r['acceptedFields']==r['goldenAccepted']==0
          assert r['published'] is False and r['ticketEventId'] is None
          assert not r['rawHtmlPersisted'] and not r['rawTitlesPersisted'] and not r['rawUrlsPersisted']
          print('PASS_VENUE02C_SHA_NO_PUBLICATION')
          PY
          (cd p30-venue02c-evidence && sha256sum *.json > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eventradar-p30-venue02c-card-heading-review
          path: p30-venue02c-evidence/
          if-no-files-found: ignore
