name: EventRadar P30 L9-AC Kham bounded top-level title (NO PUBLISH)
on:
  push:
    branches: [feat/eventradar-p30-l9ac-kham-top-level-title]
  pull_request:
    branches: [feat/eventradar-p30-l9ab-kham-iframe-narrow]
    paths:
      - .github/workflows/eventradar_p30_l9ac_kham_toplevel_title.yml
      - scripts/p30_l9ac_kham_toplevel_title.py
      - tests/p30/test_l9ac_kham_toplevel_title.py
permissions:
  contents: read
  actions: read
concurrency:
  group: eventradar-p30-l9ac-kham-toplevel
  cancel-in-progress: false
jobs:
  kham-toplevel:
    if: github.repository == 'easonliu714/event_scraper_public'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Frozen L9-AB parent, production blobs and exact three ADD-only paths
        run: |
          set -euo pipefail
          base=f657555b16f41d4d24e4b67205c0c0019d0b12fe
          test "$(git rev-parse origin/main)" = fbf4ca02b91159f2423caf3d79fb0ca4bb747069
          test "$(git rev-parse HEAD:scraper.py)" = 98eddeafb497718c51aa81c6a150e9a5e1e687a8
          test "$(git rev-parse HEAD:docs/data.json)" = 7fc4fe32567a57fd504483eeb9a8b9e10b568ea4
          test "$(git rev-parse origin/main:docs/platform_status.json)" = e19ca37c4c80c10b7278d0813b8ff1047535d124
          git merge-base --is-ancestor "$base" HEAD
          expected="$(printf 'A\t%s\n' '.github/workflows/eventradar_p30_l9ac_kham_toplevel_title.yml' 'scripts/p30_l9ac_kham_toplevel_title.py' 'tests/p30/test_l9ac_kham_toplevel_title.py' | LC_ALL=C sort)"
          actual="$(git diff --name-status "$base" HEAD | LC_ALL=C sort)"
          test "$actual" = "$expected" || { echo HOLD_L9AC_SCOPE; exit 1; }
          git show origin/main:docs/platform_status.json > /tmp/l9ac-status.json
          echo PASS_L9AC_FROZEN_SCOPE
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned parsers and normal Chromium
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'beautifulsoup4==4.14.2' 'playwright==1.55.0'
          python -m playwright install chromium
      - name: 36 offline bounded positive/negative contracts
        run: |
          set -euo pipefail
          python -m py_compile scripts/p30_l9ac_kham_toplevel_title.py tests/p30/test_l9ac_kham_toplevel_title.py
          python -m unittest discover -s tests/p30 -p test_l9ac_kham_toplevel_title.py -v 2>&1 | tee /tmp/l9ac-tests.log
          grep -q 'Ran 36 tests' /tmp/l9ac-tests.log
          grep -q '^OK$' /tmp/l9ac-tests.log
      - uses: actions/download-artifact@v4
        with:
          name: eventradar-p30-l9ab-kham-iframe-narrow
          run-id: 40809856495
          repository: easonliu714/event_scraper_public
          github-token: ${{ github.token }}
          path: pinned-l9ab
      - name: Verify L9-AB exact parent artifact digest and manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/easonliu714/event_scraper_public/actions/artifacts/12869148942" | python -c 'import json,sys; a=json.load(sys.stdin); assert a["digest"]=="sha256:18da27a1ceec328af40ae5f2ca3eb59665bbd82e6d4258355de71cfb39458b21" and not a["expired"],"HOLD_L9AB_DIGEST"'
          (cd pinned-l9ab && sha256sum -c SHA256SUMS.txt)
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("pinned-l9ab")
          raw=(root/"kham_iframe_narrow.json").read_bytes()
          manifest=json.loads((root/"manifest.json").read_bytes())
          assert hashlib.sha256(raw).hexdigest()==manifest["filesSHA256"]["kham_iframe_narrow.json"]
          assert manifest["releaseState"]=="HARD_HOLD_NO_PUBLICATION" and manifest["published"] is False
          print("PASS_L9AC_PINNED_PARENT_SHA")
          PY
      - name: One public list and at most two same-ID details, four passive snapshots
        run: |
          set -euo pipefail
          python scripts/p30_l9ac_kham_toplevel_title.py --status /tmp/l9ac-status.json --parent pinned-l9ab/kham_iframe_narrow.json --scraper scraper.py --out p30-l9ac-evidence --live-kham
      - name: Independent privacy, HOLD and SHA readback
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("p30-l9ac-evidence")
          raw=(root/"kham_toplevel_title.json").read_bytes()
          r=json.loads(raw)
          manifest=json.loads((root/"manifest.json").read_bytes())
          assert r["kind"]=="EVENTRADAR_P30_L9AC_KHAM_TOPLEVEL_TITLE_V1"
          assert r["parentHead"]=="f657555b16f41d4d24e4b67205c0c0019d0b12fe"
          assert r["releaseState"]=="HARD_HOLD_NO_PUBLICATION"
          assert 1<=r["navigationCount"]<=3 and len(r["samples"])<=2
          assert r["formalVerifiedEventIdentity"]==r["acceptedFields"]==r["goldenAccepted"]==0
          for key in ("published","productionModified","writerExecuted","schedulerExecuted","notifierExecuted","mergeExecuted","rawHtmlPersisted","rawUrlsPersisted","rawTitlesPersisted","rawProductIdsPersisted","cookiesPersisted","screenshotsPersisted"):
              assert r[key] is False,key
          assert b"https://" not in raw and b"PRODUCT_ID=" not in raw and b"<html" not in raw.lower()
          assert hashlib.sha256(raw).hexdigest()==manifest["filesSHA256"]["kham_toplevel_title.json"]
          assert manifest["releaseState"]=="HARD_HOLD_NO_PUBLICATION" and manifest["published"] is False
          print("PASS_L9AC_SHA_PRIVACY_NO_PUBLICATION",r["decision"])
          PY
      - name: Seal SHA256SUMS
        if: always()
        run: |
          mkdir -p p30-l9ac-evidence
          if test -f p30-l9ac-evidence/manifest.json; then
            (cd p30-l9ac-evidence && sha256sum kham_toplevel_title.json manifest.json > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          else
            echo HOLD_L9AC_REPORT_MISSING
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eventradar-p30-l9ac-kham-toplevel-title
          path: p30-l9ac-evidence/
          retention-days: 14
          if-no-files-found: warn
