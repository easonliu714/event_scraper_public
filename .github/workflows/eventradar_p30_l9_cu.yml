name: EventRadar P30-L9-CU exact-head NO PUBLISH
on:
  pull_request:
    branches: [feat/eventradar-p30-l9ct-kktix-registration-403]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  exact-head:
    if: github.repository == 'easonliu714/event_scraper_public' && github.head_ref == 'feat/eventradar-p30-l9cu-tixcraft-three-show-release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact HEAD, ADD-only scope, frozen formal data
        shell: bash
        run: |
          set -euo pipefail
          base=94d32ae098a6f445e89c648c09a7bd7208f141d0
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git merge-base "$base" HEAD)" = "$base"
          expected="$(printf 'A\t%s\n' 'scripts/p30_l9cu_tixcraft_three_show_release.py' 'tests/p30/test_l9cu_tixcraft_three_show_release.py' '.github/workflows/eventradar_p30_l9_cu.yml' | LC_ALL=C sort)"
          test "$expected" = "$(git diff --name-status "$base" HEAD | LC_ALL=C sort)"
          test "$(git rev-parse origin/main:docs/data.json)" = 7fc4fe32567a57fd504483eeb9a8b9e10b568ea4
          python - <<'PY'
          import json,subprocess
          d=json.loads(subprocess.check_output(['git','show','origin/main:docs/platform_status.json']))
          assert len(d['platforms'])==19
          assert d['production']['eventFeedReleaseState']=='HARD_HOLD_NO_PUBLICATION'
          assert d['production']['goldenAccepted']==0
          PY
      - name: Previous and new source-bound negative tests
        run: |
          python -m py_compile scripts/p30_l9cu_tixcraft_three_show_release.py tests/p30/test_l9cu_tixcraft_three_show_release.py
          python -m unittest discover -s tests/p30 -p 'test_l9ct_kktix_registration_guard.py' -v
          python -m unittest discover -s tests/p30 -p 'test_l9cu_tixcraft_three_show_release.py' -v
      - name: Evidence manifest with exact HEAD
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python - <<'PY'
          import hashlib,json,pathlib,subprocess
          p=pathlib.Path('evidence')
          a={'gate':'P30-L9-CU','headSHA':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
             'officialGETinCI':0,'sourceObservationDate':'2026-11-01',
             'sourceEvidence':'tixCraft #03 same 26_aftp DETAIL/GAME three shows 11/06,07,08 at 19:30; 11/01 11:00 release notice is NOT a fourth show. GAME link prior source observation, current first-party DETAIL re-read; ticket sessions and inventory unverified.',
             'acceptedFields':0,'ticketSessionIdsVerified':0,'goldenAccepted':0,
             'published':False,'releaseState':'HARD_HOLD_NO_PUBLICATION'}
          (p/'audit.json').write_text(json.dumps(a,sort_keys=True,ensure_ascii=False)+'\n',encoding='utf-8')
          (p/'manifest.json').write_text(json.dumps({'filesSHA256':{'audit.json':hashlib.sha256((p/'audit.json').read_bytes()).hexdigest()}},sort_keys=True)+'\n')
          PY
          (cd evidence && sha256sum *.json > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eventradar_p30_l9cu-source-evidence
          path: evidence/
          if-no-files-found: error
