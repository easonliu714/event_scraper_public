name: EventRadar P30-VENUE-02AQ source role evidence (NO PUBLISH)
on:
  pull_request:
    branches: [feat/eventradar-p30-venue02ap-cloudgate-postponement]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  source-parity:
    if: github.repository == 'easonliu714/event_scraper_public' && github.head_ref == 'feat/eventradar-p30-venue02aq-fuzhong15-dual-screening'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact-head ADD-only and production freeze
        shell: bash
        run: |
          set -euo pipefail
          base=7c21a1e6cfb5a8aaa0a46bf07a1986c45a078c17
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git merge-base "$base" HEAD)" = "$base"
          expected="$(printf 'A\t%s\n' 'scripts/p30_venue02aq_fuzhong15_screenings.py' 'tests/p30/test_venue02aq_fuzhong15_screenings.py' '.github/workflows/eventradar_p30_venue02aq.yml' | LC_ALL=C sort)"
          test "$expected" = "$(git diff --name-status "$base" HEAD | LC_ALL=C sort)"
          test "$(git rev-parse origin/main:docs/data.json)" = 7fc4fe32567a57fd504483eeb9a8b9e10b568ea4
          test "$(git rev-parse origin/main:docs/platform_status.json)" = e19ca37c4c80c10b7278d0813b8ff1047535d124
      - name: Predecessor and new source-bound role regressions
        run: |
          python -m py_compile scripts/p30_venue02aq_fuzhong15_screenings.py tests/p30/test_venue02aq_fuzhong15_screenings.py
          python -m unittest discover -s tests/p30 -p 'test_venue02ap_cloudgate_postponement.py' -v
          python -m unittest discover -s tests/p30 -p 'test_venue02aq_fuzhong15_screenings.py' -v
      - name: Exact-head sanitized evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p eventradar_venue02aq-evidence
          python - <<'PY'
          import hashlib,json,pathlib,subprocess
          p=pathlib.Path('eventradar_venue02aq-evidence')
          a={'gate':'P30-VENUE-02AQ','headSHA':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'source':'FUZHONG15_P0_NEW_TAIPEI','officialGETinCI':0,'sourceObservationDate':'2026-10-31','independentOfficialReader':True,'acceptedFields':0,'goldenAccepted':0,'published':False,'decision':'HOLD_FILM_SID_NOT_TICKET_SESSION_AND_PRICE_UNVERIFIED','releaseState':'HARD_HOLD_NO_PUBLICATION'}
          (p/'audit.json').write_text(json.dumps(a,sort_keys=True)+'\n')
          (p/'manifest.json').write_text(json.dumps({'filesSHA256':{'audit.json':hashlib.sha256((p/'audit.json').read_bytes()).hexdigest()}},sort_keys=True)+'\n')
          PY
          (cd eventradar_venue02aq-evidence && sha256sum *.json > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eventradar_venue02aq-evidence
          path: eventradar_venue02aq-evidence/
          if-no-files-found: ignore
