name: EventRadar P30-VENUE-02AW exact-head NO PUBLISH
on:
  pull_request:
    branches: [feat/eventradar-p30-venue02av-ntpc-weekday-quarantine]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  exact-head:
    if: github.repository == 'easonliu714/event_scraper_public' && github.head_ref == 'feat/eventradar-p30-venue02aw-zepp-same-day-cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact-head ADD-only and frozen formal data
        shell: bash
        run: |
          set -euo pipefail
          base=3b7d8e35920de9ff87ca3acd5d003373e1dc7c94
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git merge-base "$base" HEAD)" = "$base"
          expected="$(printf 'A\t%s\n' 'scripts/p30_venue02aw_zepp_same_day_conflict.py' 'tests/p30/test_venue02aw_zepp_same_day_conflict.py' '.github/workflows/eventradar_p30_venue02aw.yml' | LC_ALL=C sort)"
          test "$expected" = "$(git diff --name-status "$base" HEAD | LC_ALL=C sort)"
          test "$(git rev-parse origin/main:docs/data.json)" = 7fc4fe32567a57fd504483eeb9a8b9e10b568ea4
          test "$(git rev-parse origin/main:docs/platform_status.json)" = e19ca37c4c80c10b7278d0813b8ff1047535d124
      - name: Predecessor and new regression
        run: |
          python -m py_compile scripts/p30_venue02aw_zepp_same_day_conflict.py tests/p30/test_venue02aw_zepp_same_day_conflict.py
          python -m unittest discover -s tests/p30 -p 'test_venue02av_ntpc_bulletin_weekday.py' -v
          python -m unittest discover -s tests/p30 -p 'test_venue02aw_zepp_same_day_conflict.py' -v
      - name: SHA256 manifest exact HEAD
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python - <<'PY'
          import hashlib,json,pathlib,subprocess
          p=pathlib.Path("evidence")
          a={"gate":"P30-VENUE-02AW","headSHA":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),"officialGETinCI":0,"sourceObservationDate":"2026-11-01","sourceEvidence":"Zepp New Taipei official Nov LIST shows two separate 2026-11-28 18:00 events: rid=160673 AKASAKI marked (取消), rid=169301 PERSES not marked cancelled. Same venue/time collision is HOLD; no status cascade or auto-resolution. PERSES KKTIX is a venue-declared platform and 'Link in Bio' is not a verified ticket URL/ID. Formal FIELD=0; no live CI GET.","acceptedFields":0,"ticketSessionIdsVerified":0,"goldenAccepted":0,"published":False,"releaseState":"HARD_HOLD_NO_PUBLICATION"}
          (p/"audit.json").write_text(json.dumps(a,sort_keys=True)+"\n")
          (p/"manifest.json").write_text(json.dumps({"filesSHA256":{"audit.json":hashlib.sha256((p/"audit.json").read_bytes()).hexdigest()}},sort_keys=True)+"\n")
          PY
          (cd evidence && sha256sum *.json > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eventradar-p30-venue-02aw-source-evidence
          path: evidence/
          if-no-files-found: ignore
