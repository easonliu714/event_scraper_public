name: EventRadar P30-L9-BZ delisted title boundary (NO PUBLISH)
on:
  pull_request:
    branches: [feat/eventradar-p30-l9by-opentix-xinzhuang-parity]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  source-parity:
    if: github.repository == 'easonliu714/event_scraper_public' && github.head_ref == 'feat/eventradar-p30-l9bz-opentix-delisted-title-boundary'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact-head ADD-only and production freeze
        shell: bash
        run: |
          set -euo pipefail
          base=907168369fe605f4f895ecd28ce721555de0f849
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git merge-base "$base" HEAD)" = "$base"
          expected="$(printf 'A\t%s\n' 'scripts/p30_l9bz_opentix_delisted_title.py' 'tests/p30/test_l9bz_opentix_delisted_title.py' '.github/workflows/eventradar_p30_l9bz.yml' | LC_ALL=C sort)"
          test "$expected" = "$(git diff --name-status "$base" HEAD | LC_ALL=C sort)"
          test "$(git rev-parse origin/main:docs/data.json)" = 7fc4fe32567a57fd504483eeb9a8b9e10b568ea4
          test "$(git rev-parse origin/main:docs/platform_status.json)" = e19ca37c4c80c10b7278d0813b8ff1047535d124
      - name: Predecessor and new source-role tests
        run: |
          python -m py_compile scripts/p30_l9bz_opentix_delisted_title.py tests/p30/test_l9bz_opentix_delisted_title.py
          python -m unittest discover -s tests/p30 -p test_l9by_opentix_xinzhuang_parity.py -v
          python -m unittest discover -s tests/p30 -p test_l9bz_opentix_delisted_title.py -v
      - name: Exact-head sanitized evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p eventradar_l9bz-evidence
          python - <<'PY'
          import hashlib,json,pathlib,subprocess
          p=pathlib.Path('eventradar_l9bz-evidence')
          a={'gate':'P30-L9-BZ','headSHA':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'source':'OPENTIX#05','officialGETinCI':0,'sourceObservationDate':'2026-10-31','independentOfficialReader':True,'acceptedFields':0,'goldenAccepted':0,'published':False,'decision':'HOLD_DIRECT_LINK_BUT_NONEXACT_TITLE_AND_DELISTED','releaseState':'HARD_HOLD_NO_PUBLICATION'}
          (p/'audit.json').write_text(json.dumps(a,sort_keys=True)+'\n')
          (p/'manifest.json').write_text(json.dumps({'filesSHA256':{'audit.json':hashlib.sha256((p/'audit.json').read_bytes()).hexdigest()}},sort_keys=True)+'\n')
          PY
          (cd eventradar_l9bz-evidence && sha256sum *.json > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eventradar_l9bz-evidence
          path: eventradar_l9bz-evidence/
          if-no-files-found: ignore
